name = "admission-gk"
main = "worker-bundle.mjs"
compatibility_date = "2024-11-01"
workers_dev = true

[vars]
FIREBASE_CONTINUE_URL = "https://admissionsky.pages.dev/?firebaseVerified=1"
GOOGLE_AUTH_ACTIVATION = "enabled"
PASSKEY_AUTH_ACTIVATION = "enabled"
VERIFICATION_AUTH_ACTIVATION = "enabled"
# Internal admission caps, not provider-reported quotas. otp-a is Brevo (free 300/day)
# and otp-b is the free Google Apps Script mailer (Gmail 100/day).
# otp-b gets the full 20s ceiling: Apps Script answers through a redirect and its
# cold start has been measured at ~11s, so a 15s budget dropped live probes.
# otp-d is Resend (free 100/day); it stays behind the three mailers the owner
# already trusts and only becomes eligible once RESEND_FROM_ADDRESS is bound.
# otp-c is Mailjet. It is enabled as the owner's explicit last-resort backup
# (instruction of 2026-10-14): it sits at the END of the mailer order, after every
# sender that actually delivers, so it is only reached once all of them are exhausted.
# It cannot carry a freemail sender: Mailjet's own /v3/REST/dns output asks for
# `mailjet._domainkey.gmail.com` plus `v=spf1 include:spf.mailjet.com ?all` on
# gmail.com's zone, which only Google controls, so a send can report success while the
# message is never delivered. At priority 45 that costs nothing in normal operation and
# becomes a real channel the moment a verified sender on an owner-controlled domain
# exists.
# otp-e is AgentMail (free 100/day). It is the exception that needs neither a
# verified domain nor a from-address, because it signs each message with the
# inbox it sends from.
# otp-g is Dead Simple Email. Like AgentMail it sends from a provider-signed
# inbox with no owner domain, and its free plan has no daily cap (5,000/month).
#
# LOCKED LAST-RESORT PAIR (owner order 2026-10-14): otp-g (Dead Simple) and
# otp-c (Mailjet) are the two last-resort slots and MUST stay enabled. The owner
# confirmed both are last resort and that their relative order does not matter
# ("যেকোনো একটা আগে পিছে হলে সমস্যা নেই"), so both sit after every reliable
# mailer and only Telegram (priority 50) follows. Do NOT disable either, and do
# NOT move another mailer behind them; `native-auth-protection.test.mjs` fails
# if this pairing breaks. Dead Simple delivery lands in Gmail spam by design
# (shared inbox domain) — it is kept only as a final channel, never a primary.
# timeoutMs (owner 2026-10-16): a timeout fails over at once (no same-slot retry), so each slot gets its real speed: mailers 8s, Logto/Appwrite/Ory/Hanko 12s, Apps Script otp-b 20s (cold start ~11s), Telegram 20s.
VERIFICATION_ORCHESTRATOR_CONFIG = '{"enabled":true,"providers":[{"id":"otp-a","enabled":true,"priority":10,"dailyQuota":300,"timeoutMs":8000,"label":"secure backup"},{"id":"otp-h","enabled":true,"priority":15,"dailyQuota":5000,"timeoutMs":12000,"label":"secure backup"},{"id":"otp-i","enabled":true,"priority":38,"dailyQuota":300,"timeoutMs":12000,"label":"secure backup"},{"id":"otp-j","enabled":true,"priority":38,"dailyQuota":300,"timeoutMs":12000,"label":"secure backup"},{"id":"otp-k","enabled":true,"priority":38,"dailyQuota":300,"timeoutMs":12000,"label":"secure backup"},{"id":"otp-l","enabled":true,"priority":38,"dailyQuota":1000,"timeoutMs":12000,"label":"secure backup","projectId":"P3Km4McYmZUg8ZzIJfEnf9ZCDkFD"},{"id":"otp-m","enabled":true,"priority":38,"dailyQuota":1000,"timeoutMs":12000,"label":"login link","projectId":"P3Km4McYmZUg8ZzIJfEnf9ZCDkFD"},{"id":"otp-b","enabled":true,"priority":20,"dailyQuota":100,"timeoutMs":20000,"label":"secure backup"},{"id":"otp-d","enabled":true,"priority":35,"dailyQuota":100,"timeoutMs":8000,"label":"secure backup"},{"id":"otp-e","enabled":true,"priority":37,"dailyQuota":100,"timeoutMs":8000,"label":"secure backup"},{"id":"otp-f","enabled":true,"priority":38,"dailyQuota":100,"timeoutMs":8000,"label":"secure backup"},{"id":"otp-g","enabled":true,"priority":39,"dailyQuota":150,"timeoutMs":8000,"label":"secure backup"},{"id":"otp-c","enabled":true,"priority":45,"dailyQuota":200,"timeoutMs":8000,"label":"secure backup"},{"id":"telegram","enabled":true,"priority":50,"dailyQuota":172800,"timeoutMs":20000,"label":"secure backup"}]}'
# otp-i is Appwrite Cloud Email OTP (project 6ad1e9280025bf4464ee, fra region), added
# 2026-10-16. Owner order (same day): moved 17 -> 38 so it runs AFTER every branded
# mailer (own logo/subject; ties sort by id so otp-f MailerSend goes first) and BEFORE
# the spam-prone last-resort pair. Endpoint and project id are public and live in
# providers.mjs (APPWRITE_PUBLIC_DEFAULTS) to stay under the 64-variable ceiling;
# dailyQuota 300 above is our own safety cap. Optional secret APPWRITE_API_KEY.
# otp-j is Ory Network one-time code (project "Admission Sky", free Developer plan),
# added 2026-10-16. Ory mails the code from its own SMTP (sender "Admission Sky via
# Ory"; subject/body are Ory's default and stay so: changing them needs own SMTP).
# Public native self-service API, no secret; the session a correct code yields is
# revoked at once. Endpoint lives in providers.mjs (ORY_PUBLIC_DEFAULTS).
# otp-k is Hanko Cloud passcode (free, 10,000 MAU; Hanko's own mailer), added
# 2026-10-16. Public Flow API, no secret. Needs passwords OFF and account deletion
# ON in the Hanko console: each verified address is deleted from Hanko right after
# the check. Endpoint lives in providers.mjs (HANKO_PUBLIC_DEFAULTS).
# Both sit at priority 38 like otp-i (ties sort by id: f, i, j, k), after every
# branded mailer and before the locked last-resort pair; dailyQuota 300 is our
# own cap. No new vars or secrets (64-variable ceiling).
OTP_A_DAILY_QUOTA = "300"
OTP_B_DAILY_QUOTA = "100"
# otp-h (Logto) endpoint, app id and redirect are public values kept in
# auth-native/verification/providers.mjs (LOGTO_PUBLIC_DEFAULTS) and its daily cap
# is the otp-h dailyQuota above (5000), not separate vars here:
# adding them as vars pushed the Worker to 68 of the 64-variable free ceiling.
# Raised 1000 -> 5000 on the owner's order (2026-10-15). Logto's built-in email
# service documents no daily sending limit, so this number is our own safety
# ceiling, not a provider constraint — unlike otp-a..g, whose caps track real
# free tiers. It is the backup slot's headroom beyond Firebase's 1000/day.
OTP_C_DAILY_QUOTA = "200"
OTP_D_DAILY_QUOTA = "100"
OTP_E_DAILY_QUOTA = "100"
OTP_F_DAILY_QUOTA = "100"
TELEGRAM_AUTH_WEBHOOK_URL = "https://admission-gk.admissionhub.workers.dev/api/auth/v1/telegram/webhook"
TELEGRAM_AUTH_DAILY_QUOTA = "172800"
# Cloudflare Workers AI backup list (Phase 9 M2.5). Free 10,000 Neurons/day.
# The model list is NOT set here: the router falls back to the identical default
# @cf/meta/llama-3.3-70b-instruct-fp8-fast, and Workers Free caps a Worker at 64
# variables (secrets + text), which this Worker already sits on. Bind
# AGENT_CLOUDFLARE_MODELS as a secret only if a catalogue change demands it.
#
# Phase 9 M4 Context Engine — typed, permission-scoped context. Off by default;
# flip to "enabled" to append the scoped context bundle to the system prompt.
USE_CONTEXT_ENGINE = "enabled"

# P25 chat response cache (owner order 2026-10-15, step 1 of the AI cost plan).
# Live in code by default (ai-chat-cache.mjs chatCacheEnabled). NO variable is
# added here on purpose: the Worker already sits on the Workers Free ceiling of 64
# variables and a 65th is rejected on deploy. To turn it off without a deploy,
# bind a secret AI_CHAT_CACHE = "off" from the dashboard.

# Phase 9 M9 Write/Execute actions. Live by default (code-level `ENABLED = true`).
# Do NOT add a variable here: the Worker already sits on the Workers Free ceiling
# of 64 variables (secrets + text), and a 65th is rejected on deploy. To turn the
# layer off, bind a secret `USE_WRITE_ACTIONS = "disabled"` from the dashboard —
# any other value keeps it on.

[triggers]
crons = ["* * * * *"]

[[durable_objects.bindings]]
name = "EMAIL_COORDINATOR"
class_name = "EmailGatewayCoordinator"

[[durable_objects.bindings]]
name = "AUTH_AUTHORITY"
class_name = "AdmissionAuthAuthority"

# P23 — live voice agent. Holds the WebSocket for one conversation and owns the
# durable memory, so a provider-key swap never loses context. Provider pools are
# secrets (VOICE_STT_POOL / VOICE_LLM_POOL / VOICE_TTS_POOL), not vars: the
# Worker already sits on the Workers Free ceiling of 64 variables.
[[durable_objects.bindings]]
name = "VOICE_AGENT"
class_name = "VoiceAgentSession"

# AI chat state — per-user quota and memory, moved off Workers KV. The free KV
# allowance is 1,000 writes a day and the chat wrote three keys a message, so
# the whole feature was capped at a few hundred chats; this object allows
# 100,000 requests a day.
[[durable_objects.bindings]]
name = "AI_STATE"
class_name = "AiStateObject"

[[migrations]]
tag = "v1-email-gateway-coordinator"
new_sqlite_classes = ["EmailGatewayCoordinator"]

[[migrations]]
tag = "v2-native-auth-authority"
new_sqlite_classes = ["AdmissionAuthAuthority"]

[[migrations]]
tag = "v3-voice-agent"
new_sqlite_classes = ["VoiceAgentSession"]

[[migrations]]
tag = "v4-ai-state"
new_sqlite_classes = ["AiStateObject"]

[[kv_namespaces]]
binding = "GK_KV"
id = "b9353515b098427687afcfb8654ed359"

[[kv_namespaces]]
binding = "PUB_KV"
id = "b9353515b098427687afcfb8654ed359"

[[kv_namespaces]]
binding = "OLD_KV"
id = "942828aa82e546d4af11796ef92ab134"

# Phase 7 — profile avatar store (avatars BLOBs). Core profile data stays in the DO SQLite DB.
[[d1_databases]]
binding = "PROFILE_DB"
database_name = "admission-profile"
database_id = "8f7cf101-66a3-437d-bc98-a8984698d7f5"

# R2 file storage (owner-approved 2026-09-18) — private objects,
# served from our own domain ($0 egress). S3 API creds stay in the
# dashboard only; the worker uses this binding, no secrets needed.
[[r2_buckets]]
binding = "FILE_BUCKET"
bucket_name = "admission-hub"

# AUTH-ROADMAP step 0 (owner 2026-10-18): keep Workers Logs on permanently.
# Without this block every `wrangler deploy` turns the Worker's logs off again.
# Not a variable, so it does not count toward the 64-variable ceiling.
[observability]
enabled = true
head_sampling_rate = 1
