name = "admission-gk"
main = "worker-bundle.mjs"
compatibility_date = "2024-11-01"
workers_dev = true

[vars]
FIREBASE_CONTINUE_URL = "https://admissionhub.pages.dev/?firebaseVerified=1"
GOOGLE_AUTH_ACTIVATION = "enabled"
PASSKEY_AUTH_ACTIVATION = "canary"
VERIFICATION_AUTH_ACTIVATION = "enabled"
# Email OTP rides the generic backup channel. The exposure is self-gating: the
# button only appears when the orchestrator reports a healthy provider, which
# needs the OTP_A_PROVIDER_APPS_SCRIPT_URL + OTP_A_PROVIDER_SHARED_SECRET secrets.
VERIFICATION_EMAIL_OTP_PUBLICATION = "enabled"
# Internal admission cap: existing 120 challenges/minute global limiter × 1,440; this is not a Telegram-reported quota.
VERIFICATION_ORCHESTRATOR_CONFIG = '{"enabled":true,"providers":[{"id":"otp-a","enabled":true,"priority":10,"dailyQuota":100,"timeoutMs":20000,"label":"email code"},{"id":"telegram","enabled":true,"priority":50,"dailyQuota":172800,"timeoutMs":20000,"label":"secure backup"}]}'
TELEGRAM_AUTH_WEBHOOK_URL = "https://admission-gk.admissionhub.workers.dev/api/auth/v1/telegram/webhook"
TELEGRAM_AUTH_DAILY_QUOTA = "172800"

[triggers]
crons = ["30 18 * * *"]

[[durable_objects.bindings]]
name = "EMAIL_COORDINATOR"
class_name = "EmailGatewayCoordinator"

[[durable_objects.bindings]]
name = "AUTH_AUTHORITY"
class_name = "AdmissionAuthAuthority"

[[migrations]]
tag = "v1-email-gateway-coordinator"
new_sqlite_classes = ["EmailGatewayCoordinator"]

[[migrations]]
tag = "v2-native-auth-authority"
new_sqlite_classes = ["AdmissionAuthAuthority"]

[[kv_namespaces]]
binding = "GK_KV"
id = "b9353515b098427687afcfb8654ed359"

[[kv_namespaces]]
binding = "PUB_KV"
id = "b9353515b098427687afcfb8654ed359"

[[kv_namespaces]]
binding = "OLD_KV"
id = "942828aa82e546d4af11796ef92ab134"

# Phase 7 — profile avatar store (avatars BLOBs). Core profile data stays in the DO SQLite DB.
[[d1_databases]]
binding = "PROFILE_DB"
database_name = "admission-profile"
database_id = "8f7cf101-66a3-437d-bc98-a8984698d7f5"
