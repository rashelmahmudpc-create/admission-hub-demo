name = "admission-gk"
main = "worker-bundle.mjs"
compatibility_date = "2024-11-01"
workers_dev = true

[vars]
FIREBASE_CONTINUE_URL = "https://admissionhub.pages.dev/?firebaseVerified=1"
GOOGLE_AUTH_ACTIVATION = "enabled"
PASSKEY_AUTH_ACTIVATION = "enabled"
VERIFICATION_AUTH_ACTIVATION = "enabled"
# Internal admission caps, not provider-reported quotas. otp-a is Brevo (free 300/day),
# otp-b is the free Google Apps Script mailer (Gmail 100/day) and otp-c is Mailjet
# (free 200/day). All three verify a single sender address, so no custom domain is needed.
# otp-b gets the full 20s ceiling: Apps Script answers through a redirect and its
# cold start has been measured at ~11s, so a 15s budget dropped live probes.
# otp-d is Resend (free 100/day); it stays behind the three mailers the owner
# already trusts and only becomes eligible once RESEND_FROM_ADDRESS is bound.
VERIFICATION_ORCHESTRATOR_CONFIG = '{"enabled":true,"providers":[{"id":"otp-a","enabled":true,"priority":10,"dailyQuota":300,"timeoutMs":15000,"label":"secure backup"},{"id":"otp-b","enabled":true,"priority":20,"dailyQuota":100,"timeoutMs":20000,"label":"secure backup"},{"id":"otp-c","enabled":true,"priority":30,"dailyQuota":200,"timeoutMs":15000,"label":"secure backup"},{"id":"otp-d","enabled":true,"priority":35,"dailyQuota":100,"timeoutMs":15000,"label":"secure backup"},{"id":"telegram","enabled":true,"priority":50,"dailyQuota":172800,"timeoutMs":20000,"label":"secure backup"}]}'
OTP_A_DAILY_QUOTA = "300"
OTP_B_DAILY_QUOTA = "100"
OTP_C_DAILY_QUOTA = "200"
OTP_D_DAILY_QUOTA = "100"
TELEGRAM_AUTH_WEBHOOK_URL = "https://admission-gk.admissionhub.workers.dev/api/auth/v1/telegram/webhook"
TELEGRAM_AUTH_DAILY_QUOTA = "172800"

[triggers]
crons = ["* * * * *"]

[[durable_objects.bindings]]
name = "EMAIL_COORDINATOR"
class_name = "EmailGatewayCoordinator"

[[durable_objects.bindings]]
name = "AUTH_AUTHORITY"
class_name = "AdmissionAuthAuthority"

[[migrations]]
tag = "v1-email-gateway-coordinator"
new_sqlite_classes = ["EmailGatewayCoordinator"]

[[migrations]]
tag = "v2-native-auth-authority"
new_sqlite_classes = ["AdmissionAuthAuthority"]

[[kv_namespaces]]
binding = "GK_KV"
id = "b9353515b098427687afcfb8654ed359"

[[kv_namespaces]]
binding = "PUB_KV"
id = "b9353515b098427687afcfb8654ed359"

[[kv_namespaces]]
binding = "OLD_KV"
id = "942828aa82e546d4af11796ef92ab134"

# Phase 7 — profile avatar store (avatars BLOBs). Core profile data stays in the DO SQLite DB.
[[d1_databases]]
binding = "PROFILE_DB"
database_name = "admission-profile"
database_id = "8f7cf101-66a3-437d-bc98-a8984698d7f5"

# R2 file storage (owner-approved 2026-09-18) — private objects,
# served from our own domain ($0 egress). S3 API creds stay in the
# dashboard only; the worker uses this binding, no secrets needed.
[[r2_buckets]]
binding = "FILE_BUCKET"
bucket_name = "admission-hub"
