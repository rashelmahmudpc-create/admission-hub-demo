# Sky AI Worker — F0.1 / DV-01. Deployed only via
# .github/workflows/sky-ai-deploy.yml (manual, confirmation: DEPLOY, main only).
# No vars or secrets yet: this Worker exists so new AI config does not have to
# fit into admission-gk's full 64-variable budget.
name = "sky-ai"
main = "worker.mjs"
compatibility_date = "2024-11-01"
workers_dev = true

[observability]
enabled = true
head_sampling_rate = 1

# F0.1 step 4b: same KV namespace as admission-gk's PUB_KV (read-only use:
# aiprefs:<uid> and the internal key secret:sky-internal). A binding, not a var.
[[kv_namespaces]]
binding = "PUB_KV"
id = "b9353515b098427687afcfb8654ed359"
