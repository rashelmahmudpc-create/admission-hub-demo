# Sky AI Worker — F0.1 / DV-01. Deployed only via
# .github/workflows/sky-ai-deploy.yml (manual, confirmation: DEPLOY, main only).
# No vars or secrets yet: this Worker exists so new AI config does not have to
# fit into admission-gk's full 64-variable budget.
name = "sky-ai"
main = "worker.mjs"
compatibility_date = "2024-11-01"
# Owner 2026-10-21: no public URL. sky-ai is reachable only through
# admission-gk's SKY_AI service binding, so the internal caller headers
# (x-sky-ai-caller / x-sky-uid) cannot be forged from the internet.
workers_dev = false

[observability]
enabled = true
head_sampling_rate = 1
