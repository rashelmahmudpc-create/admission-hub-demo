name: Apply nav dock 2026-10-17

# Applies scripts/apply-nav-dock-20261017.py on the feature branch: every
# screen that shows a bottom bar now draws the SAME floating dock as the
# Dashboard (Home, Bank, AI orb, Exam, Profile) instead of the old flat bar.
# Adds nav-dock.js + nav-dock.test.mjs, loads nav-dock.js in index.html,
# regenerates the sw.js digests, runs the tests and commits the result back to
# the SAME branch. It never touches main and never deploys.

on:
  push:
    branches: [fix/nav-dock-v2]
    paths:
      - '.github/workflows/apply-nav-dock-20261017.yml'
      - 'scripts/apply-nav-dock-20261017.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-nav-dock-20261017
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref_name == 'fix/nav-dock-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/nav-dock-v2
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply the nav dock patch
        run: |
          set -eu
          python3 scripts/apply-nav-dock-20261017.py
          python3 scripts/apply-nav-dock-20261017.py >/dev/null
          grep -q 'src="nav-dock.js?v=dock-v1-20261017"' index.html
          grep -q "window.bottomNavHtml = function ahNavDock" nav-dock.js
          node --check nav-dock.js
          git diff --stat
      - name: Install, worker bundle check, refresh the service-worker digests
        run: |
          set -eu
          npm ci
          npm run build:worker
          npm run check:worker-bundle
          npm run sw:manifest
      - name: Nav dock tests (must pass)
        run: node --test --test-concurrency=1 nav-dock.test.mjs a11y-core.test.mjs panel-fullscreen.test.mjs p21-ai-agent-ui.test.mjs dead-handler-guard.test.mjs p15-pwa-offline.test.mjs
      - name: Wider dashboard tests (informational; these fail on main too)
        continue-on-error: true
        run: node --test --test-concurrency=1 p11-dashboard-v2.test.mjs p16-dashboard-single.test.mjs p18-legacy-dashboard-kill.test.mjs
      - name: Commit and push to the feature branch
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nav-dock.js nav-dock.test.mjs index.html sw.js
          if git diff --cached --quiet; then echo 'Nothing to commit (already applied).'; else
            git commit -m 'feat(nav): every screen with a bottom bar shows the Dashboard dock (Home, Bank, AI orb, Exam, Profile)' -m 'Applied by apply-nav-dock-20261017.yml. No deploy.'
            git push origin HEAD:fix/nav-dock-v2
          fi
          npm run check:sw-manifest
