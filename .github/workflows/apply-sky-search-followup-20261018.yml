name: Apply Sky search follow-up fix 2026-10-18

# Owner 2026-10-18: a follow-up admission question was answered from memory (wrong).
# Follow-ups now search with the earlier topic, 'my' + admission date searches, session
# years stay in the query, a failed/empty search forbids answering from memory.
# Package checked by SHA-256, final tree by fingerprint. Never deploys.

on:
  push:
    branches: [fix/sky-search-followup]
    paths: ['.github/workflows/apply-sky-search-followup-20261018.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  PKG_URL: https://backend.composio.dev/api/v3/sl/TsmmthZk1l
  PKG_SHA256: a681ac78350168f334f858343e462213bb3f9e970db5de2d7057eb523787c086
  BASE: 3ffcdc1d5ff5d9f5e1ab0532efb48a0fa89a8440
  WF: .github/workflows/apply-sky-search-followup-20261018.yml

jobs:
  apply:
    if: github.ref_name == 'fix/sky-search-followup'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/sky-search-followup
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Already applied?
        id: done
        run: |
          if grep -q 'searchQueryFor' sky-tools.mjs; then echo 'already=1' >> "$GITHUB_OUTPUT"; fi
      - name: Overlay and verify tree
        if: steps.done.outputs.already != '1'
        run: |
          set -eu
          [ "$(git rev-parse HEAD~1)" = "$BASE" ] || { echo 'branch moved'; exit 1; }
          curl -fsSL --retry 3 -L "$PKG_URL" -o /tmp/pkg.tgz
          echo "$PKG_SHA256  /tmp/pkg.tgz" | sha256sum -c -
          mkdir /tmp/pk && tar xzf /tmp/pkg.tgz -C /tmp/pk
          cp -a /tmp/pk/f/. .
          for f in ai-agent.js sky-tools.mjs sky-web-search.mjs prompt-registry.js; do node --check "$f"; done
          git add -A
          FP=$(git ls-files -s | grep -vF "$WF" | awk '{print $2, $4}' | sha256sum | cut -c1-64)
          [ "$FP" = "$(cat /tmp/pk/fp)" ] || { echo 'tree fingerprint mismatch'; git status --short; exit 1; }
      - name: Checks and tests
        if: steps.done.outputs.already != '1'
        run: |
          set -eu
          npm ci --ignore-scripts
          npm run check:worker-bundle
          cp sw.js /tmp/sw.packaged.js; npm run sw:manifest; cmp sw.js /tmp/sw.packaged.js
          for f in pr2-fast-start pr3-shared-answers sky-contact sky-core-memory phase9-m5-prompt-registry ai-agent-f1 ai-live-stages p30-ai-latency-cache p25-chat-cache ai-chat-history p06-personal-tutor honesty-guard i18n-guard p15-pwa-offline p21-ai-agent-ui dead-handler-guard panel-fullscreen sky-onboarding seo-routing sky-agent-tools account-retirement sky-daily-report sky-web-search sky-time-memory; do
            echo "::group::$f"; node "$f.test.mjs"; echo "::endgroup::"
          done
      - name: Commit and push
        if: steps.done.outputs.already != '1'
        run: |
          set -eu
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -qm 'fix(sky): follow-up admission questions search again with the earlier topic; failed search never answered from memory'
          git push origin HEAD:fix/sky-search-followup
