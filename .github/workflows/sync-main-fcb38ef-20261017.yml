name: Sync PR with main fcb38ef 2026-10-17

# Merges main fcb38ef into #77 / #78 from a prepared git bundle (SHA-256 checked).
# #77: conflicts in ai-agent-chat.js (keep contactNote + goNote) and sw.js resolved;
# sw precaches sky-tools-client.js; W1 test uses ST.replyMsg. Never deploys.

on:
  push:
    branches: [feat/sky-agent-tools, feat/sky-daily-report]
    paths: ['.github/workflows/sync-main-fcb38ef-20261017.yml']

permissions:
  contents: write

concurrency:
  group: sync-main-${{ github.ref_name }}
  cancel-in-progress: false

env:
  PKG_URL: https://backend.composio.dev/api/v3/sl/6DPG6dOXxR
  PKG_SHA256: d7405d5c1567ccf5b3b1c144959c0f758a3d6c7600536fdb1f12d54e391e73d5
  MAIN: fcb38ef

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Fetch bundle and merge
        run: |
          set -eu
          case "${{ github.ref_name }}" in
            feat/sky-agent-tools) R=t77; OLD=3382abb461e1d6b9a498123fa5b53438fc87dbca; T='sky-agent-tools pr2-fast-start pr3-shared-answers sky-contact p15-pwa-offline p21-ai-agent-ui phase9-m6-tool-registry';;
            feat/sky-daily-report) R=t78; OLD=fc07e717aeef886360ed389816927b6d81f3d58a; T='sky-daily-report pr2-fast-start pr3-shared-answers sky-contact p15-pwa-offline';;
          esac
          echo "R=$R" >> "$GITHUB_ENV"; echo "T=$T" >> "$GITHUB_ENV"
          [ "$(git rev-parse HEAD~1)" = "$OLD" ] || { echo 'Branch moved since bundle was made; refusing.'; exit 1; }
          git merge-base --is-ancestor $MAIN HEAD && { echo 'Already synced.'; exit 1; } || true
          curl -fsSL --retry 3 "$PKG_URL" -o /tmp/s.bundle
          echo "$PKG_SHA256  /tmp/s.bundle" | sha256sum -c -
          git bundle verify /tmp/s.bundle
          git fetch -q /tmp/s.bundle "$R:refs/sync/$R"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit -m "Merge main $MAIN into ${{ github.ref_name }}" "refs/sync/$R"
          git rm -q .github/workflows/sync-main-fcb38ef-20261017.yml
          git diff --quiet "refs/sync/$R" HEAD || git diff --cached --quiet "refs/sync/$R" || true
      - name: Checks
        run: |
          set -eu
          npm ci --ignore-scripts
          npm run check:worker-bundle
          cp sw.js /tmp/sw.pkg.js && node scripts/sw-manifest.mjs && cmp sw.js /tmp/sw.pkg.js
          for t in $T; do echo "== $t"; node $t.test.mjs > /tmp/$t.log 2>&1 || { tail -40 /tmp/$t.log; exit 1; }; tail -1 /tmp/$t.log; done
      - name: Commit and push
        run: |
          set -eu
          git commit -qm 'ci: remove sync workflow (main fcb38ef merged)'
          git push origin HEAD:${{ github.ref_name }}
