name: Apply Sky admission goal step 3 (2026-10-18)

# Owner plan step 3: Sky keeps the student's admission goal in mind. A study-
# advice / admission question gets an ADMISSION GOAL block (profile target, else
# the goal said in chat); unknown goal -> Sky asks once. Memory: goal said in
# chat is remembered, a goal question never overwrites it, clauses stay apart.
# Chat-open reminder mentions the goal. skyv12 -> skyv13.
# Commits to this branch only. Never touches main, never deploys.

on:
  push:
    branches: [feat/sky-goal-20261018]
    paths: ['.github/workflows/apply-sky-goal-20261018.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  PKG_URL: https://backend.composio.dev/api/v3/sl/sjzfb-soHV
  PKG_SHA256: 4b714f1549ae9e29bdbbeb044ea8c98d0d936b1044f8f7beff00823f58104330
  BASE: a649c08307b8ebaa6a3ddb0360de87c98c3d242d

jobs:
  apply:
    if: github.ref_name == 'feat/sky-goal-20261018'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/sky-goal-20261018
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Already applied?
        id: done
        run: |
          if [ -f sky-goal.mjs ]; then echo 'already=1' >> "$GITHUB_OUTPUT"; fi
      - name: Overlay
        if: steps.done.outputs.already != '1'
        run: |
          set -eu
          git diff --quiet "$BASE" HEAD -- account-retirement.test.mjs ai-agent-chat.js ai-agent.js index.html memory-engine.js p11-dashboard-v2.test.mjs p21-ai-agent-ui.test.mjs sky-recall.mjs startup-ai-regression.test.mjs sw.js worker-bundle.mjs || { echo 'patched files changed since BASE'; exit 1; }
          curl -fsSL --retry 3 -L "$PKG_URL" -o /tmp/pkg.tgz
          echo "$PKG_SHA256  /tmp/pkg.tgz" | sha256sum -c -
          mkdir /tmp/pk && tar xzf /tmp/pkg.tgz -C /tmp/pk
          cp -a /tmp/pk/f/. .
          git add -A
          git diff --cached --stat
      - name: Checks and tests
        if: steps.done.outputs.already != '1'
        run: |
          set -eu
          npm ci --ignore-scripts
          npm run check:worker-bundle
          cp sw.js /tmp/sw.packaged.js; npm run sw:manifest; cmp sw.js /tmp/sw.packaged.js
          for f in sky-goal sky-recall sky-memory-weak-recall sky-core-memory p21-ai-agent-ui ai-audit-fixes ai-agent-f1 ai-chat-history ai-live-stages ai-provider-adapters p06-personal-tutor p25-chat-cache p27-history-trim phase9-m10-observability phase9-m4-context-engine phase9-m5-prompt-registry phase9-m8-response-validation phase9-m9-action-ui pr3-shared-answers sky-agent-tools sky-contact sky-daily-report sky-time-memory sky-web-search voice-agent-client-core voice-agent; do
            echo "::group::$f"; node --test "$f.test.mjs"; echo "::endgroup::"
          done
      - name: Commit and push
        if: steps.done.outputs.already != '1'
        run: |
          set -eu
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -qm 'feat(ai): Sky keeps the admission goal in mind and shapes advice around it (step 3)'
          git push origin HEAD:feat/sky-goal-20261018
