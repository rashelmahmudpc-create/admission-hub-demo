name: Apply otp-i Appwrite slot 2026-10-16

# Applies scripts/apply-otp-i-appwrite-20261016.py on the feature branch,
# regenerates worker-bundle.mjs, runs the verification tests and commits the
# result back to the SAME branch. It never touches main and never deploys:
# merge the PR and run deploy-pages-worker.yml to go live.

on:
  push:
    branches: [feat/otp-i-appwrite]
    paths:
      - '.github/workflows/apply-otp-i-appwrite-20261016.yml'
      - 'scripts/apply-otp-i-appwrite-20261016.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-otp-i-appwrite-20261016
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref_name == 'feat/otp-i-appwrite'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/otp-i-appwrite
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply the otp-i (Appwrite) patch
        run: |
          set -eu
          python3 scripts/apply-otp-i-appwrite-20261016.py
          grep -q "'otp-i'" auth-native/verification/config.mjs
          grep -q '"id":"otp-i"' wrangler.toml
          grep -q 'class AppwriteOtpVerificationProvider' auth-native/verification/providers.mjs
      - name: Install and rebuild the Worker bundle
        run: |
          set -eu
          npm ci
          npm run build:worker
          npm run check:worker-bundle
      - name: Verification tests
        run: node --test --test-concurrency=1 verification-providers.test.mjs verification-orchestrator.test.mjs compact-auth-config.test.mjs free-tier-failover.test.mjs backup-public-handler.test.mjs email-branding.test.mjs
      - name: Commit and push to the feature branch
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add auth-native/verification/providers.mjs auth-native/verification/config.mjs wrangler.toml verification-providers.test.mjs worker-bundle.mjs
          if git diff --cached --quiet; then echo 'Nothing to commit (already applied).'; else
            git commit -m 'feat(otp): apply otp-i Appwrite slot and regenerate worker-bundle.mjs' -m 'Applied by apply-otp-i-appwrite-20261016.yml. No deploy.'
            git push origin HEAD:feat/otp-i-appwrite
          fi
