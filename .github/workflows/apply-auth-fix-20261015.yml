name: Apply auth fix 2026-10-15

# Owner-approved (2026-10-15). Applies scripts/auth-fix-20261015.py to the
# current main, rebuilds the Worker bundle and service-worker digests, runs the
# auth regression tests and pushes the result. Idempotent: a second run is a no-op.

on:
  push:
    branches: [main]
    paths:
      - 'scripts/auth-fix-20261015.py'
      - '.github/workflows/apply-auth-fix-20261015.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-auth-fix-20261015
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply source changes
        run: python3 scripts/auth-fix-20261015.py
      - name: Syntax check
        run: |
          node --check account-access.js
          node --check _worker.js
          node -e "Promise.all([import('./auth-native/worker/public-auth-handler.mjs'),import('./auth-native/verification/orchestrator.mjs'),import('./auth-native/providers/firebase-auth.mjs')]).then(()=>console.log('modules ok'))"
      - name: Rebuild Worker bundle and service-worker digests
        run: |
          npm run build:worker
          npm run sw:manifest
      - name: Auth regression tests
        run: node --test --test-concurrency=1 facebook-login-guard.test.mjs verification-orchestrator.test.mjs verification-providers.test.mjs free-tier-failover.test.mjs seo-routing.test.mjs otp-b-lock.test.mjs passkey-auth.test.mjs logout-data-safety.test.mjs dead-handler-guard.test.mjs sky-onboarding.test.mjs
      - name: Commit and push
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _worker.js account-access.js auth-native sw.js worker-bundle.mjs
          if git diff --cached --quiet; then echo 'Nothing to commit (already applied).'; exit 0; fi
          git commit -m 'fix(auth): OTP send timeout, land on Dashboard after Google/Facebook, accept Graph-confirmed Facebook email, redirect fallback message, login back button' -m 'Owner-approved 2026-10-15. Applied by scripts/auth-fix-20261015.py; worker-bundle.mjs and sw.js regenerated.'
          for i in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1
