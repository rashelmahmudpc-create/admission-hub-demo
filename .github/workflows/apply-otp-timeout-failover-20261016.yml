name: Apply OTP timeout failover 2026-10-16

# Applies scripts/apply-otp-timeout-failover-20261016.py on the feature branch: a
# PROVIDER_TIMEOUT on OTP send fails over to the next slot at once (no same-slot
# retry; 429/5xx keep their retry) and each slot's timeoutMs matches its speed,
# regenerates worker-bundle.mjs, runs the verification tests and commits the result
# back to the SAME branch. It never touches main and never deploys: merge the PR
# and run deploy-pages-worker.yml to go live.

on:
  push:
    branches: [feat/otp-timeout-failover]
    paths:
      - '.github/workflows/apply-otp-timeout-failover-20261016.yml'
      - 'scripts/apply-otp-timeout-failover-20261016.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-otp-timeout-failover-20261016
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref_name == 'feat/otp-timeout-failover'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/otp-timeout-failover
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply the OTP timeout failover patch
        run: |
          set -eu
          python3 scripts/apply-otp-timeout-failover-20261016.py
          python3 scripts/apply-otp-timeout-failover-20261016.py >/dev/null
          grep -q "if (failure.code === 'PROVIDER_TIMEOUT') break;" auth-native/verification/orchestrator.mjs
          grep -q '"id":"otp-a","enabled":true,"priority":10,"dailyQuota":300,"timeoutMs":8000' wrangler.toml
          grep -q '"id":"otp-h","enabled":true,"priority":15,"dailyQuota":5000,"timeoutMs":12000' wrangler.toml
          grep -q '"id":"otp-b","enabled":true,"priority":20,"dailyQuota":100,"timeoutMs":20000' wrangler.toml
          git diff --stat
      - name: Install and rebuild the Worker bundle
        run: |
          set -eu
          npm ci
          npm run build:worker
          npm run check:worker-bundle
      - name: Verification tests
        run: node --test --test-concurrency=1 verification-providers.test.mjs verification-orchestrator.test.mjs compact-auth-config.test.mjs free-tier-failover.test.mjs backup-public-handler.test.mjs email-branding.test.mjs
      - name: Commit and push to the feature branch
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add auth-native/verification/orchestrator.mjs wrangler.toml verification-orchestrator.test.mjs worker-bundle.mjs
          if git diff --cached --quiet; then echo 'Nothing to commit (already applied).'; else
            git commit -m 'fix(otp): fail over on provider timeout without same-slot retry, per-slot timeoutMs, regenerate worker-bundle.mjs' -m 'Applied by apply-otp-timeout-failover-20261016.yml. No deploy.'
            git push origin HEAD:feat/otp-timeout-failover
          fi
