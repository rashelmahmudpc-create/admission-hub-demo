name: Apply email allowlist v2 (on current main) 2026-10-18

on:
  push:
    branches: [fix/email-allowlist-v2]
    paths:
      - '.github/workflows/apply-email-allowlist-v2-20261018.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/email-allowlist-v2
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply patch script from PR #90 history
        run: |
          set -eu
          git fetch -q origin fix/email-allowlist
          git show 2a10c5b:scripts/email-allowlist-20261018.py > /tmp/allow.py
          python3 /tmp/allow.py
          sed -i 's/@example\.com/@gmail.com/g' native-auth.test.mjs telegram-otp-auth.test.mjs
          git diff --stat
      - name: Build + guard tests
        run: |
          set -eu
          npm ci
          npm run build:worker
          node scripts/sw-manifest.mjs
          npm run check:worker-bundle
          node --test --test-concurrency=1 email-policy.test.mjs verification-orchestrator.test.mjs verification-providers.test.mjs descope-magiclink.test.mjs descope-otp.test.mjs account-retirement.test.mjs
      - name: Native suites (report only)
        run: |
          for t in native-auth.test.mjs telegram-otp-auth.test.mjs; do echo "== $t"; node --test --test-concurrency=1 $t 2>&1 | grep -E '^# (pass|fail)|^not ok' || true; done
      - name: Commit and push
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(auth): only gmail/yahoo/icloud/outlook accepted - field, signup, login, reset, OTP' -m 'Re-applied on current main (v2 of PR #90). Test fixtures use gmail.com. Bundle + sw.js regenerated. No deploy.'
          git push origin HEAD:fix/email-allowlist-v2
