name: Apply clean Question Bank patch (one-shot)
on:
  workflow_dispatch:
    inputs:
      url:
        required: true
        type: string
      sha256:
        required: true
        type: string
permissions:
  contents: write
jobs:
  apply:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Download and verify patch
        env:
          URL: ${{ inputs.url }}
          SUM: ${{ inputs.sha256 }}
        run: |
          curl -fsSL "$URL" -o /tmp/qbc.patch
          echo "$SUM  /tmp/qbc.patch" | sha256sum -c -
      - name: Apply, refresh SW manifest, commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git apply --3way /tmp/qbc.patch || git apply --reject /tmp/qbc.patch
          node scripts/sw-manifest.mjs
          git rm -q .github/workflows/qbc-apply.yml
          git add -A
          git commit -m "feat(question-bank): replace Question Bank UI with the clean owner design, wired to real data"
          git push origin HEAD:main
