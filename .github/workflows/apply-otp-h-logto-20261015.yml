name: Apply otp-h Logto slot 2026-10-15

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-otp-h-logto-20261015.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-otp-h-logto-20261015
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply the owner-approved otp-h (Logto) patch
        run: |
          set -eu
          if grep -q "LogtoOtpVerificationProvider" auth-native/verification/providers.mjs; then echo 'Patch already applied.'; else
            echo '' | base64 -d | gunzip > /tmp/otp-h.patch
            git apply --whitespace=nowarn /tmp/otp-h.patch
          fi
          grep -q "'otp-h'" auth-native/verification/config.mjs
          grep -q '"id":"otp-h"' wrangler.toml
      - name: Install and rebuild the Worker bundle
        run: |
          set -eu
          npm ci
          npm run build:worker
          npm run check:worker-bundle
      - name: Verification tests
        run: node --test --test-concurrency=1 verification-providers.test.mjs verification-orchestrator.test.mjs free-tier-failover.test.mjs backup-public-handler.test.mjs email-branding.test.mjs
      - name: Commit and push
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git restore --source=HEAD --staged --worktree -- .github/workflows
          git add -A
          if git diff --cached --quiet; then echo 'Nothing to commit (already applied).'; else
            git commit -m 'feat(otp): add otp-h Logto email slot right after Brevo (provider-evidence)' -m 'Owner-approved 2026-10-15. Logto free email service via the public Experience API; no secret. Applied by apply-otp-h-logto-20261015.yml; worker-bundle.mjs regenerated.'
            ok=0; for i in 1 2 3; do if git push origin HEAD:main; then ok=1; break; fi; git pull --rebase origin main; done
            test "$ok" = 1
          fi
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.35.0'
          command: deploy --config wrangler.toml
