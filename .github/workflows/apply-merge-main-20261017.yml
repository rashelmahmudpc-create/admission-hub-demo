name: Merge main 12718c6 into PR 77/78 (2026-10-17)

# Brings #77 (feat/sky-agent-tools) and #78 (feat/sky-daily-report) up to main 12718c6.
# Also restores sky-smalltalk.js?v=st2 + sky-replies.json?v=r1 precache that 12718c6 lost,
# and regenerates sw.js digests. Package checked by SHA-256; final tree checked by a
# fingerprint of the expected tree. Commits back to the same branch. Never deploys.

on:
  push:
    branches: [feat/sky-agent-tools, feat/sky-daily-report]
    paths: ['.github/workflows/apply-merge-main-20261017.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-merge-main-20261017-${{ github.ref_name }}
  cancel-in-progress: false

env:
  PKG_URL: https://backend.composio.dev/api/v3/sl/m9mX3jCSza
  PKG_SHA256: b5d18300b55b0f37345d07198f38c7a17e743c55bbce47bc1e367387ff0b2966
  MAIN_SHA: 12718c6aeade8bbde56bda46297b7be6c05e2bce
  WF: .github/workflows/apply-merge-main-20261017.yml

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Pick PR
        id: p
        run: |
          case "${{ github.ref_name }}" in
            feat/sky-agent-tools) echo 'n=77' >> "$GITHUB_OUTPUT"; echo 'base=ae8ba7b3e950de9a64f9b24d1399289821ebe9e3' >> "$GITHUB_OUTPUT"; echo 'tests=sky-agent-tools phase9-m6-tool-registry' >> "$GITHUB_OUTPUT";;
            feat/sky-daily-report) echo 'n=78' >> "$GITHUB_OUTPUT"; echo 'base=a459fdaea0e33eea3477b0fa8349e9edfd6d1e52' >> "$GITHUB_OUTPUT"; echo 'tests=sky-daily-report' >> "$GITHUB_OUTPUT";;
            *) exit 1;;
          esac
          if git merge-base --is-ancestor "$MAIN_SHA" HEAD && git log -1 --format=%s | grep -q 'merge main 12718c6'; then echo 'done=1' >> "$GITHUB_OUTPUT"; fi
      - name: Merge, overlay, verify tree
        if: steps.p.outputs.done != '1'
        run: |
          set -eu
          N=${{ steps.p.outputs.n }}; BASE=${{ steps.p.outputs.base }}
          PREV=$(git rev-parse HEAD~1)
          [ "$PREV" = "$BASE" ] || { echo "branch moved: HEAD~1=$PREV want $BASE"; exit 1; }
          git diff --quiet "$BASE" HEAD -- . ":(exclude)$WF" || { echo 'files changed since base'; exit 1; }
          curl -fsSL --retry 3 -L "$PKG_URL" -o /tmp/pkg.tgz
          echo "$PKG_SHA256  /tmp/pkg.tgz" | sha256sum -c -
          mkdir /tmp/pk && tar xzf /tmp/pkg.tgz -C /tmp/pk
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "$N" = 77 ]; then git merge -s ours --no-commit --no-ff "$MAIN_SHA"; fi
          cp -a /tmp/pk/p$N/. .
          git add -A
          FP=$(git ls-files -s | grep -vF "$WF" | awk '{print $2, $4}' | sha256sum | cut -c1-64)
          [ "$FP" = "$(cat /tmp/pk/p$N.fp)" ] || { echo "tree fingerprint mismatch"; git status --short; exit 1; }
      - name: Checks and tests
        if: steps.p.outputs.done != '1'
        run: |
          set -eu
          npm ci --ignore-scripts
          npm run check:worker-bundle
          cp sw.js /tmp/sw.packaged.js; npm run sw:manifest; cmp sw.js /tmp/sw.packaged.js
          for f in pr2-fast-start pr3-shared-answers sky-contact sky-core-memory phase9-m5-prompt-registry ai-agent-f1 ai-live-stages p30-ai-latency-cache p25-chat-cache ai-chat-history p06-personal-tutor honesty-guard i18n-guard p15-pwa-offline p21-ai-agent-ui dead-handler-guard panel-fullscreen sky-onboarding seo-routing phase9-m7-memory-engine ${{ steps.p.outputs.tests }}; do
            echo "::group::$f"; node "$f.test.mjs"; echo "::endgroup::"
          done
      - name: Commit and push
        if: steps.p.outputs.done != '1'
        run: |
          set -eu
          git commit -qm "merge main 12718c6; restore st2 + sky-replies precache; sw digests"
          git push origin HEAD:${{ github.ref_name }}
