name: Sync email-allowlist with main 2026-10-18

on:
  push:
    branches: [fix/email-allowlist]
    paths:
      - '.github/workflows/apply-test-emails-20261018.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/email-allowlist
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Merge main
        run: |
          set -u
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          if git merge --no-commit --no-ff origin/main; then echo 'CLEAN=1' >> "$GITHUB_ENV"; exit 0; fi
          echo '== CONFLICTS =='; git diff --name-only --diff-filter=U | tee /tmp/conf
          BAD=$(grep -vE '(^|/)(worker-bundle\.mjs|sw\.js)$' /tmp/conf || true)
          if [ -n "$BAD" ]; then echo "== NON-GENERATED CONFLICTS =="; echo "$BAD"; for f in $BAD; do echo "--- $f"; grep -n -A6 '^<<<<<<<' "$f" | head -40; done; git merge --abort; exit 1; fi
          for f in $(cat /tmp/conf); do git checkout --theirs -- "$f"; git add "$f"; done
      - name: Regenerate and verify
        run: |
          set -eu
          npm ci
          npm run build:worker
          node scripts/sw-manifest.mjs
          npm run check:worker-bundle
          node --test --test-concurrency=1 email-policy.test.mjs verification-orchestrator.test.mjs 2>&1 | grep -E '^# (tests|pass|fail)'
      - name: Commit and push
        run: |
          set -eu
          git rm -q .github/workflows/apply-test-emails-20261018.yml
          git add -A
          git commit -m 'merge main into fix/email-allowlist; bundle + sw.js regenerated'
          git push origin HEAD:fix/email-allowlist
