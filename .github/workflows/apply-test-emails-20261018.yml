name: Apply test email fixtures (allowlist) 2026-10-18

on:
  push:
    branches: [fix/email-allowlist]
    paths:
      - '.github/workflows/apply-test-emails-20261018.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/email-allowlist
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Swap fixture domains
        run: |
          set -eu
          if ! grep -q '@example.com' native-auth.test.mjs telegram-otp-auth.test.mjs; then echo 'Already applied.'; echo 'SKIP=1' >> "$GITHUB_ENV"; exit 0; fi
          sed -i 's/@example\.com/@gmail.com/g' native-auth.test.mjs telegram-otp-auth.test.mjs
          git diff --stat
      - name: Run the two suites (report only)
        if: env.SKIP != '1'
        run: |
          npm ci
          node --test --test-concurrency=1 native-auth.test.mjs telegram-otp-auth.test.mjs 2>&1 | grep -E '^# (tests|pass|fail)|^not ok' || true
      - name: Commit and push
        if: env.SKIP != '1'
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native-auth.test.mjs telegram-otp-auth.test.mjs
          git commit -m 'test(auth): use allowlisted gmail.com fixtures instead of example.com'
          git push origin HEAD:fix/email-allowlist
