name: Apply AI latency + cache P30 2026-10-16

# Owner-approved 2026-10-16: AI chat speed-up and cache fix.
#  (ক) first-chunk timeout 10s -> 5s so a busy provider is abandoned sooner
#  (খ) memory/summary/last-topic saves moved off the hot path; `done` is sent
#      before the memory save (still awaited inside the request)
#  (গ) shared academic cache: a first-turn, self-contained ACADEMIC_EXPLAIN
#      question is answered from an impersonal prompt and that answer is cached
#  (ঘ) per-stage timing log line (evt: ai.timing, numbers only)
# The patch is verified by SHA-256 before it is applied.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-ai-latency-cache-20261016.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-ai-latency-cache-20261016
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Download and verify patch
        run: |
          set -eu
          curl -fsSL -o /tmp/ai-p30.patch 'https://backend.composio.dev/api/v3/sl/NaLW0IQw3i'
          echo '6fcea4c3640d5656d54c91f7dabc4262cc0c85bea6c6ddece01fa132a8ad9e4a  /tmp/ai-p30.patch' | sha256sum -c -
      - name: Apply source changes
        run: |
          set -eu
          if grep -q 'isSharedAcademicCandidate' ai-chat-cache.mjs; then echo 'Already applied.'; exit 0; fi
          git apply --3way /tmp/ai-p30.patch
      - name: Syntax check
        run: |
          node --check ai-agent.js
          node -e "import('./ai-chat-cache.mjs').then(()=>console.log('ok'))"
      - name: Rebuild Worker bundle
        run: npm run build:worker
      - name: Regression tests
        run: |
          set -eu
          node --test --test-concurrency=1 p30-ai-latency-cache.test.mjs p25-chat-cache.test.mjs p26-tier-router.test.mjs p27-history-trim.test.mjs p28-provider-health.test.mjs p29-ai-status-privacy.test.mjs p21-ai-agent-ui.test.mjs ai-chat-history.test.mjs ai-live-stages.test.mjs ai-provider-adapters.test.mjs ai-state-do.test.mjs phase9-m4-context-engine.test.mjs phase9-m7-memory-engine.test.mjs phase9-m8-response-validation.test.mjs phase9-m9-action-engine.test.mjs phase9-m9-action-ui.test.mjs phase9-m5-prompt-registry.test.mjs phase9-m6-tool-registry.test.mjs
          node ai-agent-f1.test.mjs
          node p06-personal-tutor.test.mjs
          node phase9-m10-observability.test.mjs
          npm run check:worker-bundle
      - name: Commit and push
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git restore --source=HEAD --staged --worktree -- .github/workflows
          git add -A
          if git diff --cached --quiet; then echo 'Nothing to commit (already applied).'; exit 0; fi
          git commit -m 'perf(ai): faster chat replies + shared academic cache (P30)' -m 'Owner-approved 2026-10-16. First-chunk timeout 10s->5s; memory/summary/last-topic saves off the hot path and done sent before the memory save; first-turn self-contained ACADEMIC_EXPLAIN questions answered from an impersonal prompt and cached (isSharedAcademicCandidate); per-stage ai.timing log. worker-bundle.mjs regenerated.'
          for i in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1
