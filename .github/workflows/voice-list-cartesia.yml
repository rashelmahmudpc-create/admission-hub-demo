name: Voice — list Cartesia voices (manual)

# Throwaway discovery job: prints the Cartesia voice catalogue so a male
# Bengali-capable voice can be chosen. Deploy-only/discovery: touches no secret,
# no worker, no code.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type LIST to dump the Cartesia voice catalogue
        required: true
        type: string

permissions:
  contents: read

jobs:
  list:
    if: ${{ inputs.confirmation == 'LIST' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Dump Cartesia voices
        env:
          CARTESIA_API_KEY: ${{ secrets.CARTESIA_API_KEY }}
        run: |
          set -eu
          node -e '
            const fs = require("fs");
            const VER = "2026-08-14", KEY = process.env.CARTESIA_API_KEY;
            (async () => {
              let all = [], cursor = null;
              for (let page = 0; page < 40; page++) {
                const url = "https://api.cartesia.ai/voices?limit=100" + (cursor ? "&starting_after=" + cursor : "");
                const r = await fetch(url, { headers: { "Cartesia-Version": VER, Authorization: "Bearer " + KEY } });
                const j = await r.json();
                if (page === 0) console.log("TOPLEVEL_IS_ARRAY:", Array.isArray(j), "KEYS:", Object.keys(j).join(","));
                const arr = Array.isArray(j) ? j : (j.data || j.voices || []);
                if (!arr.length) break;
                all = all.concat(arr);
                cursor = arr[arr.length - 1].id;
                if (arr.length < 100) break;
              }
              console.log("TOTAL:", all.length);
              const g = v => typeof v.gender === "object" && v.gender ? v.gender.name || JSON.stringify(v.gender) : String(v.gender || "");
              const l = v => typeof v.language === "object" && v.language ? v.language.name || JSON.stringify(v.language) : String(v.language || "");
              const bn = all.filter(v => /bengali|বাংলা|bn-BD|"bn"|bangla/i.test(JSON.stringify(v)));
              console.log("BNBENGALI_COUNT:", bn.length);
              for (const v of bn) console.log("BN |", v.id, v.name, "|g:", g(v), "|lang:", l(v), "|tag:", v.tagline || "");
              console.log("LANGS:", [...new Set(all.map(l))].sort().join(", "));
              console.log("RUBEL:", all.filter(v => /rubel/i.test(v.name)).map(v => [v.id, v.name, g(v), l(v)].join(" ")).join(" ; ") || "none");
            })().catch(e => { console.error("ERR", e.message); process.exit(1); });
          '
