name: Voice — list Cartesia voices (manual)

# Throwaway discovery job: prints the Cartesia voice catalogue so a male
# Bengali-capable voice can be chosen. Deploy-only/discovery: touches no secret,
# no worker, no code.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type LIST to dump the Cartesia voice catalogue
        required: true
        type: string

permissions:
  contents: read

jobs:
  list:
    if: ${{ inputs.confirmation == 'LIST' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Dump Cartesia voices
        env:
          CARTESIA_API_KEY: ${{ secrets.CARTESIA_API_KEY }}
        run: |
          set -eu
          curl -s --max-time 30 "https://api.cartesia.ai/voices?limit=100" \
            -H "Cartesia-Version: 2026-08-14" \
            -H "Authorization: Bearer $CARTESIA_API_KEY" \
            -o /tmp/voices.json
          echo "bytes: $(wc -c </tmp/voices.json)"
          node -e '
            const j = JSON.parse(require("fs").readFileSync("/tmp/voices.json","utf8"));
            const arr = Array.isArray(j) ? j : (j.data || j.voices || []);
            console.log("count:", arr.length);
            console.log("sample-object:", JSON.stringify(arr[0]));
            const g = v => typeof v.gender === "object" && v.gender ? v.gender.name || JSON.stringify(v.gender) : String(v.gender || "");
            const l = v => typeof v.language === "object" && v.language ? v.language.name || JSON.stringify(v.language) : String(v.language || "");
            for (const v of arr) console.log([v.id, v.name, "|g:", g(v), "|lang:", l(v), "|tag:", v.tagline || "", "|acc:", JSON.stringify(v.accents || [])].join(" "));
            console.log("--- male ---");
            for (const v of arr.filter(v => /male|man|boy/i.test(g(v)))) console.log(v.id, v.name, l(v));
            console.log("--- languages seen ---");
            console.log([...new Set(arr.map(l))].join(", "));
          '
