name: Apply otp-i priority 38 2026-10-16

# Owner order 2026-10-16: move otp-i (Appwrite, default English template) from
# priority 17 to 38 so it runs AFTER every branded mailer (own logo/subject) and
# BEFORE the spam-prone last-resort pair (otp-g Dead Simple 39, otp-c Mailjet 45).
# Ties sort by id, so otp-f (MailerSend, 38) still goes first.
# Edits wrangler.toml + config.mjs default, rebuilds worker-bundle.mjs, runs the
# verification tests and commits to the SAME branch. Never touches main, never deploys.

on:
  push:
    branches: [feat/otp-i-priority-38]
    paths:
      - '.github/workflows/apply-otp-i-priority-20261016.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-otp-i-priority-20261016
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref_name == 'feat/otp-i-priority-38'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/otp-i-priority-38
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Move otp-i to priority 38
        run: |
          set -eu
          python3 - <<'PY'
          import json, re
          p = 'wrangler.toml'
          t = open(p, encoding='utf-8').read()
          old = '{"id":"otp-i","enabled":true,"priority":17,'
          if old in t:
              assert t.count(old) == 1
              t = t.replace(old, '{"id":"otp-i","enabled":true,"priority":38,')
          oc = '# 2026-10-16 right after Logto. Endpoint and project id are public and live in\n'
          if oc in t:
              t = t.replace(oc, '# 2026-10-16. Owner order (same day): moved 17 -> 38 so it runs AFTER every branded\n'
                                '# mailer (own logo/subject; ties sort by id so otp-f MailerSend goes first) and BEFORE\n'
                                '# the spam-prone last-resort pair. Endpoint and project id are public and live in\n')
          open(p, 'w', encoding='utf-8').write(t)
          m = re.search(r"VERIFICATION_ORCHESTRATOR_CONFIG = '(.*)'", t)
          rows = json.loads(m.group(1))['providers']
          order = [r['id'] for r in sorted(rows, key=lambda r: (r['priority'], r['id']))]
          print(order)
          assert order.index('otp-f') < order.index('otp-i') < order.index('otp-g') < order.index('otp-c'), order
          c = 'auth-native/verification/config.mjs'
          s = open(c, encoding='utf-8').read()
          a = "verificationMode: VERIFICATION_MODES.PROVIDER_EVIDENCE, priority: 17 })"
          if a in s:
              assert s.count(a) == 1
              s = s.replace(a, "verificationMode: VERIFICATION_MODES.PROVIDER_EVIDENCE, priority: 38 })")
          open(c, 'w', encoding='utf-8').write(s)
          assert "'otp-i': Object.freeze({ channel: VERIFICATION_CHANNELS.OTP, verificationMode: VERIFICATION_MODES.PROVIDER_EVIDENCE, priority: 38 })" in s
          PY
          git diff --stat
      - name: Install and rebuild the Worker bundle
        run: |
          set -eu
          npm ci
          npm run build:worker
          npm run check:worker-bundle
      - name: Verification tests
        run: node --test --test-concurrency=1 verification-providers.test.mjs verification-orchestrator.test.mjs compact-auth-config.test.mjs free-tier-failover.test.mjs backup-public-handler.test.mjs email-branding.test.mjs
      - name: Commit and push to the feature branch
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add auth-native/verification/config.mjs wrangler.toml worker-bundle.mjs
          if git diff --cached --quiet; then echo 'Nothing to commit (already applied).'; else
            git commit -m 'feat(otp): move otp-i Appwrite to priority 38 and regenerate worker-bundle.mjs' -m 'Applied by apply-otp-i-priority-20261016.yml. No deploy.'
            git push origin HEAD:feat/otp-i-priority-38
          fi
