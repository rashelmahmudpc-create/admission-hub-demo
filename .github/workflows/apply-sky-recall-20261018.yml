name: Apply Sky recall step 2 (2026-10-18)

# Owner plan step 2: when a signed-in student opens the chat, Sky reminds them of
# recent mistakes and their weak topic by itself (POST /api/ai/recall, no model
# call, no AI limit). Runs scripts/apply-sky-recall-20261018.py, regenerates the
# SW digests and worker-bundle.mjs, runs the AI tests, commits to this branch only.

on:
  push:
    branches: [fix/sky-recall-20261018]
    paths: ['.github/workflows/apply-sky-recall-20261018.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.ref_name == 'fix/sky-recall-20261018'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/sky-recall-20261018
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Already applied?
        id: done
        run: |
          if grep -q 'agentRecall' ai-agent.js; then echo 'already=1' >> "$GITHUB_OUTPUT"; fi
      - name: Apply
        if: steps.done.outputs.already != '1'
        run: |
          set -eu
          python3 scripts/apply-sky-recall-20261018.py
          npm ci --ignore-scripts
          npm run sw:manifest
          npm run build:worker
          npm run check:worker-bundle
          grep -q "/api/ai/recall" worker-bundle.mjs
          git diff --stat
      - name: Tests
        if: steps.done.outputs.already != '1'
        run: |
          set -eu
          for f in sky-recall sky-memory-weak-recall ai-audit-fixes ai-agent-f1 ai-chat-history ai-live-stages ai-provider-adapters p06-personal-tutor p21-ai-agent-ui p25-chat-cache p27-history-trim p29-ai-status-privacy p30-ai-latency-cache p14-security-gate phase9-m10-observability phase9-m4-context-engine phase9-m5-prompt-registry phase9-m8-response-validation phase9-m9-action-ui pr3-shared-answers sky-agent-tools sky-contact sky-core-memory sky-daily-report sky-time-memory sky-web-search voice-agent-client-core voice-agent; do
            echo "::group::$f"; node --test "$f.test.mjs"; echo "::endgroup::"
          done
      - name: Commit and push
        if: steps.done.outputs.already != '1'
        run: |
          set -eu
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -qm 'feat(ai): Sky reminds recent mistakes and the weak topic when the chat opens; /api/ai/recall, bundle + SW digests regenerated'
          git push origin HEAD:fix/sky-recall-20261018
