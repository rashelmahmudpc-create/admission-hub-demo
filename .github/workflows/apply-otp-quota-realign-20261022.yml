name: Apply OTP quota realign 2026-10-22

# Applies scripts/apply-otp-quota-realign-20261022.py on the feature branch:
# every OTP slot's dailyQuota is realigned with the provider's FREE-plan
# allowance (Logto 1500, Appwrite 1000, MailerSend 16, Dead Simple 165,
# Descope otp-l 150 + otp-m 100). Rebuilds worker-bundle.mjs, runs the
# verification/auth guard tests and commits the result back to the SAME branch.
# It never touches main and never deploys: merge the PR and run
# deploy-pages-worker.yml to go live.

on:
  push:
    branches: [feat/otp-quota-realign]
    paths:
      - '.github/workflows/apply-otp-quota-realign-20261022.yml'
      - 'scripts/apply-otp-quota-realign-20261022.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-otp-quota-realign-20261022
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref_name == 'feat/otp-quota-realign'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/otp-quota-realign
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply the OTP quota realign patch
        run: |
          set -eu
          python3 scripts/apply-otp-quota-realign-20261022.py
          python3 scripts/apply-otp-quota-realign-20261022.py >/dev/null
          grep -q '"id":"otp-h","enabled":true,"priority":15,"dailyQuota":1500,' wrangler.toml
          grep -q '"id":"otp-i","enabled":true,"priority":38,"dailyQuota":1000,' wrangler.toml
          grep -q '"id":"otp-l","enabled":true,"priority":38,"dailyQuota":150,' wrangler.toml
          grep -q '"id":"otp-m","enabled":true,"priority":38,"dailyQuota":100,' wrangler.toml
          grep -q '"id":"otp-f","enabled":true,"priority":38,"dailyQuota":16,' wrangler.toml
          grep -q '"id":"otp-g","enabled":true,"priority":39,"dailyQuota":165,' wrangler.toml
          grep -q '^OTP_F_DAILY_QUOTA = "16"$' wrangler.toml
          git diff --stat
      - name: Install and rebuild the Worker bundle
        run: |
          set -eu
          npm ci
          npm run build:worker
          npm run check:worker-bundle
      - name: Verification and auth guard tests
        run: node --test --test-concurrency=1 native-auth-protection.test.mjs compact-auth-config.test.mjs verification-providers.test.mjs verification-orchestrator.test.mjs descope-otp.test.mjs descope-magiclink.test.mjs
      - name: Commit and push to the feature branch
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wrangler.toml native-auth-protection.test.mjs compact-auth-config.test.mjs worker-bundle.mjs
          if git diff --cached --quiet; then echo 'Nothing to commit (already applied).'; else
            git commit -m 'fix(otp): realign every daily cap with the provider free plan' -m 'Applied by apply-otp-quota-realign-20261022.yml. No deploy.'
            git push origin HEAD:feat/otp-quota-realign
          fi
