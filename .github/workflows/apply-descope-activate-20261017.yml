name: Apply Descope otp-l activation 2026-10-17

# Adds the otp-l row (priority 38, 1000/day) to the EXISTING
# VERIFICATION_ORCHESTRATOR_CONFIG in wrangler.toml, updates the two config
# order/timeout tests, rebuilds worker-bundle.mjs and commits to THIS branch.
# Live Descope OTP send+verify passed 2026-10-17 22:36 UTC. No deploy here.

on:
  push:
    branches: [feat/descope-otp]
    paths:
      - '.github/workflows/apply-descope-activate-20261017.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-descope-activate-20261017
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref_name == 'feat/descope-otp'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/descope-otp
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Add otp-l row and update config tests
        run: |
          set -eu
          cat > /tmp/act.py <<'PY'
          import re
          def rep(p,a,b):
              s=open(p).read()
              if b in s: return
              assert s.count(a)==1,(p,a); open(p,'w').write(s.replace(a,b))
          s=open('wrangler.toml').read()
          if '"id":"otp-l"' not in s:
              m=re.search(r'\{"id":"otp-k"[^{}]*\}',s)
              row='{"id":"otp-l","enabled":true,"priority":38,"dailyQuota":1000,"timeoutMs":12000,"label":"secure backup","projectId":"P3Km4McYmZUg8ZzIJfEnf9ZCDkFD"}'
              open('wrangler.toml','w').write(s[:m.end()]+','+row+s[m.end():])
          rep('verification-providers.test.mjs',"['otp-f', 'otp-i', 'otp-j', 'otp-k', 'otp-g', 'otp-c', 'telegram']","['otp-f', 'otp-i', 'otp-j', 'otp-k', 'otp-l', 'otp-g', 'otp-c', 'telegram']")
          rep('verification-orchestrator.test.mjs',"'otp-k': 12000, 'otp-b': 20000,","'otp-k': 12000, 'otp-l': 12000, 'otp-b': 20000,")
          PY
          python3 /tmp/act.py
          check() { got=$(git hash-object "$2"); [ "$got" = "$1" ] || { echo "MISMATCH $2 $got"; exit 1; }; echo "OK $2"; }
          check 67573035cee6c125f74a1d3db5554402efca6e01 wrangler.toml
          check 1da5d89cb74ebb698bd805b56eb8d600e36156f5 verification-providers.test.mjs
          check b8a37fc298b66b516b829089303ce50d85037f2f verification-orchestrator.test.mjs
      - name: Install and rebuild the Worker bundle
        run: |
          set -eu
          npm ci
          npm run build:worker
          npm run check:worker-bundle
          grep -q 'DescopeOtpVerificationProvider' worker-bundle.mjs
      - name: Verification tests
        run: node --test --test-concurrency=1 verification-providers.test.mjs verification-orchestrator.test.mjs descope-otp.test.mjs compact-auth-config.test.mjs otp-b-lock.test.mjs free-tier-failover.test.mjs backup-public-handler.test.mjs email-branding.test.mjs
      - name: Commit and push to the feature branch
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wrangler.toml verification-providers.test.mjs verification-orchestrator.test.mjs worker-bundle.mjs
          if git diff --cached --quiet; then echo 'Nothing to commit.'; else
            git commit -m 'feat(auth): enable Descope otp-l (priority 38, 1000/day) and regenerate worker-bundle.mjs' -m 'Applied by apply-descope-activate-20261017.yml. Live Descope send+verify passed. No deploy.'
            git push origin HEAD:feat/descope-otp
          fi
