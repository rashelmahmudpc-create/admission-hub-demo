name: Set GEMINI_KEYS worker secret (manual, owner-authorised)

# Owner-approved one-off. The Worker secret `GEMINI_KEYS` shadows KV and holds
# only 2 keys, so the owner's 17 keys were unused. This copies the KV value
# (`secret:AI_KEYS` -> GEMINI_KEYS, else GEMINI_API_KEYS) into that Worker
# secret so the app rotates across all of them. No code change, no redeploy.
# The secret value is handled only inside the runner and is never printed.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type SET-GEMINI to write the GEMINI_KEYS worker secret
        required: true
        type: string

permissions:
  contents: read

jobs:
  set:
    if: ${{ inputs.confirmation == 'SET-GEMINI' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Copy KV Gemini keys into the GEMINI_KEYS worker secret
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          NS=b9353515b098427687afcfb8654ed359
          SCRIPT=admission-gk
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/${CF_ACCT}/storage/kv/namespaces/${NS}/values/secret:AI_KEYS" \
            -H "Authorization: Bearer ${CF_TOKEN}" -o /tmp/aikeys.json
          node -e '
            const j = JSON.parse(require("fs").readFileSync("/tmp/aikeys.json","utf8"));
            const val = String(j.GEMINI_KEYS || j.GEMINI_API_KEYS || "");
            const n = val.split(",").map(s=>s.trim()).filter(Boolean).length;
            if (!n) { console.error("no gemini keys found in KV"); process.exit(1); }
            require("fs").writeFileSync("/tmp/secret.json", JSON.stringify({ name:"GEMINI_KEYS", text:val, type:"secret_text" }));
            console.log("keys to set:", n);
          '
          curl -fsS -X PUT "https://api.cloudflare.com/client/v4/accounts/${CF_ACCT}/workers/scripts/${SCRIPT}/secrets" \
            -H "Authorization: Bearer ${CF_TOKEN}" -H "Content-Type: application/json" \
            --data-binary @/tmp/secret.json -o /tmp/resp.json
          node -e 'const r=JSON.parse(require("fs").readFileSync("/tmp/resp.json","utf8")); console.log("api success:", r.success); console.log("binding:", r.result && r.result.name, "|", r.result && r.result.type);'
