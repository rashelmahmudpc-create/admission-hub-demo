name: Apply auth+UX fix 2026-10-16

on:
  push:
    branches: [main]
    paths:
      - 'scripts/auth-ux-fix-20261016.py'
      - '.github/workflows/apply-auth-ux-fix-20261016.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-auth-ux-fix-20261016
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply source changes
        run: python3 scripts/auth-ux-fix-20261016.py
      - name: Syntax check
        run: |
          node --check account-access.js
          node --check sky-onboarding.js
          node --check welcome-story.js
          node --check ios-chrome.js
          node -e "import('./auth-native/verification/orchestrator.mjs').then(()=>console.log('ok'))"
      - name: Rebuild Worker bundle and service-worker digests
        run: |
          npm run build:worker
          npm run sw:manifest
      - name: Regression tests
        run: node --test --test-concurrency=1 facebook-login-guard.test.mjs verification-orchestrator.test.mjs verification-providers.test.mjs free-tier-failover.test.mjs seo-routing.test.mjs otp-b-lock.test.mjs passkey-auth.test.mjs logout-data-safety.test.mjs dead-handler-guard.test.mjs sky-onboarding.test.mjs
      - name: Commit and push
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Asset-version replacements must not modify unrelated workflow definitions.
          git restore --worktree -- .github/workflows
          git add -A
          if git diff --cached --quiet; then echo 'Nothing to commit (already applied).'; exit 0; fi
          git commit -m 'fix(auth+ux): retire old onboarding, existing-email message, direct Google, Facebook errors + legal pages, OTP routing for iCloud/Yahoo, welcome clip, iOS colour + zoom lock' -m 'Owner-approved 2026-10-16. Applied by scripts/auth-ux-fix-20261016.py; worker-bundle.mjs and sw.js regenerated.'
          for i in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1
