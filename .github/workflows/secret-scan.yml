name: Secret Scan (Gitleaks)

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 21 * * 5" # Saturday 03:00 Dhaka — weekly full-history scan
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          VER=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan new commits (push / PR)
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            RANGE="HEAD~1..HEAD"
          else
            RANGE="$BASE..HEAD"
          fi
          echo "Scanning $RANGE"
          gitleaks git --config .gitleaks.toml --redact --no-banner --log-opts="$RANGE" --exit-code 1 .
      - name: Full history scan (weekly / manual)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: gitleaks git --config .gitleaks.toml --redact --no-banner --exit-code 1 .
