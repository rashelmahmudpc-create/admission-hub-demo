name: Apply Sky agent tools 2026-10-17

# Agent phase 1: applies scripts/apply-sky-agent-tools-20261017.py on the feature
# branch, regenerates worker-bundle.mjs and sw.js, runs the AI tests and commits
# back to the SAME branch. Never touches main, never deploys.

on:
  push:
    branches: [feat/sky-agent-tools]
    paths:
      - '.github/workflows/apply-sky-agent-tools-20261017.yml'
      - 'scripts/apply-sky-agent-tools-20261017.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-sky-agent-tools-20261017
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref_name == 'feat/sky-agent-tools'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/sky-agent-tools
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply the agent-tools patch
        run: |
          set -eu
          test -f sky-tools.mjs && test -f sky-tools-client.js && test -f sky-agent-tools.test.mjs
          python3 scripts/apply-sky-agent-tools-20261017.py
          python3 scripts/apply-sky-agent-tools-20261017.py >/dev/null
          grep -q "from './sky-tools.mjs'" ai-agent.js
          grep -q 'window.SkyTools.run(' ai-agent-chat.js
          grep -q 'sky-tools-client.js?v=tools1' index.html
          git diff --stat
      - name: Install, rebuild the Worker bundle and the SW manifest
        run: |
          set -eu
          npm ci --ignore-scripts
          npm run build:worker
          npm run check:worker-bundle
          npm run sw:manifest
      - name: AI tests
        run: |
          set -eu
          for f in sky-agent-tools pr3-shared-answers pr2-fast-start sky-core-memory phase9-m5-prompt-registry ai-agent-f1 ai-live-stages p30-ai-latency-cache p25-chat-cache phase9-m10-observability phase9-m8-response-validation ai-chat-history phase9-m6-tool-registry p06-personal-tutor phase9-m4-context-engine phase9-m7-memory-engine ai-provider-adapters p26-tier-router p27-history-trim p28-provider-health p31-model-priority honesty-guard i18n-guard account-retirement account-data-isolation p15-pwa-offline p21-ai-agent-ui dead-handler-guard panel-fullscreen sky-onboarding; do
            echo "::group::$f"; node "$f.test.mjs"; echo "::endgroup::"
          done
      - name: Commit and push to the feature branch
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai-agent.js ai-agent-chat.js index.html sw.js worker-bundle.mjs phase9-m6-tool-registry.test.mjs
          if git diff --cached --quiet; then echo 'Nothing to commit (already applied).'; else
            git commit -m 'feat(ai): agent tools wired into the chat; regenerate worker bundle and sw.js' -m 'Applied by apply-sky-agent-tools-20261017.yml. No deploy.'
            git push origin HEAD:feat/sky-agent-tools
          fi
