name: Apply daily report (#78) on main 5f63311

# #78 conflicted with #77 after #77 was merged (ai-agent.js import line, sw.js, bundle).
# Resolved in sandbox (both imports kept, bundle + sw digests rebuilt). Package checked by
# SHA-256, final tree checked by fingerprint. Commits to the same branch. Never deploys.

on:
  push:
    branches: [feat/sky-daily-report-v2]
    paths: ['.github/workflows/apply-daily-report-v2-20261017.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  PKG_URL: https://backend.composio.dev/api/v3/sl/mk6sZPpVdj
  PKG_SHA256: 57d1464320863705d334b78d9e6960a55c12c8d58adc1044a29e654d743bc47d
  BASE: 5f63311ef7b5698357db5946f6f26edc29876437
  WF: .github/workflows/apply-daily-report-v2-20261017.yml

jobs:
  apply:
    if: github.ref_name == 'feat/sky-daily-report-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/sky-daily-report-v2
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Already applied?
        id: done
        run: |
          if [ -f sky-daily-report.mjs ]; then echo 'already=1' >> "$GITHUB_OUTPUT"; fi
      - name: Overlay and verify tree
        if: steps.done.outputs.already != '1'
        run: |
          set -eu
          [ "$(git rev-parse HEAD~1)" = "$BASE" ] || { echo 'branch moved'; exit 1; }
          curl -fsSL --retry 3 -L "$PKG_URL" -o /tmp/pkg.tgz
          echo "$PKG_SHA256  /tmp/pkg.tgz" | sha256sum -c -
          mkdir /tmp/pk && tar xzf /tmp/pkg.tgz -C /tmp/pk
          cp -a /tmp/pk/f/. .
          git add -A
          FP=$(git ls-files -s | grep -vF "$WF" | awk '{print $2, $4}' | sha256sum | cut -c1-64)
          [ "$FP" = "$(cat /tmp/pk/fp)" ] || { echo 'tree fingerprint mismatch'; git status --short; exit 1; }
      - name: Checks and tests
        if: steps.done.outputs.already != '1'
        run: |
          set -eu
          npm ci --ignore-scripts
          npm run check:worker-bundle
          cp sw.js /tmp/sw.packaged.js; npm run sw:manifest; cmp sw.js /tmp/sw.packaged.js
          for f in pr2-fast-start pr3-shared-answers sky-contact sky-core-memory phase9-m5-prompt-registry ai-agent-f1 ai-live-stages p30-ai-latency-cache p25-chat-cache ai-chat-history p06-personal-tutor honesty-guard i18n-guard p15-pwa-offline p21-ai-agent-ui dead-handler-guard panel-fullscreen sky-onboarding seo-routing phase9-m6-tool-registry phase9-m7-memory-engine sky-agent-tools sky-daily-report; do
            echo "::group::$f"; node "$f.test.mjs"; echo "::endgroup::"
          done
      - name: Commit and push
        if: steps.done.outputs.already != '1'
        run: |
          set -eu
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -qm 'feat(report): nightly anonymous Sky report (#78) on top of #77'
          git push origin HEAD:feat/sky-daily-report-v2
