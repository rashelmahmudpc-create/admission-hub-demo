name: Apply Sky core memory v2 2026-10-17

# Applies scripts/apply-sky-core-memory-20261017.py on the feature branch: Sky core
# memory v2 (AdmissionSky identity) in prompt-registry.js, the get_app_features tool
# (sky-app-features.mjs, KV override 'sky:app-features'), resetAt + an official
# message on the 429 daily-limit reply and a calm limit card in ai-agent-chat.js.
# Regenerates worker-bundle.mjs and sw.js, runs the AI tests and commits the result
# back to the SAME branch. It never touches main and never deploys.

on:
  push:
    branches: [feat/sky-core-memory]
    paths:
      - '.github/workflows/apply-sky-core-memory-20261017.yml'
      - 'scripts/apply-sky-core-memory-20261017.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-sky-core-memory-20261017
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref_name == 'feat/sky-core-memory'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/sky-core-memory
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply the Sky core memory patch
        run: |
          set -eu
          python3 scripts/apply-sky-core-memory-20261017.py
          python3 scripts/apply-sky-core-memory-20261017.py >/dev/null
          grep -q "export const BASE_PROMPT_ID = 'sky-core';" prompt-registry.js
          grep -q "export const SYSTEM_PROMPT_V = 'sys-sky-v2-core-memory';" ai-agent.js
          grep -q "stage('app-features'" ai-agent.js
          grep -q "holder.errorKind = 'limit'" ai-agent-chat.js
          test -f sky-app-features.mjs
          git diff --stat
      - name: Install, rebuild the Worker bundle and the SW manifest
        run: |
          set -eu
          npm ci
          npm run build:worker
          npm run check:worker-bundle
          npm run sw:manifest
      - name: AI tests
        run: |
          set -eu
          for f in sky-core-memory phase9-m5-prompt-registry ai-agent-f1 ai-live-stages p30-ai-latency-cache p25-chat-cache phase9-m10-observability phase9-m8-response-validation voice-agent-core ai-chat-history phase9-m6-tool-registry p06-personal-tutor phase9-m4-context-engine phase9-m7-memory-engine honesty-guard i18n-guard; do
            echo "::group::$f"; node "$f.test.mjs"; echo "::endgroup::"
          done
      - name: Commit and push to the feature branch
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prompt-registry.js ai-agent.js ai-agent-chat.js sky-app-features.mjs sky-core-memory.test.mjs phase9-m5-prompt-registry.test.mjs phase9-m6-tool-registry.test.mjs phase9-m7-memory-engine.test.mjs ai-agent-f1.test.mjs worker-bundle.mjs sw.js
          if git diff --cached --quiet; then echo 'Nothing to commit (already applied).'; else
            git commit -m 'feat(ai): Sky core memory v2 (AdmissionSky), get_app_features tool, daily-limit reset time card; regenerate worker-bundle.mjs and sw.js' -m 'Applied by apply-sky-core-memory-20261017.yml. No deploy.'
            git push origin HEAD:feat/sky-core-memory
          fi
