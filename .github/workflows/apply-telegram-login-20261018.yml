name: Apply Telegram login 2026-10-18

# Applies scripts/apply-telegram-login-20261018.py on feat/telegram-login:
# "Continue with Telegram" replaces Facebook, the post-signup Telegram
# verification choice is removed. Rebuilds worker-bundle.mjs and the sw.js
# digests, runs the Telegram login tests and commits back to the SAME branch.
# It never touches main and never deploys.

on:
  push:
    branches: [feat/telegram-login]
    paths:
      - '.github/workflows/apply-telegram-login-20261018.yml'
      - 'scripts/apply-telegram-login-20261018.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-telegram-login-20261018
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref_name == 'feat/telegram-login'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/telegram-login
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply the Telegram login patch
        run: |
          set -eu
          python3 scripts/apply-telegram-login-20261018.py
          python3 scripts/apply-telegram-login-20261018.py >/dev/null
          for f in account-access.js welcome-story.js sky-onboarding.js auth-native/worker/public-auth-handler.mjs auth-native/core/auth-engine.mjs auth-native/verification/telegram-login.mjs; do node --check "$f"; done
          git diff --stat
      - name: Install, rebuild the Worker bundle and the service-worker digests
        run: |
          set -eu
          npm ci
          npm run build:worker
          npm run sw:manifest
      - name: Telegram login tests (must pass)
        run: node --test --test-concurrency=1 telegram-login.test.mjs
      - name: Wider auth tests (informational)
        continue-on-error: true
        run: node --test --test-concurrency=1 facebook-login-guard.test.mjs firebase-auth-ui.test.mjs multimethod-auth-ui.test.mjs native-auth-protection.test.mjs code-native-welcome-v1.test.mjs 2>&1 | grep -E "^not ok|^# (pass|fail)" || true
      - name: Commit and push to the feature branch
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          if git diff --cached --quiet; then echo 'Nothing to commit (already applied).'; else
            git commit -m 'feat(auth): Continue with Telegram replaces Facebook; Telegram verification choice removed' -m 'Applied by apply-telegram-login-20261018.yml. No deploy.'
            git push origin HEAD:feat/telegram-login
          fi
          npm run check:worker-bundle
