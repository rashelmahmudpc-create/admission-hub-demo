name: Apply Sky live tools memory 2026-10-18

# Owner 2026-10-18: Sky core prompt v3 (when/how to use web_search, source links, no
# student data, no more 'no internet'), get_datetime clock + Bangla calendar tool, NOW
# line on every turn, Tavily key passed to the chat (supersedes #88). Restores what #89
# lost. Package checked by SHA-256, final tree by fingerprint. Never deploys.

on:
  push:
    branches: [feat/sky-time-search-memory]
    paths: ['.github/workflows/apply-sky-time-search-20261018.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  PKG_URL: https://backend.composio.dev/api/v3/sl/cfvk6Wzcb1
  PKG_SHA256: 5d860a0ef92fb4e11ce1c713e60b6da60ddbf572ba9211c54a239603067d0733
  BASE: 96072c1fed3b6710904607c930a708d6fe67b40b
  WF: .github/workflows/apply-sky-time-search-20261018.yml

jobs:
  apply:
    if: github.ref_name == 'feat/sky-time-search-memory'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/sky-time-search-memory
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Already applied?
        id: done
        run: |
          if grep -q 'get_datetime' sky-tools.mjs; then echo 'already=1' >> "$GITHUB_OUTPUT"; fi
      - name: Overlay and verify tree
        if: steps.done.outputs.already != '1'
        run: |
          set -eu
          [ "$(git rev-parse HEAD~1)" = "$BASE" ] || { echo 'branch moved'; exit 1; }
          curl -fsSL --retry 3 -L "$PKG_URL" -o /tmp/pkg.tgz
          echo "$PKG_SHA256  /tmp/pkg.tgz" | sha256sum -c -
          mkdir /tmp/pk && tar xzf /tmp/pkg.tgz -C /tmp/pk
          cp -a /tmp/pk/f/. .
          for f in ai-agent.js sky-tools.mjs sky-time.mjs tool-registry.js prompt-registry.js gk-agent-worker.js; do node --check "$f"; done
          git add -A
          FP=$(git ls-files -s | grep -vF "$WF" | awk '{print $2, $4}' | sha256sum | cut -c1-64)
          [ "$FP" = "$(cat /tmp/pk/fp)" ] || { echo 'tree fingerprint mismatch'; git status --short; exit 1; }
      - name: Checks and tests
        if: steps.done.outputs.already != '1'
        run: |
          set -eu
          npm ci --ignore-scripts
          npm run check:worker-bundle
          cp sw.js /tmp/sw.packaged.js; npm run sw:manifest; cmp sw.js /tmp/sw.packaged.js
          for f in pr2-fast-start pr3-shared-answers sky-contact sky-core-memory phase9-m5-prompt-registry ai-agent-f1 ai-live-stages p30-ai-latency-cache p25-chat-cache ai-chat-history p06-personal-tutor honesty-guard i18n-guard p15-pwa-offline p21-ai-agent-ui dead-handler-guard panel-fullscreen sky-onboarding seo-routing sky-agent-tools account-retirement sky-daily-report sky-web-search sky-time-memory; do
            echo "::group::$f"; node "$f.test.mjs"; echo "::endgroup::"
          done
      - name: Commit and push
        if: steps.done.outputs.already != '1'
        run: |
          set -eu
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -qm 'feat(sky): core memory v3 knows web_search (when/how, sources), get_datetime clock + Bangla calendar, NOW line, Tavily key to chat'
          git push origin HEAD:feat/sky-time-search-memory
