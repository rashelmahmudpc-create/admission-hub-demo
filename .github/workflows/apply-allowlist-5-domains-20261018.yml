name: Apply 5-domain email allowlist 2026-10-18

# Owner order 2026-10-18: only gmail.com, yahoo.com, icloud.com, hotmail.com,
# outlook.com. Runs scripts/email-allowlist-20261018.py on this branch,
# bumps cache tokens, rebuilds worker-bundle.mjs, runs guard tests, commits back.

on:
  push:
    branches: [fix/allowlist-5-domains-20261018]
    paths:
      - '.github/workflows/apply-allowlist-5-domains-20261018.yml'
      - 'scripts/email-allowlist-20261018.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-allowlist-5-domains-20261018
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref_name == 'fix/allowlist-5-domains-20261018'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/allowlist-5-domains-20261018
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply allowlist
        run: |
          set -eu
          if [ ! -f scripts/email-allowlist-20261018.py ]; then echo 'Already applied.'; echo 'SKIP=1' >> "$GITHUB_ENV"; exit 0; fi
          python3 scripts/email-allowlist-20261018.py
          git checkout -- .github/workflows
          node scripts/sw-manifest.mjs
          git diff --stat
      - name: Rebuild Worker bundle
        if: env.SKIP != '1'
        run: |
          set -eu
          npm ci
          npm run build:worker
          npm run check:worker-bundle
          grep -q 'ALLOWED_EMAIL_DOMAINS' worker-bundle.mjs
      - name: Guard tests
        if: env.SKIP != '1'
        run: |
          set -eu
          node --test --test-concurrency=1 email-policy.test.mjs verification-orchestrator.test.mjs verification-providers.test.mjs descope-otp.test.mjs descope-magiclink.test.mjs backup-public-handler.test.mjs email-branding.test.mjs free-tier-failover.test.mjs native-auth-operations.test.mjs security-device-trust.test.mjs
          node --test native-auth.test.mjs 2>&1 | tee /tmp/na.log || true
          if grep -E '^not ok .*(signup|password reset|ownership|verification)' /tmp/na.log; then echo 'auth flow tests failing'; exit 1; fi
      - name: Commit and push to the feature branch
        if: env.SKIP != '1'
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -q scripts/email-allowlist-20261018.py
          git add -A
          git commit -m 'fix(auth): only gmail/yahoo/icloud/hotmail/outlook may sign up or receive codes (front + back)' -m 'Applied by apply-allowlist-5-domains-20261018.yml. School/college/edu and every other domain refused at the field and by the Worker.'
          git push origin HEAD:fix/allowlist-5-domains-20261018
