name: Apply Google redirect login 2026-10-17

# Applies scripts/apply-google-redirect-20261017.py on the feature branch:
# "Continue with Google" becomes a full-page redirect straight to
# accounts.google.com (own Firebase app, authDomain admissionsky.pages.dev), no
# popup and no direct GSI; other hosts hand off to admissionsky.pages.dev and
# in-app browsers get an "open in Chrome" panel. Regenerates the sw.js digests,
# runs the Google/UI tests and commits the result back to the SAME branch. It
# never touches main and never deploys: merge the PR and run
# deploy-pages-worker.yml to go live.
#
# The 41 KB patch script is fetched once and pinned by sha256 (a mismatch
# aborts), then committed to scripts/ so the branch holds the exact file.

on:
  push:
    branches: [feat/google-redirect]
    paths:
      - '.github/workflows/apply-google-redirect-20261017.yml'
      - 'scripts/apply-google-redirect-20261017.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-google-redirect-20261017
  cancel-in-progress: false

env:
  SCRIPT: scripts/apply-google-redirect-20261017.py
  SCRIPT_SHA256: ec3bdceacbc9cbeb4599dc0511169fa0aa4dd42b747bc448828c5282a9d0b265
  SCRIPT_URL: https://backend.composio.dev/api/v3/sl/1kWVwj8sgn

jobs:
  apply:
    if: github.ref_name == 'feat/google-redirect'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/google-redirect
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Fetch the pinned patch script
        run: |
          set -eu
          if [ ! -f "$SCRIPT" ]; then curl -fsSL "$SCRIPT_URL" -o "$SCRIPT"; fi
          echo "$SCRIPT_SHA256  $SCRIPT" | sha256sum -c -
      - name: Apply the Google redirect patch
        run: |
          set -eu
          python3 "$SCRIPT"
          python3 "$SCRIPT" >/dev/null
          grep -q "const GOOGLE_SKY_APP = 'ah-google-sky';" account-access.js
          grep -q "firebaseAuthFor('ah-google', GOOGLE_AUTH_DOMAIN)" account-access.js
          grep -q "return beginOAuthRedirect(auth, provider, true);" account-access.js
          grep -q "package=com.android.chrome;end" account-access.js
          if grep -q "DIRECT_GOOGLE\|initTokenClient" account-access.js; then echo 'direct GSI path still present'; exit 1; fi
          node --check account-access.js
          git diff --stat
      - name: Install and refresh the service-worker digests
        run: |
          set -eu
          npm ci
          npm run sw:manifest
      - name: Google and Facebook login tests (must pass)
        run: node --test --test-concurrency=1 google-redirect-login.test.mjs facebook-login-guard.test.mjs firebase-auth-ui.test.mjs firebase-google-auth.test.mjs
      - name: Wider UI tests (informational; some fail on main too)
        continue-on-error: true
        run: node --test --test-concurrency=1 multimethod-auth-ui.test.mjs native-auth-protection.test.mjs premium-onboarding-ui.test.mjs profile-ui.test.mjs code-native-welcome-v1.test.mjs
      - name: Commit and push to the feature branch
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$SCRIPT" account-access.js sw.js package.json google-redirect-login.test.mjs multimethod-auth-ui.test.mjs native-auth-protection.test.mjs
          if git diff --cached --quiet; then echo 'Nothing to commit (already applied).'; else
            git commit -m 'feat(google): full-page redirect to accounts.google.com on admissionsky.pages.dev, no popup/GSI, in-app browser -> Chrome, show error codes' -m 'Applied by apply-google-redirect-20261017.yml. No deploy.'
            git push origin HEAD:feat/google-redirect
          fi
          npm run check:sw-manifest
