name: Apply OTP delivery log 2026-10-18 (branch only)

# AUTH-ROADMAP step 0 (2/3). Runs ONLY on branch auth/step0-otp-log:
# records the auth test failures that already exist BEFORE the patch, applies
# scripts/fix-otp-delivery-log-20261018.py, rebuilds worker-bundle.mjs, and fails
# if the patch adds any NEW failing test. Then it commits the result back to the
# same branch (removing the script and this workflow) and deploys the branch build
# to the isolated staging Worker. It never touches main or production.

on:
  push:
    branches: [auth/step0-otp-log]
    paths:
      - '.github/workflows/apply-otp-delivery-log-20261018.yml'
      - 'scripts/fix-otp-delivery-log-20261018.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-otp-delivery-log-20261018
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref_name == 'auth/step0-otp-log'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: auth/step0-otp-log
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Baseline failures (before patch)
        run: |
          set -u
          CMD=$(node -p "require('./package.json').scripts['test:native-auth'].replace('node --test', 'node --test --test-reporter=tap')")
          bash -c "$CMD" > /tmp/base.tap 2>/dev/null || true
          grep -E '^not ok [0-9]+ - ' /tmp/base.tap | sed -E 's/^not ok [0-9]+ - //' | sort -u > /tmp/base.txt || true
          echo "baseline failing: $(wc -l < /tmp/base.txt)"; cat /tmp/base.txt
      - name: Apply patch and rebuild bundle
        run: |
          set -eu
          python3 scripts/fix-otp-delivery-log-20261018.py
          node --check auth-native/verification/orchestrator.mjs
          node --check auth-native/worker/auth-authority-do.mjs
          npm run build:worker
          npm run check:worker-bundle
          git diff --stat
      - name: Strict tests (must all pass)
        run: |
          set -eu
          node --test --test-concurrency=1 otp-delivery-log.test.mjs verification-orchestrator.test.mjs
          npm run test:descope
      - name: No new failures vs baseline
        run: |
          set -u
          CMD=$(node -p "require('./package.json').scripts['test:native-auth'].replace('node --test', 'node --test --test-reporter=tap')")
          bash -c "$CMD" > /tmp/after.tap 2>/dev/null || true
          grep -E '^not ok [0-9]+ - ' /tmp/after.tap | sed -E 's/^not ok [0-9]+ - //' | sort -u > /tmp/after.txt || true
          comm -13 /tmp/base.txt /tmp/after.txt > /tmp/new.txt
          echo "after failing: $(wc -l < /tmp/after.txt); new: $(wc -l < /tmp/new.txt)"
          if [ -s /tmp/new.txt ]; then echo 'NEW FAILURES:'; cat /tmp/new.txt; exit 1; fi
      - name: Commit back to branch
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -q scripts/fix-otp-delivery-log-20261018.py .github/workflows/apply-otp-delivery-log-20261018.yml
          git add -A
          git status --short
          git commit -m 'auth step 0 (2/3): log provider, latency and outcome for every OTP send' -m 'Orchestrator emits through an injected sink (observability/otp-delivery-log.mjs); auth-native stays log-free. Applied by apply-otp-delivery-log-20261018.yml.'
          git push origin HEAD:auth/step0-otp-log
      - name: Refuse an unisolated staging config
        run: node scripts/check-staging-isolation.mjs wrangler.staging.toml
      - name: Deploy branch build to staging
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.35.0'
          command: deploy --config wrangler.staging.toml
