name: CodeQL Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 20 * * 5" # Friday 02:30 Dhaka (Saturday) — weekly full scan
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (JavaScript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none
          config: |
            paths-ignore:
              - node_modules
              - worker-bundle.mjs
              - sdk
              - "**/*.test.mjs"
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
