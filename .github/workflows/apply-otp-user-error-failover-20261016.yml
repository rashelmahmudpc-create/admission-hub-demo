name: Apply OTP user-error failover 2026-10-16

# Owner order 2026-10-16: admin panel shows otp-f (MailerSend) half-open with
# PROVIDER_HTTP_422 while otp-h (Logto) has 0 sends. A half-open slot is probed
# first; its 422 is USER class, which aborted the whole request, so Logto was
# never tried. Fix: only INVALID_DESTINATION (the address itself is bad) stops
# the request; any other USER-class provider error fails over to the next slot.
# Also raises the default codeTtlSeconds 300 -> 600 (max) for late deliveries.
# Edits files, rebuilds worker-bundle.mjs, runs tests, commits to the SAME branch.
# Never touches main, never deploys.

on:
  push:
    branches: [fix/otp-user-error-failover]
    paths:
      - '.github/workflows/apply-otp-user-error-failover-20261016.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-otp-user-error-failover-20261016
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref_name == 'fix/otp-user-error-failover'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/otp-user-error-failover
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Fail over on non-destination USER errors, TTL 600
        run: |
          set -eu
          python3 - <<'PY'
          p = 'auth-native/verification/orchestrator.mjs'
          s = open(p, encoding='utf-8').read()
          old = ("          if (failure.failureClass === VERIFICATION_FAILURE_CLASS.USER) {\n"
                 "            await this.repository.failChallenge({ attemptId, reason: failure.code, now });\n"
                 "            throw new NativeAuthError(AUTH_ERROR_CODES.INVALID_INPUT);\n"
                 "          }\n")
          new = ("          if (failure.failureClass === VERIFICATION_FAILURE_CLASS.USER) {\n"
                 "            // Owner 2026-10-16: only a rejected address stops the request. Any other\n"
                 "            // USER-class reply (e.g. MailerSend 422 while half-open) is that provider's\n"
                 "            // problem, so skip it and let the next slot (Logto/Appwrite) carry the send.\n"
                 "            if (failure.code === 'INVALID_DESTINATION') {\n"
                 "              await this.repository.failChallenge({ attemptId, reason: failure.code, now });\n"
                 "              throw new NativeAuthError(AUTH_ERROR_CODES.INVALID_INPUT);\n"
                 "            }\n"
                 "            break;\n"
                 "          }\n")
          if "if (failure.code === 'INVALID_DESTINATION') {" not in s:
              assert s.count(old) == 1, 'orchestrator anchor not found exactly once'
              s = s.replace(old, new)
          open(p, 'w', encoding='utf-8').write(s)

          c = 'auth-native/verification/config.mjs'
          x = open(c, encoding='utf-8').read()
          o = "const DEFAULT_POLICY = Object.freeze({\n  codeTtlSeconds: 300,"
          n = "const DEFAULT_POLICY = Object.freeze({\n  codeTtlSeconds: 600,"
          if n not in x:
              assert x.count(o) == 1, 'config anchor not found'
              x = x.replace(o, n)
          open(c, 'w', encoding='utf-8').write(x)

          t = 'verification-orchestrator.test.mjs'
          y = open(t, encoding='utf-8').read()
          o1 = "test('OTP expires after five minutes and resend cooldown is enforced'"
          if o1 in y:
              y = y.replace(o1, "test('OTP expires after ten minutes and resend cooldown is enforced'")
              i = y.index("test('OTP expires after ten minutes")
              j = y.index("app.advance(300_001);", i)
              y = y[:j] + "app.advance(600_001);" + y[j + len("app.advance(300_001);"):]
          marker = "owner 2026-10-16 (user-error failover)"
          if marker not in y:
              y = y.rstrip('\n') + '\n' + r'''
          test('owner 2026-10-16 (user-error failover): a provider 422 fails over to the next slot', async () => {
            const mailersend = new MockProvider({ id: 'otp-f' });
            mailersend.sendVerification = async input => {
              mailersend.sends.push(input);
              throw new VerificationProviderError('PROVIDER_HTTP_422', VERIFICATION_FAILURE_CLASS.USER);
            };
            const logto = new MockProvider({ id: 'otp-h', verificationMode: VERIFICATION_MODES.PROVIDER_EVIDENCE });
            const app = setup({ providers: [mailersend, logto] });
            const result = await app.orchestrator.requestVerification(identity, context);
            assert.equal(result.accepted, true);
            assert.equal(mailersend.sends.length, 1, 'no retry on the same provider');
            assert.equal(logto.sends.length, 1, 'Logto carries the send');
          });

          test('owner 2026-10-16 (user-error failover): an invalid destination still stops the request', async () => {
            const first = new MockProvider({ id: 'otp-f', sendPlan: ['user'] });
            const second = new MockProvider({ id: 'otp-h', verificationMode: VERIFICATION_MODES.PROVIDER_EVIDENCE });
            const app = setup({ providers: [first, second] });
            await expectCode(() => app.orchestrator.requestVerification(identity, context), AUTH_ERROR_CODES.INVALID_INPUT);
            assert.equal(second.sends.length, 0);
          });
          '''.replace('\n          ', '\n')
              open(t, 'w', encoding='utf-8').write(y)
          PY
          git diff --stat
      - name: Install and rebuild the Worker bundle
        run: |
          set -eu
          npm ci
          npm run build:worker
          npm run check:worker-bundle
      - name: Verification tests
        run: node --test --test-concurrency=1 verification-providers.test.mjs verification-orchestrator.test.mjs free-tier-failover.test.mjs backup-public-handler.test.mjs email-branding.test.mjs
      - name: compact-auth-config (pre-existing failure on main, non-blocking)
        continue-on-error: true
        run: node --test --test-concurrency=1 compact-auth-config.test.mjs
      - name: Commit and push to the feature branch
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add auth-native/verification/orchestrator.mjs auth-native/verification/config.mjs verification-orchestrator.test.mjs worker-bundle.mjs
          if git diff --cached --quiet; then echo 'Nothing to commit (already applied).'; else
            git commit -m 'fix(otp): non-destination provider USER errors fail over; default code TTL 600s' -m 'Applied by apply-otp-user-error-failover-20261016.yml. No deploy.'
            git push origin HEAD:fix/otp-user-error-failover
          fi
