name: Apply Google client fix 2026-10-15

# Owner-approved 2026-10-15. Points the direct Google sign-in at the Firebase
# project's own web client (916950643726) so Firebase accepts the token, then
# bumps the shell cache versions and regenerates the service-worker digests.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-google-client-fix-20261015.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-google-client-fix-20261015
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Switch the direct Google client ID
        run: |
          set -eu
          OLD='203304845427-lpfj17ponue2bjapvt8mnl7tioupar27.apps.googleusercontent.com'
          NEW='916950643726-6ul6djp3ve11ek37bbht715afb6pc0ka.apps.googleusercontent.com'
          if grep -q "$NEW" account-access.js && ! grep -q "$OLD" account-access.js; then echo 'Client ID already applied.'; else
            grep -q "$OLD" account-access.js
            sed -i "s/$OLD/$NEW/g" account-access.js
          fi
          grep -q "DIRECT_GOOGLE_CLIENT_ID = '$NEW'" account-access.js
          ! grep -q "$OLD" account-access.js
      - name: Bump cache versions and regenerate service-worker digests
        run: |
          set -eu
          if grep -q "BUILD_ID = 'v345-google-client'" sw.js; then echo 'Cache already bumped.'; node scripts/sw-manifest.mjs; else node scripts/cache-bump.mjs; fi
          grep -q "BUILD_ID = 'v345-google-client'" sw.js
          grep -q 'account-access.js?v=20261017-gclient1' index.html
          grep -q 'account-access.js?v=20261017-gclient1' sw.js
      - name: Syntax check
        run: |
          node --check account-access.js
          node --check sw.js
      - name: Commit and push
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git restore --source=HEAD --staged --worktree -- .github/workflows
          git add -A
          if git diff --cached --quiet; then echo 'Nothing to commit (already applied).'; exit 0; fi
          git commit -m 'fix(auth): direct Google sign-in uses Firebase client 916950643726; shell v345-google-client' -m 'Applied by apply-google-client-fix-20261015.yml; sw.js digests regenerated.'
          for i in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1
