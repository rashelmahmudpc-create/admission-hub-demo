name: Apply Descope magic link guard fix 2026-10-18

# Runs scripts/descope-magiclink-fix-20261018.py on feat/descope-magiclink: the
# magic-link attemptId moves from localStorage to a 10-minute cookie (client code
# must not use Web Storage), and two UI guard tests learn the new card/cookie.
# Regenerates sw.js, runs guard tests, commits back. No deploy.

on:
  push:
    branches: [feat/descope-magiclink]
    paths:
      - '.github/workflows/apply-descope-magiclink-fix-20261018.yml'
      - 'scripts/descope-magiclink-fix-20261018.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-descope-magiclink-fix-20261018
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref_name == 'feat/descope-magiclink'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/descope-magiclink
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply fix
        run: |
          set -eu
          if [ ! -f scripts/descope-magiclink-fix-20261018.py ]; then echo 'Already applied.'; echo 'SKIP=1' >> "$GITHUB_ENV"; exit 0; fi
          python3 scripts/descope-magiclink-fix-20261018.py
          node scripts/sw-manifest.mjs
          check() { got=$(git hash-object "$2"); [ "$got" = "$1" ] || { echo "MISMATCH $2 $got"; exit 1; }; echo "OK $2"; }
          check be490f24f1e7c4d00d0831025f37d79646c1c0b3 account-access.js
          check cf5557e36c9b12b1d758a1189cfd89c3113d6fe2 code-native-welcome-v1.test.mjs
          check c279742d0caa02f52f08b65592ce63c0b797ebd7 native-auth-protection.test.mjs
          if grep -q localStorage account-access.js; then echo 'localStorage still present'; exit 1; fi
          git diff --stat
      - name: Guard tests
        if: env.SKIP != '1'
        run: |
          set -eu
          npm ci
          npm run check:worker-bundle
          node --test --test-concurrency=1 descope-magiclink.test.mjs descope-otp.test.mjs verification-providers.test.mjs verification-orchestrator.test.mjs account-retirement.test.mjs
          node --test native-auth-protection.test.mjs 2>&1 | tee /tmp/nap.log || true
          if grep -q 'not ok .*credentials remain in server-managed' /tmp/nap.log; then echo 'credential guard still failing'; exit 1; fi
          node --test code-native-welcome-v1.test.mjs 2>&1 | tee /tmp/cnw.log || true
          if grep -q 'not ok .*unsupported verification methods remain truthful' /tmp/cnw.log; then echo 'method-card guard still failing'; exit 1; fi
      - name: Commit and push to the feature branch
        if: env.SKIP != '1'
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -q scripts/descope-magiclink-fix-20261018.py
          git add account-access.js sw.js code-native-welcome-v1.test.mjs native-auth-protection.test.mjs
          git commit -m 'fix(auth): magic-link attemptId in a 10-min cookie (no Web Storage); guard tests updated' -m 'Applied by apply-descope-magiclink-fix-20261018.yml. No deploy.'
          git push origin HEAD:feat/descope-magiclink
