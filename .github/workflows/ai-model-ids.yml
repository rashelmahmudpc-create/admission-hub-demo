name: AI provider model ids (manual, read-only)

# Lists the first few model ids each provider advertises, so a 404/400 caused
# by a wrong model name can be corrected. Only model ids are printed; no keys.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type MODELS to list provider model ids
        required: true
        type: string

permissions:
  contents: read

jobs:
  models:
    if: ${{ inputs.confirmation == 'MODELS' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: List model ids
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NS: b9353515b098427687afcfb8654ed359
        run: |
          set -eu
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/${CF_ACCT}/storage/kv/namespaces/${NS}/values/secret:AI_KEYS" \
            -H "Authorization: Bearer ${CF_TOKEN}" -o /tmp/aikeys.json
          cat > /tmp/models.mjs <<'NODE'
          import fs from 'node:fs';
          const kv = JSON.parse(fs.readFileSync('/tmp/aikeys.json','utf8'));
          const first = v => String(v||'').split(',')[0].trim();
          const provs = [
            ['CEREBRAS', 'https://api.cerebras.ai/v1/models', first(kv.CEREBRAS_API_KEYS)],
            ['LLM7', 'https://api.llm7.io/v1/models', first(kv.LLM7_API_KEYS)],
            ['AIML', 'https://api.aimlapi.com/v1/models', first(kv.AIML_API_KEYS)],
            ['SILICONFLOW', 'https://api.siliconflow.cn/v1/models', first(kv.SILICONFLOW_API_KEYS)],
            ['MISTRAL', 'https://api.mistral.ai/v1/models', first(kv.MISTRAL_API_KEYS)],
            ['KIMI', 'https://api.moonshot.ai/v1/models', first(kv.KIMI_API_KEYS)],
            ['STEPFUN', 'https://api.stepfun.ai/v1/models', first(kv.STEPFUN_API_KEYS)],
          ];
          for (const [name,url,key] of provs) {
            if (!key) { console.log('== '+name+': no key'); continue; }
            try {
              const r = await fetch(url, { headers:{ Authorization:'Bearer '+key }, signal:AbortSignal.timeout(15000) });
              console.log('== '+name+' ('+r.status+')');
              if (r.status === 200) {
                const j = await r.json();
                const ids = (j.data||j.models||[]).map(m=>m.id||m.name).slice(0,8);
                console.log('  ids:', ids.join(', '));
              }
            } catch(e) { console.log('== '+name+': ERR '+String(e).slice(0,40)); }
          }
          NODE
          sed -i 's/^          //' /tmp/models.mjs
          node /tmp/models.mjs
