name: Apply logout + OTP + welcome fix 2026-10-18

# Applies scripts/fix-logout-otp-20261018.py on main, restores the five files that
# #89 accidentally replaced with a sandbox path string (from 43594cf), rebuilds
# worker-bundle.mjs + sw.js digests, runs guard tests, commits to main and then
# dispatches deploy-pages-worker.yml (confirmation=DEPLOY).

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-logout-otp-fix-20261018.yml'
      - 'scripts/fix-logout-otp-20261018.py'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: apply-logout-otp-fix-20261018
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply fix
        run: |
          set -eu
          if [ ! -f scripts/fix-logout-otp-20261018.py ]; then echo 'Already applied.'; echo 'SKIP=1' >> "$GITHUB_ENV"; exit 0; fi
          for f in ai-agent.js prompt-registry.js phase9-m5-prompt-registry.test.mjs phase9-m6-tool-registry.test.mjs phase9-m7-memory-engine.test.mjs; do
            if head -c 40 "$f" | grep -q '^/home/user/'; then git checkout 43594cf -- "$f"; echo "restored $f"; fi
          done
          python3 scripts/fix-logout-otp-20261018.py
          node scripts/sw-manifest.mjs
          npm ci
          npm run build:worker
          npm run check:worker-bundle
          node --check account-access.js
          node --check welcome-story.js
          git diff --stat
      - name: Guard tests
        if: env.SKIP != '1'
        run: |
          set -eu
          node --test --test-concurrency=1 security-device-trust.test.mjs security-policy.test.mjs security-challenge.test.mjs relogin-device-challenge-ui.test.mjs logout-data-safety.test.mjs phase9-m5-prompt-registry.test.mjs phase9-m6-tool-registry.test.mjs
      - name: Commit, push and deploy
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -q scripts/fix-logout-otp-20261018.py
          git add -A
          git status --short
          git commit -m 'fix: welcome buttons under Reduce Motion, real Profile logout, trusted device after first verification' -m 'Restores ai-agent.js/prompt-registry.js + 3 tests broken by #89. Applied by apply-logout-otp-fix-20261018.yml.'
          git push origin HEAD:main
          gh workflow run deploy-pages-worker.yml --ref main -f confirmation=DEPLOY
