name: Apply non-Gmail Logto first 2026-10-16

# Owner order 2026-10-16: Logto (otp-h) delivered a code to Yahoo within seconds,
# while Appwrite (otp-i) arrived too late for the 5-minute code. For non-Gmail
# freemail recipients (iCloud/Yahoo/Outlook...) try Logto first, then Appwrite.
# Gmail keeps the operator order. Only NON_GMAIL_PREFERENCE changes:
#   otp-h 15-30 = -15 (first), otp-i 38-40 = -2 (second), otp-b 5, otp-e 7, otp-a 10.
# A resend demotes the previous slot by +25, so Logto -> Appwrite alternate.
# Edits orchestrator.mjs + adds tests, rebuilds worker-bundle.mjs, runs tests and
# commits to the SAME branch. Never touches main, never deploys.

on:
  push:
    branches: [feat/non-gmail-logto-first]
    paths:
      - '.github/workflows/apply-non-gmail-logto-first-20261016.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-non-gmail-logto-first-20261016
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref_name == 'feat/non-gmail-logto-first'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/non-gmail-logto-first
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Prefer Logto then Appwrite for non-Gmail recipients
        run: |
          set -eu
          python3 - <<'PY'
          p = 'auth-native/verification/orchestrator.mjs'
          s = open(p, encoding='utf-8').read()
          old = "const NON_GMAIL_PREFERENCE = Object.freeze({ 'otp-i': -40, 'otp-b': -15, 'otp-e': -30 });"
          new = ("// Owner 2026-10-16 (later still): Logto (otp-h) lands in Yahoo within seconds while\n"
                 "// Appwrite can arrive after the code expired, so Logto goes first (15-30 = -15) and\n"
                 "// Appwrite second (38-40 = -2); a resend (+25) then alternates between the two.\n"
                 "const NON_GMAIL_PREFERENCE = Object.freeze({ 'otp-h': -30, 'otp-i': -40, 'otp-b': -15, 'otp-e': -30 });")
          if old in s:
              assert s.count(old) == 1
              s = s.replace(old, new)
          assert "'otp-h': -30, 'otp-i': -40" in s
          open(p, 'w', encoding='utf-8').write(s)
          t = 'verification-orchestrator.test.mjs'
          x = open(t, encoding='utf-8').read()
          marker = "owner 2026-10-16 (Logto first)"
          if marker not in x:
              x = x.rstrip('\n') + '\n' + r'''
          const liveOrderConfig = list => {
            const base = rawConfig(list);
            const live = { 'otp-a': 10, 'otp-h': 15, 'otp-i': 38 };
            return { ...base, allowedDomains: ['gmail.com', 'yahoo.com', 'icloud.com', 'outlook.com'], providers: base.providers.map(row => ({ ...row, priority: live[row.id] })) };
          };

          test('owner 2026-10-16 (Logto first): a Yahoo recipient goes to Logto before Appwrite and Brevo', async () => {
            const brevo = new MockProvider({ id: 'otp-a' });
            const logto = new MockProvider({ id: 'otp-h', verificationMode: VERIFICATION_MODES.PROVIDER_EVIDENCE });
            const appwrite = new MockProvider({ id: 'otp-i', verificationMode: VERIFICATION_MODES.PROVIDER_EVIDENCE });
            const app = setup({ providers: [brevo, logto, appwrite], config: liveOrderConfig([brevo, logto, appwrite]) });
            const result = await app.orchestrator.requestVerification(ownershipIdentity('student@yahoo.com'), context);
            assert.equal(result.accepted, true);
            assert.equal(logto.sends.length, 1, 'Logto must carry the Yahoo send');
            assert.equal(appwrite.sends.length, 0);
            assert.equal(brevo.sends.length, 0);
          });

          test('owner 2026-10-16 (Logto first): Appwrite carries a Yahoo send when Logto is unavailable', async () => {
            const brevo = new MockProvider({ id: 'otp-a' });
            const logto = new MockProvider({ id: 'otp-h', verificationMode: VERIFICATION_MODES.PROVIDER_EVIDENCE });
            const appwrite = new MockProvider({ id: 'otp-i', verificationMode: VERIFICATION_MODES.PROVIDER_EVIDENCE });
            logto.checkAvailability = async () => ({ available: false, code: 'NOT_CONFIGURED' });
            const app = setup({ providers: [brevo, logto, appwrite], config: liveOrderConfig([brevo, logto, appwrite]) });
            const result = await app.orchestrator.requestVerification(ownershipIdentity('student@outlook.com'), context);
            assert.equal(result.accepted, true);
            assert.equal(appwrite.sends.length, 1, 'Appwrite is the second choice');
            assert.equal(brevo.sends.length, 0);
          });

          test('owner 2026-10-16 (Logto first): a Gmail recipient keeps Brevo first', async () => {
            const brevo = new MockProvider({ id: 'otp-a' });
            const logto = new MockProvider({ id: 'otp-h', verificationMode: VERIFICATION_MODES.PROVIDER_EVIDENCE });
            const appwrite = new MockProvider({ id: 'otp-i', verificationMode: VERIFICATION_MODES.PROVIDER_EVIDENCE });
            const app = setup({ providers: [brevo, logto, appwrite], config: liveOrderConfig([brevo, logto, appwrite]) });
            await app.orchestrator.requestVerification(ownershipIdentity('student@gmail.com'), context);
            assert.equal(brevo.sends.length, 1, 'Gmail keeps the operator order');
            assert.equal(logto.sends.length, 0);
            assert.equal(appwrite.sends.length, 0);
          });
          '''.replace('\n          ', '\n')
              open(t, 'w', encoding='utf-8').write(x)
          PY
          git diff --stat
      - name: Install and rebuild the Worker bundle
        run: |
          set -eu
          npm ci
          npm run build:worker
          npm run check:worker-bundle
      - name: Verification tests
        run: node --test --test-concurrency=1 verification-providers.test.mjs verification-orchestrator.test.mjs compact-auth-config.test.mjs free-tier-failover.test.mjs backup-public-handler.test.mjs email-branding.test.mjs
      - name: Commit and push to the feature branch
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add auth-native/verification/orchestrator.mjs verification-orchestrator.test.mjs worker-bundle.mjs
          if git diff --cached --quiet; then echo 'Nothing to commit (already applied).'; else
            git commit -m 'feat(otp): non-Gmail recipients try Logto first, then Appwrite' -m 'Applied by apply-non-gmail-logto-first-20261016.yml. No deploy.'
            git push origin HEAD:feat/non-gmail-logto-first
          fi
