name: Apply student schema 2026-10-17

# Fresh Start phase 2. Applies scripts/apply-student-schema-20261017.py on the
# feature branch: wires the versioned student-directory schema into the
# AUTH_AUTHORITY Durable Object start-up (additive, try/catch), adds its test
# to test:native-auth, rebuilds worker-bundle.mjs, runs the tests and commits
# back to the SAME branch. Never touches main and never deploys.

on:
  push:
    branches: [feat/student-schema]
    paths:
      - '.github/workflows/apply-student-schema-20261017.yml'
      - 'scripts/apply-student-schema-20261017.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-student-schema-20261017
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref_name == 'feat/student-schema'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/student-schema
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply the patch (twice, must be idempotent)
        run: |
          set -eu
          python3 scripts/apply-student-schema-20261017.py
          python3 scripts/apply-student-schema-20261017.py
          grep -q "migrateStudentDirectory(state.storage)" auth-native/worker/auth-authority-do.mjs
          node --check auth-native/worker/auth-authority-do.mjs
          git diff --stat
      - name: Install and rebuild the Worker bundle
        run: |
          set -eu
          npm ci
          npm run build:worker
          npm run check:worker-bundle
          grep -q "student_directory_v1" worker-bundle.mjs
      - name: Schema + auth storage tests (must pass)
        run: node --test --test-concurrency=1 student-directory-schema.test.mjs sqlite-auth-runtime.test.mjs native-auth.test.mjs verification-orchestrator.test.mjs
      - name: Commit and push to the feature branch
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add auth-native/worker/auth-authority-do.mjs package.json docs/fresh-start-plan.md worker-bundle.mjs
          if git diff --cached --quiet; then echo 'Nothing to commit (already applied).'; else
            git commit -m 'feat(db): run the student-directory schema v1 on every AUTH_AUTHORITY start (additive, isolated), rebuild worker-bundle.mjs (Fresh Start phase 2)' -m 'Applied by apply-student-schema-20261017.yml. No deploy.'
            git push origin HEAD:feat/student-schema
          fi
          npm run check:worker-bundle
