name: Apply Sky web_search (Tavily) 2026-10-18

# Owner 2026-10-18: server tool web_search (Tavily) in sky-web-search.mjs, wired via
# sky-tools.mjs + tool-registry 'web.search'. Only news/recent questions, daily cap,
# no student data sent, source links cited. Package checked by SHA-256, final tree
# by fingerprint. Never deploys.

on:
  push:
    branches: [feat/sky-web-search-2]
    paths: ['.github/workflows/apply-sky-web-search-20261018.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  PKG_URL: https://backend.composio.dev/api/v3/sl/KIApO28ff4
  PKG_SHA256: 3e620afc32ab862531a496ca4de7992749ffca3d3859657425d06996a38bbaa7
  BASE: 44a4b9f5e15a95184c30c91a0ee859b8b5821b64
  WF: .github/workflows/apply-sky-web-search-20261018.yml

jobs:
  apply:
    if: github.ref_name == 'feat/sky-web-search-2'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/sky-web-search-2
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Already applied?
        id: done
        run: |
          if [ -f sky-web-search.mjs ]; then echo 'already=1' >> "$GITHUB_OUTPUT"; fi
      - name: Overlay and verify tree
        if: steps.done.outputs.already != '1'
        run: |
          set -eu
          [ "$(git rev-parse HEAD~1)" = "$BASE" ] || { echo 'branch moved'; exit 1; }
          curl -fsSL --retry 3 -L "$PKG_URL" -o /tmp/pkg.tgz
          echo "$PKG_SHA256  /tmp/pkg.tgz" | sha256sum -c -
          mkdir /tmp/pk && tar xzf /tmp/pkg.tgz -C /tmp/pk
          cp -a /tmp/pk/f/. .
          node --check ai-agent.js
          git add -A
          FP=$(git ls-files -s | grep -vF "$WF" | awk '{print $2, $4}' | sha256sum | cut -c1-64)
          [ "$FP" = "$(cat /tmp/pk/fp)" ] || { echo 'tree fingerprint mismatch'; git status --short; exit 1; }
      - name: Checks and tests
        if: steps.done.outputs.already != '1'
        run: |
          set -eu
          npm ci --ignore-scripts
          npm run check:worker-bundle
          cp sw.js /tmp/sw.packaged.js; npm run sw:manifest; cmp sw.js /tmp/sw.packaged.js
          for f in pr2-fast-start pr3-shared-answers sky-contact sky-core-memory phase9-m5-prompt-registry ai-agent-f1 ai-live-stages p30-ai-latency-cache p25-chat-cache ai-chat-history p06-personal-tutor honesty-guard i18n-guard p15-pwa-offline p21-ai-agent-ui dead-handler-guard panel-fullscreen sky-onboarding seo-routing sky-agent-tools account-retirement sky-daily-report sky-web-search phase9-m6-tool-registry; do
            echo "::group::$f"; node "$f.test.mjs"; echo "::endgroup::"
          done
      - name: Commit and push
        if: steps.done.outputs.already != '1'
        run: |
          set -eu
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -qm 'feat(sky): web_search tool (Tavily) for news/recent questions; daily cap, no student data sent, source links'
          git push origin HEAD:feat/sky-web-search-2
