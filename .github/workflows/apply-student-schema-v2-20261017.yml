name: Apply student schema v2 2026-10-17

# Fresh Start phase 2, re-applied on top of main after PR #69 (replaces PR #70,
# which conflicted only in the generated worker-bundle.mjs).
# Takes the reviewed source files from feat/student-schema (schema, test, apply
# script), applies scripts/apply-student-schema-20261017.py (DO wiring in
# try/catch, no logging; test added to test:native-auth; plan ticked), rebuilds
# worker-bundle.mjs, runs the tests and commits back to THIS branch.
# Never touches main and never deploys.

on:
  push:
    branches: [feat/student-schema-v2]
    paths:
      - '.github/workflows/apply-student-schema-v2-20261017.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-student-schema-v2-20261017
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref_name == 'feat/student-schema-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/student-schema-v2
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Bring the phase 2 source files from feat/student-schema
        run: |
          set -eu
          git fetch origin feat/student-schema
          git checkout FETCH_HEAD -- auth-native/storage/student-directory-schema.mjs student-directory-schema.test.mjs scripts/apply-student-schema-20261017.py
      - name: Apply the patch (twice, must be idempotent)
        run: |
          set -eu
          python3 scripts/apply-student-schema-20261017.py
          python3 scripts/apply-student-schema-20261017.py
          grep -q "migrateStudentDirectory(state.storage)" auth-native/worker/auth-authority-do.mjs
          ! grep -q "console\." auth-native/worker/auth-authority-do.mjs
          node --check auth-native/worker/auth-authority-do.mjs
          git diff --stat
      - name: Install and rebuild the Worker bundle
        run: |
          set -eu
          npm ci
          npm run build:worker
          npm run check:worker-bundle
          grep -q "student_directory_v1" worker-bundle.mjs
      - name: Schema + auth storage tests (must pass)
        run: node --test --test-concurrency=1 student-directory-schema.test.mjs sqlite-auth-runtime.test.mjs native-auth.test.mjs verification-orchestrator.test.mjs
      - name: Auth protection guard (must pass; one shell-literal test skipped, it fails on main too)
        run: node --test --test-concurrency=1 --test-skip-pattern="release guard literals still match the shipped shell" native-auth-protection.test.mjs
      - name: Commit and push to the feature branch
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add auth-native/storage/student-directory-schema.mjs student-directory-schema.test.mjs scripts/apply-student-schema-20261017.py auth-native/worker/auth-authority-do.mjs package.json docs/fresh-start-plan.md worker-bundle.mjs
          if git diff --cached --quiet; then echo 'Nothing to commit (already applied).'; else
            git commit -m 'feat(db): versioned student-directory schema v1 on every AUTH_AUTHORITY start (additive, isolated), rebuild worker-bundle.mjs (Fresh Start phase 2)' -m 'Applied by apply-student-schema-v2-20261017.yml on top of main. No deploy.'
            git push origin HEAD:feat/student-schema-v2
          fi
          npm run check:worker-bundle
