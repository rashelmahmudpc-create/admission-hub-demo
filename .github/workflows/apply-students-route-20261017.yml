name: Apply Students route fix 2026-10-17

# Fresh Start phase 3 follow-up: #73 shipped students-control-center.html but did
# not add it to PUBLIC_ROUTES in _worker.js, so the page answered 404 live.
# Downloads the reviewed patch (sha256 pinned), applies it, runs the routing
# tests and commits back to THIS branch. Never touches main, never deploys.

on:
  push:
    branches: [fix/students-cc-route]
    paths:
      - '.github/workflows/apply-students-route-20261017.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.ref_name == 'fix/students-cc-route'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/students-cc-route
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply the patch (idempotent)
        run: |
          set -eu
          if grep -q "'/students-control-center', '/students-control-center.html'" _worker.js; then echo 'Already applied.'; exit 0; fi
          curl -fsSL https://backend.composio.dev/api/v3/sl/pvUjDbjGWC -o /tmp/route.patch
          echo '926e46bd51593842753bdc9ba9a96395ccd8bfacafcb86df38fa78c0ec6f31e2  /tmp/route.patch' | sha256sum -c -
          git apply /tmp/route.patch
          node --check _worker.js
          git diff --stat
      - name: Routing tests (must pass)
        run: |
          set -eu
          npm ci
          node --test seo-routing.test.mjs legal-page-routing.test.mjs
      - name: Commit and push to the fix branch
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _worker.js seo-routing.test.mjs
          if git diff --cached --quiet; then echo 'Nothing to commit.'; else
            git commit -m 'fix(routing): serve /students-control-center (missing from PUBLIC_ROUTES after #73)' -m 'Applied by apply-students-route-20261017.yml. No deploy.'
            git push origin HEAD:fix/students-cc-route
          fi
