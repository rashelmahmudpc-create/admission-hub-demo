name: Apply Google landing fix 2026-10-17

# Applies scripts/apply-google-landing-20261017.py on the feature branch: after
# a Google/Facebook redirect sign-in the page lands on the Dashboard instead of
# staying on the Sky signup flow. Regenerates the sw.js digests, runs the
# Google/UI tests and commits the result back to the SAME branch. It never
# touches main and never deploys.

on:
  push:
    branches: [fix/google-landing]
    paths:
      - '.github/workflows/apply-google-landing-20261017.yml'
      - 'scripts/apply-google-landing-20261017.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-google-landing-20261017
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref_name == 'fix/google-landing'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/google-landing
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply the Google landing patch
        run: |
          set -eu
          python3 scripts/apply-google-landing-20261017.py
          python3 scripts/apply-google-landing-20261017.py >/dev/null
          grep -q "const landOnDashboard = () => {" account-access.js
          grep -q "      landOnDashboard();" account-access.js
          grep -q "if (state.oauthLanded && accountVerified(state.session)) return;" account-access.js
          node --check account-access.js
          git diff --stat
      - name: Install and refresh the service-worker digests
        run: |
          set -eu
          npm ci
          npm run sw:manifest
      - name: Google and Facebook login tests (must pass)
        run: node --test --test-concurrency=1 google-redirect-login.test.mjs facebook-login-guard.test.mjs firebase-auth-ui.test.mjs firebase-google-auth.test.mjs
      - name: Wider UI tests (informational; some fail on main too)
        continue-on-error: true
        run: node --test --test-concurrency=1 multimethod-auth-ui.test.mjs native-auth-protection.test.mjs premium-onboarding-ui.test.mjs profile-ui.test.mjs code-native-welcome-v1.test.mjs
      - name: Commit and push to the feature branch
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add account-access.js sw.js google-redirect-login.test.mjs
          if git diff --cached --quiet; then echo 'Nothing to commit (already applied).'; else
            git commit -m 'fix(google): land on the Dashboard after a redirect sign-in instead of staying on the Sky signup flow' -m 'Applied by apply-google-landing-20261017.yml. No deploy.'
            git push origin HEAD:fix/google-landing
          fi
          npm run check:sw-manifest
