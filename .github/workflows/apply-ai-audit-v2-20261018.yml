name: Apply AI audit fixes v2 (#57 on main 879f36b)

# Owner order 2026-10-18 ("হ্যাঁ"): redo #57 on today's main.
# #57 conflicted in ai-agent.js (new limitMessage + refund kept together),
# gk-agent-worker.js (Tavily keys + kill-switch vars kept together) and the bundle
# (rebuilt). Package checked by SHA-256, final tree by fingerprint. Commits to the
# same branch only. Never touches main, never deploys.

on:
  push:
    branches: [fix/ai-audit-v2-20261018]
    paths: ['.github/workflows/apply-ai-audit-v2-20261018.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  PKG_URL: https://backend.composio.dev/api/v3/sl/oTnsgWx5az
  PKG_SHA256: 8ce9418aed8e78d5bede73462e56336f41923dd47d838d74d067676f96e6b522
  BASE: 879f36b82de0df764f4470911280c7bec3a64c5d
  WF: .github/workflows/apply-ai-audit-v2-20261018.yml

jobs:
  apply:
    if: github.ref_name == 'fix/ai-audit-v2-20261018'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/ai-audit-v2-20261018
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Already applied?
        id: done
        run: |
          if [ -f ai-audit-fixes.test.mjs ]; then echo 'already=1' >> "$GITHUB_OUTPUT"; fi
      - name: Overlay and verify tree
        if: steps.done.outputs.already != '1'
        run: |
          set -eu
          [ "$(git rev-parse HEAD~1)" = "$BASE" ] || { echo 'branch moved'; exit 1; }
          curl -fsSL --retry 3 -L "$PKG_URL" -o /tmp/pkg.tgz
          echo "$PKG_SHA256  /tmp/pkg.tgz" | sha256sum -c -
          mkdir /tmp/pk && tar xzf /tmp/pkg.tgz -C /tmp/pk
          cp -a /tmp/pk/f/. .
          git add -A
          FP=$(git ls-files -s | grep -vF "$WF" | awk '{print $2, $4}' | sha256sum | cut -c1-64)
          [ "$FP" = "$(cat /tmp/pk/fp)" ] || { echo 'tree fingerprint mismatch'; git status --short; exit 1; }
      - name: Checks and tests
        if: steps.done.outputs.already != '1'
        run: |
          set -eu
          npm ci --ignore-scripts
          npm run check:worker-bundle
          cp sw.js /tmp/sw.packaged.js; npm run sw:manifest; cmp sw.js /tmp/sw.packaged.js
          for f in ai-audit-fixes ai-agent-f1 ai-analytics-intelligence ai-analytics-policy ai-analytics-provider ai-chat-history ai-live-stages ai-provider-adapters ai-state-do p06-personal-tutor p21-ai-agent-ui p22-voice-cartesia phase9-m10-observability phase9-m4-context-engine phase9-m5-prompt-registry phase9-m8-response-validation phase9-m9-action-engine phase9-m9-action-ui sky-agent-tools sky-contact sky-core-memory sky-daily-report sky-time-memory sky-web-search voice-agent-client-core voice-agent-core voice-agent voice-cache-storage; do
            echo "::group::$f"; node --test "$f.test.mjs"; echo "::endgroup::"
          done
      - name: Commit and push
        if: steps.done.outputs.already != '1'
        run: |
          set -eu
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -qm 'fix(ai): audit fixes v2 on main 879f36b (quota refund, single clean answer, kill-switches, memory 180-day TTL + clear, no double-saved question, voice lockout, origin allowlist)'
          git push origin HEAD:fix/ai-audit-v2-20261018
