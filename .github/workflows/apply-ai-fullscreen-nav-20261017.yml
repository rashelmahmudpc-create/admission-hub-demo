name: Apply AI fullscreen nav 2026-10-17

# Applies scripts/apply-ai-fullscreen-nav-20261017.py on the feature branch:
# the AI chat screen is full screen again (no bottom dock, no dock padding).
# Patches nav-dock.js, nav-dock.test.mjs, index.html (cache bust), regenerates
# sw.js digests, runs the tests and commits back to the SAME branch.
# It never touches main and never deploys.

on:
  push:
    branches: [fix/ai-fullscreen-nav]
    paths:
      - '.github/workflows/apply-ai-fullscreen-nav-20261017.yml'
      - 'scripts/apply-ai-fullscreen-nav-20261017.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-ai-fullscreen-nav-20261017
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref_name == 'fix/ai-fullscreen-nav'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/ai-fullscreen-nav
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply the AI fullscreen nav patch
        run: |
          set -eu
          python3 scripts/apply-ai-fullscreen-nav-20261017.py
          python3 scripts/apply-ai-fullscreen-nav-20261017.py >/dev/null
          grep -q 'src="nav-dock.js?v=dock-v2-20261017"' index.html
          grep -q "html.ai-chat-open body #navRoot .bottomnav.ahd-host{display:none!important}" nav-dock.js
          node --check nav-dock.js
          git diff --stat
      - name: Install, worker bundle check, refresh the service-worker digests
        run: |
          set -eu
          npm ci
          npm run build:worker
          npm run check:worker-bundle
          npm run sw:manifest
      - name: Nav dock tests (must pass)
        run: node --test --test-concurrency=1 nav-dock.test.mjs a11y-core.test.mjs panel-fullscreen.test.mjs p21-ai-agent-ui.test.mjs dead-handler-guard.test.mjs p15-pwa-offline.test.mjs ai-agent-f1.test.mjs ai-live-stages.test.mjs
      - name: Wider dashboard tests (informational; these fail on main too)
        continue-on-error: true
        run: node --test --test-concurrency=1 p11-dashboard-v2.test.mjs p16-dashboard-single.test.mjs p18-legacy-dashboard-kill.test.mjs
      - name: Commit and push to the feature branch
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nav-dock.js nav-dock.test.mjs index.html sw.js
          if git diff --cached --quiet; then echo 'Nothing to commit (already applied).'; else
            git commit -m 'fix(nav): AI chat stays full screen - no bottom dock there' -m 'Applied by apply-ai-fullscreen-nav-20261017.yml. No deploy.'
            git push origin HEAD:fix/ai-fullscreen-nav
          fi
          npm run check:sw-manifest
