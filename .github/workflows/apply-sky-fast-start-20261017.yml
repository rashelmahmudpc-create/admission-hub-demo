name: Apply Sky fast start 2026-10-17

# Applies scripts/apply-sky-fast-start-20261017.py on the feature branch: the AI
# chat SSE stream opens at once, stages are sent when the work really happens,
# and small talk is answered in-app (sky-smalltalk.js). Regenerates
# worker-bundle.mjs and sw.js, runs the AI tests and commits the result back to
# the SAME branch. It never touches main and never deploys.

on:
  push:
    branches: [feat/sky-fast-start]
    paths:
      - '.github/workflows/apply-sky-fast-start-20261017.yml'
      - 'scripts/apply-sky-fast-start-20261017.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-sky-fast-start-20261017
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref_name == 'feat/sky-fast-start'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/sky-fast-start
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply the fast-start patch
        run: |
          set -eu
          python3 scripts/apply-sky-fast-start-20261017.py
          python3 scripts/apply-sky-fast-start-20261017.py >/dev/null
          grep -q 'function openEarly(' ai-agent.js
          grep -q 'const sentStages = early.sent;' ai-agent.js
          grep -q 'SkySmallTalk.reply(' ai-agent-chat.js
          grep -q 'sky-smalltalk.js?v=st1' index.html
          grep -q "'./sky-smalltalk.js?v=st1'" sw.js
          test -f sky-smalltalk.js
          git diff --stat
      - name: Install, rebuild the Worker bundle and the SW manifest
        run: |
          set -eu
          npm ci --ignore-scripts
          npm run build:worker
          npm run check:worker-bundle
          npm run sw:manifest
      - name: AI tests
        run: |
          set -eu
          for f in pr2-fast-start sky-core-memory phase9-m5-prompt-registry ai-agent-f1 ai-live-stages p30-ai-latency-cache p25-chat-cache phase9-m10-observability phase9-m8-response-validation ai-chat-history phase9-m6-tool-registry p06-personal-tutor phase9-m4-context-engine phase9-m7-memory-engine ai-provider-adapters p26-tier-router p27-history-trim p28-provider-health p31-model-priority honesty-guard i18n-guard account-retirement account-data-isolation p15-pwa-offline p21-ai-agent-ui dead-handler-guard panel-fullscreen sky-onboarding; do
            echo "::group::$f"; node "$f.test.mjs"; echo "::endgroup::"
          done
      - name: Commit and push to the feature branch
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai-agent.js ai-agent-chat.js index.html sw.js worker-bundle.mjs ai-agent-f1.test.mjs phase9-m7-memory-engine.test.mjs p25-chat-cache.test.mjs p27-history-trim.test.mjs
          if git diff --cached --quiet; then echo 'Nothing to commit (already applied).'; else
            git commit -m 'feat(ai): open the chat stream at once, real-time stages, in-app small talk; regenerate worker-bundle.mjs and sw.js' -m 'Applied by apply-sky-fast-start-20261017.yml. No deploy.'
            git push origin HEAD:feat/sky-fast-start
          fi
