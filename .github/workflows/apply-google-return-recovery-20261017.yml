name: Apply Google return recovery 2026-10-17

# Applies scripts/apply-google-return-recovery-20261017.py on the feature branch:
# a Google/Facebook redirect that comes back with empty tab storage (installed
# app, tab handover) is still recognised through the ?ahAuthReturn marker, the
# Firebase pending mark is restored, and an empty result shows [storage-lost]
# instead of a silent Welcome screen. Regenerates the sw.js digests, runs the
# Google/UI tests and commits the result back to the SAME branch. It never
# touches main and never deploys.

on:
  push:
    branches: [fix/google-return-recovery]
    paths:
      - '.github/workflows/apply-google-return-recovery-20261017.yml'
      - 'scripts/apply-google-return-recovery-20261017.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-google-return-recovery-20261017
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref_name == 'fix/google-return-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/google-return-recovery
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply the Google return-recovery patch
        run: |
          set -eu
          python3 scripts/apply-google-return-recovery-20261017.py
          python3 scripts/apply-google-return-recovery-20261017.py >/dev/null
          grep -q "const OAUTH_RETURN_PARAM = 'ahAuthReturn';" account-access.js
          grep -q "if (recovered) restoreFirebasePendingRedirect(googlePending ? GOOGLE_SKY_APP : 'ah-google');" account-access.js
          grep -q "recovered ? 'storage-lost' : ''" account-access.js
          if grep -q "localStorage" account-access.js; then echo 'localStorage must not be used'; exit 1; fi
          node --check account-access.js
          git diff --stat
      - name: Install and refresh the service-worker digests
        run: |
          set -eu
          npm ci
          npm run sw:manifest
      - name: Google and Facebook login tests (must pass)
        run: node --test --test-concurrency=1 google-return-recovery.test.mjs google-redirect-login.test.mjs facebook-login-guard.test.mjs firebase-auth-ui.test.mjs firebase-google-auth.test.mjs
      - name: Wider UI tests (informational; some fail on main too)
        continue-on-error: true
        run: node --test --test-concurrency=1 multimethod-auth-ui.test.mjs native-auth-protection.test.mjs premium-onboarding-ui.test.mjs profile-ui.test.mjs code-native-welcome-v1.test.mjs sky-onboarding.test.mjs
      - name: Commit and push to the feature branch
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add account-access.js sw.js google-redirect-login.test.mjs native-auth-protection.test.mjs
          if git diff --cached --quiet; then echo 'Nothing to commit (already applied).'; else
            git commit -m 'fix(google): finish the redirect sign-in even when tab storage is lost on the way back (URL marker + Firebase pending mark), show [storage-lost] instead of a silent Welcome' -m 'Applied by apply-google-return-recovery-20261017.yml. No deploy.'
            git push origin HEAD:fix/google-return-recovery
          fi
          npm run check:sw-manifest
