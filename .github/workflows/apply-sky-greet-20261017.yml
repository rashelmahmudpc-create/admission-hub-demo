name: Apply Sky greeting replies 2026-10-17

# Owner's 20 greeting replies -> sky-smalltalk.js. Regenerates sw.js (and checks the
# worker bundle), runs the AI tests and commits back to the SAME branch. Never deploys.

on:
  push:
    branches: [feat/sky-clear-cached-answers]
    paths:
      - '.github/workflows/apply-sky-greet-20261017.yml'
      - 'scripts/apply-sky-greet-20261017.py'
      - 'scripts/data/sky-greet-20261017.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-sky-greet-20261017
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref_name == 'feat/sky-clear-cached-answers'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/sky-clear-cached-answers
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply the greetings
        run: |
          set -eu
          python3 scripts/apply-sky-greet-20261017.py
          python3 scripts/apply-sky-greet-20261017.py >/dev/null
          node --check sky-smalltalk.js
          git diff --stat
      - name: Install, check the Worker bundle, rebuild the SW manifest
        run: |
          set -eu
          npm ci --ignore-scripts
          npm run build:worker
          npm run check:worker-bundle
          npm run sw:manifest
      - name: AI tests
        run: |
          set -eu
          for f in pr2-fast-start pr3-shared-answers sky-core-memory phase9-m5-prompt-registry ai-agent-f1 ai-live-stages p30-ai-latency-cache p25-chat-cache ai-chat-history p06-personal-tutor honesty-guard i18n-guard p15-pwa-offline p21-ai-agent-ui dead-handler-guard panel-fullscreen sky-onboarding; do
            echo "::group::$f"; node "$f.test.mjs"; echo "::endgroup::"
          done
      - name: Commit and push to the feature branch
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sky-smalltalk.js pr2-fast-start.test.mjs sw.js worker-bundle.mjs
          if git diff --cached --quiet; then echo 'Nothing to commit (already applied).'; else
            git commit -m "feat(ai): owner's 20 greeting replies in sky-smalltalk.js; regenerate sw.js" -m 'Applied by apply-sky-greet-20261017.yml. No deploy.'
            git push origin HEAD:feat/sky-clear-cached-answers
          fi
