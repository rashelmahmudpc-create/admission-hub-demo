name: Apply Sky reply bank r1 2026-10-17

# Owner 2026-10-17: the owner's 3 Drive files (179 kinds, 896 replies) -> sky-replies.json,
# phone number / email removed from every reply; support replies get two buttons that open
# /api/go/whatsapp and /api/go/email (sky-contact.mjs reads PUB_KV 'sky:contact').
# The prepared change set is a tarball checked by SHA-256 before use. It is applied only if
# none of its files changed since base de23a4a. Rebuilds the worker bundle + sw.js, runs the
# AI tests and commits back to the SAME branch. Never deploys.

on:
  push:
    branches: [feat/sky-clear-cached-answers]
    paths:
      - '.github/workflows/apply-sky-replies-r1-20261017.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-sky-replies-r1-20261017
  cancel-in-progress: false

env:
  PKG_URL: https://backend.composio.dev/api/v3/sl/MoCsrFuhaI
  PKG_SHA256: b18ffe30a28863e29389d1151af600615679c25b7314bd25da4d83c162998a08
  BASE: de23a4a642468ea457eb09e1aa1f1e26c39065eb
  FILES: ai-agent-chat.js sky-smalltalk.js index.html sw.js gk-agent-worker.js worker-bundle.mjs pr2-fast-start.test.mjs pr3-shared-answers.test.mjs sky-replies.json sky-contact.mjs sky-contact.test.mjs

jobs:
  apply:
    if: github.ref_name == 'feat/sky-clear-cached-answers'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/sky-clear-cached-answers
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Already applied?
        id: done
        run: |
          if [ -f sky-replies.json ] && [ -f sky-contact.mjs ]; then echo 'already=1' >> "$GITHUB_OUTPUT"; echo 'Already applied.'; fi
      - name: Download, verify and unpack the change set
        if: steps.done.outputs.already != '1'
        run: |
          set -eu
          git diff --quiet "$BASE" HEAD -- $FILES || { echo 'Target files changed since base; refusing to overwrite.'; exit 1; }
          curl -fsSL --retry 3 "$PKG_URL" -o /tmp/pkg.tgz
          echo "$PKG_SHA256  /tmp/pkg.tgz" | sha256sum -c -
          tar tzf /tmp/pkg.tgz | sort > /tmp/list.txt
          printf '%s\n' $FILES | sort > /tmp/want.txt
          diff /tmp/list.txt /tmp/want.txt
          tar xzf /tmp/pkg.tgz
          node --check sky-smalltalk.js && node --check ai-agent-chat.js && node --check gk-agent-worker.js
          node -e "JSON.parse(require('fs').readFileSync('sky-replies.json','utf8'))"
          if grep -REn '01[3-9][0-9]{8}|inflowsky|@gmail\.com' sky-replies.json sky-smalltalk.js ai-agent-chat.js sky-contact.mjs; then echo 'contact leaked'; exit 1; fi
          git status --short
      - name: Install, check the Worker bundle and the SW manifest
        if: steps.done.outputs.already != '1'
        run: |
          set -eu
          npm ci --ignore-scripts
          npm run check:worker-bundle
          npm run check:sw-manifest
      - name: AI tests
        if: steps.done.outputs.already != '1'
        run: |
          set -eu
          for f in pr2-fast-start pr3-shared-answers sky-contact sky-core-memory phase9-m5-prompt-registry ai-agent-f1 ai-live-stages p30-ai-latency-cache p25-chat-cache ai-chat-history p06-personal-tutor honesty-guard i18n-guard p15-pwa-offline p21-ai-agent-ui dead-handler-guard panel-fullscreen sky-onboarding seo-routing; do
            echo "::group::$f"; node "$f.test.mjs"; echo "::endgroup::"
          done
      - name: Commit and push to the feature branch
        if: steps.done.outputs.already != '1'
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $FILES
          git commit -m "feat(ai): owner's Sky reply bank (179 kinds, 896 replies) + WhatsApp/email buttons via /api/go/*" -m 'Applied by apply-sky-replies-r1-20261017.yml. Phone number and email are not in the repo; they live in PUB_KV sky:contact. No deploy.'
          git push origin HEAD:feat/sky-clear-cached-answers
