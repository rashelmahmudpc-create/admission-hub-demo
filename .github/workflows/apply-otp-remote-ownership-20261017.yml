name: Apply OTP remote ownership 2026-10-17

# Applies scripts/apply-otp-remote-ownership-20261017.py on the feature branch:
# Logto/Appwrite/Ory/Hanko codes prove email ownership (no more "already used"),
# operator priority decides the slot order (Brevo before Logto on Gmail), and an
# admin save keeps each slot's timeoutMs. Regenerates worker-bundle.mjs, runs the
# verification tests and commits the result back to the SAME branch. It never
# touches main and never deploys: merge the PR and run deploy-pages-worker.yml.

on:
  push:
    branches: [feat/otp-remote-ownership]
    paths:
      - '.github/workflows/apply-otp-remote-ownership-20261017.yml'
      - 'scripts/apply-otp-remote-ownership-20261017.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-otp-remote-ownership-20261017
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref_name == 'feat/otp-remote-ownership'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/otp-remote-ownership
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply the OTP remote ownership patch
        run: |
          set -eu
          python3 scripts/apply-otp-remote-ownership-20261017.py
          python3 scripts/apply-otp-remote-ownership-20261017.py >/dev/null
          grep -q "emailOwnershipProven: true, emailVerified: false" auth-native/verification/sqlite-verification-repository.mjs
          grep -q "emailOwnershipProven: true, emailVerified: false" auth-native/verification/memory-verification-repository.mjs
          grep -q "function mergeRuntimeConfig(input, current)" auth-native/verification/orchestrator.mjs
          grep -q "health: failurePenalty + latencyPenalty" auth-native/verification/orchestrator.mjs
          grep -q "adminVerificationConfigInput(body.config)" auth-native/worker/public-auth-handler.mjs
          git diff --stat
      - name: Install and rebuild the Worker bundle
        run: |
          set -eu
          npm ci
          npm run build:worker
          npm run check:worker-bundle
      - name: Verification tests
        run: node --test --test-concurrency=1 verification-providers.test.mjs verification-orchestrator.test.mjs compact-auth-config.test.mjs free-tier-failover.test.mjs backup-public-handler.test.mjs email-branding.test.mjs sqlite-auth-runtime.test.mjs verification-admin.test.mjs
      - name: Commit and push to the feature branch
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add auth-native/verification/orchestrator.mjs auth-native/verification/sqlite-verification-repository.mjs auth-native/verification/memory-verification-repository.mjs auth-native/worker/public-auth-handler.mjs verification-orchestrator.test.mjs sqlite-auth-runtime.test.mjs worker-bundle.mjs
          if git diff --cached --quiet; then echo 'Nothing to commit (already applied).'; else
            git commit -m 'fix(otp): provider-evidence codes prove email ownership, priority-first slot order, admin save keeps timeouts, regenerate worker-bundle.mjs' -m 'Applied by apply-otp-remote-ownership-20261017.yml. No deploy.'
            git push origin HEAD:feat/otp-remote-ownership
          fi
