name: Apply Question Bank cache fix 2026-10-16

# The bank script is served under the `/*.js?v=*` rule (immutable, max-age=1y),
# so the accessor fix and its ?v=qbc2 URL must be published as new bytes. This
# workflow only builds the sanitized frontend bundle and deploys Pages; the
# Worker, database and secrets are untouched.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-qbank-cache-fix-20261016.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admission-hub-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Confirm the fix is present in the published sources
        run: |
          set -eu
          grep -q "typeof CACHE!=='undefined'" question-bank-clean.js
          grep -q 'question-bank-clean.js?v=qbc2' index.html
          node --check question-bank-clean.js
          npm run check:sw-manifest
      - name: Build sanitized frontend bundle
        run: |
          set -eu
          rm -rf dist && mkdir -p dist
          rsync -a --exclude='.git' --exclude='node_modules' --exclude='dist' --exclude='docs' --exclude='AGENT_RESUME' --exclude='ai-proxy' --exclude='auth' --exclude='auth-native' --exclude='email-gateway' --exclude='apps-script' --exclude='uploads' --exclude='.github' --exclude='gk-agent-worker.js' --exclude='public-worker.js' --exclude='ai-agent.js' --exclude='worker-bundle.mjs' --exclude='voice-worker.js' --exclude='notification-worker.js' --exclude='fcm-notification.mjs' --exclude='wrangler.toml' --exclude='package.json' --exclude='package-lock.json' --exclude='*.test.mjs' --exclude='*.md' ./ dist/
          GITHUB_SHA="$(git rev-parse HEAD)" node scripts/build-welcome-pages.mjs dist
          test -s dist/index.html
          test -s dist/question-bank-clean.js
          grep -q "typeof CACHE!=='undefined'" dist/question-bank-clean.js
          grep -q 'question-bank-clean.js?v=qbc2' dist/index.html
      - name: Deploy admissionsky
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.35.0 pages deploy dist --project-name admissionsky --branch main --commit-hash "$(git rev-parse HEAD)" --commit-dirty=true
      - name: Deploy admissionhub (same bytes)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.35.0 pages deploy dist --project-name admissionhub --branch main --commit-hash "$(git rev-parse HEAD)" --commit-dirty=true
      - name: Verify live
        run: |
          sleep 20
          curl -fsS -H 'Cache-Control: no-cache' 'https://admissionsky.pages.dev/' | grep -Fq 'question-bank-clean.js?v=qbc2'
          curl -fsS -H 'Cache-Control: no-cache' 'https://admissionsky.pages.dev/question-bank-clean.js?v=qbc2' | grep -Fq "typeof CACHE!=='undefined'"
