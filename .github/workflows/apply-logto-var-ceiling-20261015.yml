name: Apply Logto var-ceiling fix 2026-10-15

# Owner-approved 2026-10-15. Deploy run 38799460899 failed with Cloudflare code
# 10055: the four otp-h vars (LOGTO_ENDPOINT, LOGTO_APP_ID, LOGTO_REDIRECT_URI,
# OTP_H_DAILY_QUOTA) pushed the Worker to 68 of the 64-variable free ceiling.
# This moves those public values into providers.mjs (used only when otp-h is
# enabled in VERIFICATION_ORCHESTRATOR_CONFIG), drops them from wrangler.toml,
# adds tests, regenerates worker-bundle.mjs and commits. Deploy stays manual.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-logto-var-ceiling-20261015.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-logto-var-ceiling-20261015
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply the owner-approved patch
        run: |
          set -eu
          if grep -q "LOGTO_PUBLIC_DEFAULTS" auth-native/verification/providers.mjs; then echo 'Patch already applied.'; else
            echo '' | base64 -d | gunzip > /tmp/fix.patch
            git apply --whitespace=nowarn /tmp/fix.patch
          fi
          ! grep -qE '^(LOGTO_ENDPOINT|LOGTO_APP_ID|LOGTO_REDIRECT_URI|OTP_H_DAILY_QUOTA) *=' wrangler.toml
      - name: Install and rebuild the Worker bundle
        run: |
          set -eu
          npm ci
          npm run build:worker
          npm run check:worker-bundle
      - name: Verification tests
        run: node --test --test-concurrency=1 verification-providers.test.mjs verification-orchestrator.test.mjs free-tier-failover.test.mjs native-auth.test.mjs
      - name: Commit and push
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git restore --source=HEAD --staged --worktree -- .github/workflows
          git add -A
          if git diff --cached --quiet; then echo 'Nothing to commit (already applied).'; else
            git commit -m 'fix(otp): keep otp-h Logto public values in code to stay under the 64-var Workers Free ceiling' -m 'Deploy 38799460899 failed with code 10055 (68 > 64 variables). Logto endpoint/app id/redirect now default in providers.mjs only when otp-h is enabled in VERIFICATION_ORCHESTRATOR_CONFIG (quota from that row); the four vars are removed from wrangler.toml. Tests added. Applied by apply-logto-var-ceiling-20261015.yml; worker-bundle.mjs regenerated.'
            ok=0; for i in 1 2 3; do if git push origin HEAD:main; then ok=1; break; fi; git pull --rebase origin main; done
            test "$ok" = 1
          fi
