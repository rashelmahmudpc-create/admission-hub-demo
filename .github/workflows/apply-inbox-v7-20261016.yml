name: Apply Inbox v7 2026-10-16

# Owner-approved 2026-10-16: replace the old notification inbox with the new
# Inbox UI (chat/groups/notice/notification tabs on top, no bottom nav, dark
# default + light theme via AhAppearance) and add the notice save + read-all
# backend. The patch is verified by SHA-256 before it is applied.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-inbox-v7-20261016.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-inbox-v7-20261016
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Download and verify patch
        run: |
          set -eu
          curl -fsSL -o /tmp/inbox-v7.patch 'https://backend.composio.dev/api/v3/sl/25L_ynYub5'
          echo 'b4a06dfde7f4ee9139d6089d849d270bc61972189f6480dd576afa3522b477c5  /tmp/inbox-v7.patch' | sha256sum -c -
      - name: Apply source changes
        run: |
          set -eu
          if grep -q 'notif-inbox-v7' index.html; then echo 'Already applied.'; exit 0; fi
          git apply --3way /tmp/inbox-v7.patch
      - name: Syntax check
        run: |
          node --check notification-inbox.js
          node -e "import('./fcm-notification.mjs').then(()=>console.log('ok'))"
      - name: Rebuild Worker bundle and service-worker digests
        run: |
          npm run build:worker
          npm run sw:manifest
      - name: Regression tests
        run: node --test --test-concurrency=1 fcm-global.test.mjs fcm-notification.test.mjs notification-sw-routing.test.mjs honesty-guard.test.mjs i18n-guard.test.mjs theme-coverage-scan.test.mjs
      - name: Commit and push
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git restore --source=HEAD --staged --worktree -- .github/workflows
          git add -A
          if git diff --cached --quiet; then echo 'Nothing to commit (already applied).'; exit 0; fi
          git commit -m 'feat(inbox): new Inbox UI v7 - chat/groups/notice/notification tabs on top, no bottom nav, dark default + light theme; notice save + read-all backend' -m 'Owner-approved 2026-10-16. notification-inbox.js rewritten from the owner Inbox prototype; fcm-notification.mjs adds notice_saves, /api/notifications/save, /api/notifications/read-all and kind/savedAt on the inbox feed. worker-bundle.mjs and sw.js regenerated.'
          for i in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1
