name: Apply Sky keyboard layout v11 (2026-10-18)

# Owner screenshots IMG_6945-6948: with the keyboard up a big empty band sat between the Next button
# and the keyboard, and on the GPA screen the bottom third stayed empty after the keyboard closed.
# Runs scripts/apply-sky-kb-layout-20261018.py (sky-onboarding.{css,js} + cache tokens), regenerates
# the SW digests, runs the onboarding tests and commits to this branch only.

on:
  push:
    branches: [fix/sky-kb-layout-20261018]
    paths: ['.github/workflows/apply-sky-kb-layout-20261018.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.ref_name == 'fix/sky-kb-layout-20261018'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/sky-kb-layout-20261018
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Already applied?
        id: done
        run: |
          if grep -q 'kbroomy' sky-onboarding.js; then echo 'already=1' >> "$GITHUB_OUTPUT"; fi
      - name: Apply
        if: steps.done.outputs.already != '1'
        run: |
          set -eu
          python3 scripts/apply-sky-kb-layout-20261018.py
          npm ci --ignore-scripts
          npm run sw:manifest
          node --check sky-onboarding.js
          git diff --stat
      - name: Tests
        if: steps.done.outputs.already != '1'
        run: |
          set -eu
          node --test sky-onboarding.test.mjs p19-perf-budget.test.mjs
      - name: Commit and push
        if: steps.done.outputs.already != '1'
        run: |
          set -eu
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -qm 'fix(onboarding): keyboard layout v11 - roomy bird, Next above the keyboard, no +140px page, no stale keyboard height; tokens + SW digests'
          git push origin HEAD:fix/sky-kb-layout-20261018
