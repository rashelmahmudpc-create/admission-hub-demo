name: Apply Telegram legacy-hide 2026-10-18

# Hides the native fallback Telegram anchor that appeared above the Welcome
# Story. Refreshes sw.js digests and commits back to the SAME branch. Never
# touches main and never deploys.

on:
  push:
    branches: [fix/telegram-legacy-hide]
    paths:
      - '.github/workflows/apply-telegram-legacy-hide-20261018.yml'
      - 'scripts/apply-telegram-legacy-hide-20261018.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.ref_name == 'fix/telegram-legacy-hide'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/telegram-legacy-hide
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply
        run: |
          set -eu
          python3 scripts/apply-telegram-legacy-hide-20261018.py
          python3 scripts/apply-telegram-legacy-hide-20261018.py >/dev/null
          node --check account-access.js
          grep -q 'telegramHost.hidden = true;' account-access.js
          git diff --stat
      - name: Refresh service-worker digests
        run: |
          set -eu
          npm ci
          npm run sw:manifest
      - name: Telegram login tests (must pass)
        run: node --test --test-concurrency=1 telegram-login.test.mjs
      - name: Commit and push to the feature branch
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          if git diff --cached --quiet; then echo 'Nothing to commit.'; else
            git commit -m 'fix(auth): native Telegram anchor never shows above the Welcome Story' -m 'Applied by apply-telegram-legacy-hide-20261018.yml. No deploy.'
            git push origin HEAD:fix/telegram-legacy-hide
          fi
          npm run check:sw-manifest
