name: AI provider health probe (manual, read-only)

# Answers "how many provider keys actually work?". Reads the provider keys the
# Worker uses (KV `secret:AI_KEYS` + `secret:<NAME>`) and sends each a minimal
# 1-token request to its real endpoint, printing ONLY the HTTP status per
# provider/key. No key value and no response body is ever printed. This mirrors
# exactly what the running Worker does; it changes nothing.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type PROBE to send a 1-token test request to each provider
        required: true
        type: string

permissions:
  contents: read

jobs:
  probe:
    if: ${{ inputs.confirmation == 'PROBE' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe every configured provider key (statuses only)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_ENV: ${{ secrets.GEMINI_API_KEY }}
          NS: b9353515b098427687afcfb8654ed359
        run: |
          set -eu
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/${CF_ACCT}/storage/kv/namespaces/${NS}/values/secret:AI_KEYS" \
            -H "Authorization: Bearer ${CF_TOKEN}" -o /tmp/aikeys.json
          cat > /tmp/probe.mjs <<'NODE'
          import fs from 'node:fs';
          const kv = JSON.parse(fs.readFileSync('/tmp/aikeys.json','utf8'));
          const gem = String(kv.GEMINI_KEYS||kv.GEMINI_API_KEYS||process.env.GEMINI_ENV||'').split(',').map(s=>s.trim()).filter(Boolean);
          const compat = [
            ['OPENROUTER', kv.OPENROUTER_API_KEYS, 'https://openrouter.ai/api/v1/chat/completions', 'openai/gpt-4o-mini'],
            ['VERCEL', kv.VERCEL_AI_GATEWAY_KEY, 'https://ai-gateway.vercel.sh/v1/chat/completions', 'openai/gpt-4o-mini'],
            ['MISTRAL', kv.MISTRAL_API_KEYS, 'https://api.mistral.ai/v1/chat/completions', 'ministral-14b-latest'],
            ['CEREBRAS', kv.CEREBRAS_API_KEYS, 'https://api.cerebras.ai/v1/chat/completions', 'llama-3.3-70b'],
            ['SAMBANOVA', kv.SAMBANOVA_API_KEYS, 'https://api.sambanova.ai/v1/chat/completions', 'Meta-Llama-3.3-70B-Instruct'],
            ['COHERE', kv.COHERE_API_KEYS, 'https://api.cohere.ai/compatibility/v1/chat/completions', 'command-r7b-12-2024'],
            ['HUGGINGFACE', kv.HUGGINGFACE_API_KEYS, 'https://router.huggingface.co/v1/chat/completions', 'meta-llama/Llama-3.3-70B-Instruct'],
            ['DEEPINFRA', kv.DEEPINFRA_API_KEYS, 'https://api.deepinfra.com/v1/openai/chat/completions', 'meta-llama/Meta-Llama-3.1-70B-Instruct'],
            ['TOGETHER', kv.TOGETHER_API_KEYS, 'https://api.together.xyz/v1/chat/completions', 'meta-llama/Llama-3.3-70B-Instruct-Turbo'],
            ['KIMI', kv.KIMI_API_KEYS, 'https://api.moonshot.ai/v1/chat/completions', 'moonshot-v1-8k'],
            ['AIML', kv.AIML_API_KEYS, 'https://api.aimlapi.com/v1/chat/completions', 'gpt-4o-mini'],
            ['LLM7', kv.LLM7_API_KEYS, 'https://api.llm7.io/v1/chat/completions', 'gpt-4o-mini'],
            ['SILICONFLOW', kv.SILICONFLOW_API_KEYS, 'https://api.siliconflow.cn/v1/chat/completions', 'Qwen/Qwen2.5-7B-Instruct'],
            ['STEPFUN', kv.STEPFUN_API_KEYS, 'https://api.stepfun.ai/v1/chat/completions', 'step-1-8k'],
            ['MINIMAX', kv.MINIMAX_API_KEYS, 'https://api.minimax.chat/v1/text/chatcompletion_v2', 'abab6.5s-chat'],
          ];
          async function statusOf(url, key, model) {
            try {
              const r = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
                body: JSON.stringify({ model, messages:[{role:'user',content:'hi'}], max_tokens:16 }), signal: AbortSignal.timeout(20000) });
              return r.status;
            } catch (e) { return 'ERR:'+(e.name||e.message).slice(0,20); }
          }
          async function gemStatus(key) {
            try {
              const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite:generateContent?key='+encodeURIComponent(key),
                { method:'POST', headers:{'Content-Type':'application/json'},
                  body: JSON.stringify({ contents:[{ parts:[{ text:'hi' }] }] }), signal: AbortSignal.timeout(20000) });
              let reason='';
              if (r.status !== 200) {
                try { const j=await r.json(); const e=j.error||{}; reason=(e.status||'')+' / '+(e.message||'').replace(/\s+/g,' ').slice(0,120); } catch (_) {}
              }
              return { s:r.status, r:reason };
            } catch (e) { return { s:'ERR:'+(e.name||e.message).slice(0,20), r:'' }; }
          }
          let ok=0, total=0;
          console.log('== Gemini key pool (model gemini-3.1-flash-lite) ==');
          console.log('keys found:', gem.length, '(source:', (kv.GEMINI_KEYS?'GEMINI_KEYS':(kv.GEMINI_API_KEYS?'GEMINI_API_KEYS':'env')), ')');
          const gemStatuses = await Promise.all(gem.map(gemStatus));
          gemStatuses.forEach((g,i)=>{total++; if(g.s===200)ok++; console.log('  key'+(i+1)+':', g.s, g.r?('| '+g.r):'');});
          console.log('== OpenAI-compatible providers (1 key each) ==');
          for (const [name,k,url,model] of compat) {
            const key = String(k||'').split(',')[0].trim();
            if(!key){ console.log('  '+name+': no key'); continue; }
            const ov = String(kv[name+'_API_KEYS_MODELS']||'').split(',').map(s=>s.trim()).filter(Boolean);
            const s = await statusOf(url, key, ov.length ? ov[0] : model);
            total++; if(s===200)ok++;
            console.log('  '+name+':', s);
          }
          console.log('== Groq + Cloudflare (special adapters) ==');
          try {
            const gk = await fetch('https://api.cloudflare.com/client/v4/accounts/'+process.env.CF_ACCT+'/storage/kv/namespaces/'+process.env.NS+'/values/secret:GROQ_API_KEY',
              { headers:{ 'Authorization':'Bearer '+process.env.CF_TOKEN } });
            const gkey = (await gk.text()).trim();
            if (gkey) {
              const s = await statusOf('https://api.groq.com/openai/v1/chat/completions', gkey, 'openai/gpt-oss-120b');
              total++; if(s===200)ok++;
              console.log('  GROQ (gpt-oss-120b):', s);
            } else console.log('  GROQ: no key');
          } catch(e) { console.log('  GROQ: read err', String(e).slice(0,40)); }
          console.log('== TOTAL: '+ok+' of '+total+' keys answered 200 ==');
          NODE
          sed -i 's/^          //' /tmp/probe.mjs
          node /tmp/probe.mjs
