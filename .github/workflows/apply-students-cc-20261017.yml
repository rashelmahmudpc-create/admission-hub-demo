name: Apply Students Control Center 2026-10-17

# Fresh Start phase 3. Downloads the reviewed source patch (sha256-pinned below),
# applies it, rebuilds the generated worker-bundle.mjs, runs the tests and commits
# everything back to THIS branch. Never touches main, never deploys.
# Patch: student-directory.mjs (new), student-directory.test.mjs (new),
# auth-authority-do.mjs, public-auth-handler.mjs, verification-control-center.html,
# _headers (CSP hashes), package.json (test list), docs/fresh-start-plan.md.

on:
  push:
    branches: [feat/students-control-center]
    paths:
      - '.github/workflows/apply-students-cc-20261017.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-students-cc-20261017
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref_name == 'feat/students-control-center'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/students-control-center
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Download and apply the phase 3 patch (sha256 pinned)
        run: |
          set -eu
          if grep -q "admin/students/summary" auth-native/worker/public-auth-handler.mjs; then echo 'Already applied.'; exit 0; fi
          curl -fsSL https://backend.composio.dev/api/v3/sl/7f8xOjff5q -o /tmp/phase3.patch
          echo '68030600ab92ef3c0d383fc8f84d317b29bbbcfa2be0d4ba27dd762a484df46d  /tmp/phase3.patch' | sha256sum -c -
          git apply --index /tmp/phase3.patch
          git diff --cached --stat
      - name: Install and rebuild the Worker bundle
        run: |
          set -eu
          npm ci
          node --check auth-native/storage/student-directory.mjs
          node --check auth-native/worker/auth-authority-do.mjs
          node --check auth-native/worker/public-auth-handler.mjs
          npm run build:worker
          npm run check:worker-bundle
          grep -q "admin/students/summary" worker-bundle.mjs
      - name: Students + schema + auth tests (must pass)
        run: node --test --test-concurrency=1 student-directory.test.mjs student-directory-schema.test.mjs verification-admin.test.mjs sqlite-auth-runtime.test.mjs native-auth.test.mjs verification-orchestrator.test.mjs firebase-google-auth.test.mjs google-login-completion.test.mjs seo-routing.test.mjs
      - name: Auth protection guard (must pass; one shell-literal test skipped, it fails on main too)
        run: node --test --test-concurrency=1 --test-skip-pattern="release guard literals still match the shipped shell" native-auth-protection.test.mjs
      - name: Commit and push to the feature branch
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add auth-native/storage/student-directory.mjs student-directory.test.mjs auth-native/worker/auth-authority-do.mjs auth-native/worker/public-auth-handler.mjs verification-control-center.html _headers package.json docs/fresh-start-plan.md worker-bundle.mjs
          if git diff --cached --quiet; then echo 'Nothing to commit (already applied).'; else
            git commit -m 'feat(control-center): Students section + student directory writes (Fresh Start phase 3)' -m 'Admin-token-only list/search/profile/timeline, noindex, no secrets. Best-effort directory writes after each auth step. Worker bundle rebuilt. Applied by apply-students-cc-20261017.yml. No deploy.'
            git push origin HEAD:feat/students-control-center
          fi
          npm run check:worker-bundle
