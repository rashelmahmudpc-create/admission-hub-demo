name: Apply Students Control Center 2026-10-17

# Fresh Start phase 3. Downloads the reviewed change bundle (pinned by sha256),
# adds the new files, applies the patch to existing files, rebuilds
# worker-bundle.mjs and sw.js digests, runs the tests and commits back to THIS
# branch. Never touches main and never deploys.

on:
  push:
    branches: [feat/students-control-center]
    paths:
      - '.github/workflows/apply-students-cc-20261017.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-students-cc-20261017
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref_name == 'feat/students-control-center'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/students-control-center
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Download and verify the change bundle
        run: |
          set -eu
          curl -fsSL https://backend.composio.dev/api/v3/sl/uJA30EXnNq -o /tmp/phase3.tgz
          echo '3f5c3289d1f0a7d8f70ec6d161b36ef48603ce6c6bcb735260896fab85b20f6a  /tmp/phase3.tgz' | sha256sum -c -
          mkdir -p /tmp/p3 && tar xzf /tmp/phase3.tgz -C /tmp/p3
      - name: Apply (idempotent)
        run: |
          set -eu
          if grep -q "internal/admin/students/list" auth-native/worker/auth-authority-do.mjs; then echo 'already applied'; else git apply --whitespace=nowarn /tmp/p3/phase3.patch; fi
          cp /tmp/p3/auth-native/storage/student-admin-view.mjs auth-native/storage/student-admin-view.mjs
          cp /tmp/p3/student-admin-view.test.mjs student-admin-view.test.mjs
          cp /tmp/p3/students-control-center.html students-control-center.html
          ! grep -q "console\." auth-native/worker/auth-authority-do.mjs auth-native/storage/student-admin-view.mjs
          node --check auth-native/worker/auth-authority-do.mjs
          node --check auth-native/worker/public-auth-handler.mjs
          git status --short
      - name: Install, rebuild the Worker bundle and sw.js digests
        run: |
          set -eu
          npm ci
          npm run build:worker
          npm run check:worker-bundle
          grep -q "internal/admin/students/list" worker-bundle.mjs
          npm run sw:manifest
      - name: Students + schema + auth storage tests (must pass)
        run: node --test --test-concurrency=1 student-admin-view.test.mjs student-directory-schema.test.mjs sqlite-auth-runtime.test.mjs native-auth.test.mjs verification-orchestrator.test.mjs verification-admin.test.mjs security-history-admin.test.mjs
      - name: Auth protection guard (must pass; one shell-literal test skipped, it fails on main too)
        run: node --test --test-concurrency=1 --test-skip-pattern="release guard literals still match the shipped shell" native-auth-protection.test.mjs
      - name: Commit and push to the feature branch
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add auth-native/storage/student-admin-view.mjs student-admin-view.test.mjs students-control-center.html auth-native/worker/auth-authority-do.mjs auth-native/worker/public-auth-handler.mjs sw.js _headers robots.txt package.json docs/fresh-start-plan.md worker-bundle.mjs
          if git diff --cached --quiet; then echo 'Nothing to commit (already applied).'; else
            git commit -m 'feat(admin): Students in the Control Center - read-only list, search and private profile (Fresh Start phase 3)' -m 'Applied by apply-students-cc-20261017.yml. No deploy.'
            git push origin HEAD:feat/students-control-center
          fi
          npm run check:worker-bundle
