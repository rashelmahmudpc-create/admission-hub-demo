name: Apply Sky custom instructions (2026-10-18)

# Owner plan step 3: a student writes one short note ("সবসময় উদাহরণ দিয়ে
# বোঝাবে") and Sky follows it on every answer. sky-instructions.mjs checks it
# (harmful / cheating / rule-breaking / PII refused) on save and on every read;
# the prompt block ranks it below every safety/study rule. Saved in PUB_KV
# aiinstr:<uid>; /api/ai/instructions GET/POST; chat command "নির্দেশনা: …";
# profile AI Personalization textarea. Cache bypassed when a note exists.
# Kill switch PUB_KV sky:instructions = off. skyv11 -> skyv12, profile-v20.
# Commits to this branch only. Never touches main, never deploys.

on:
  push:
    branches: [feat/sky-instructions-20261018]
    paths: ['.github/workflows/apply-sky-instructions-20261018.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  PKG_URL: https://litter.catbox.moe/4lvwko.tgz
  PKG_SHA256: 658357ca5523cdeb10fb86b99f82bc9aaf1547a326ab5a19507044a769fa85ba
  BASE: 260cb05650f94a9cfaa2dc0316495bfa32fa5035

jobs:
  apply:
    if: github.ref_name == 'feat/sky-instructions-20261018'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/sky-instructions-20261018
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Already applied?
        id: done
        run: |
          if [ -f sky-instructions.mjs ]; then echo 'already=1' >> "$GITHUB_OUTPUT"; fi
      - name: Overlay
        if: steps.done.outputs.already != '1'
        run: |
          set -eu
          git diff --quiet "$BASE" HEAD -- account-retirement.test.mjs ai-agent-chat.js ai-agent.js index.html notif-sheet.test.mjs p11-dashboard-v2.test.mjs p21-ai-agent-ui.test.mjs profile-ui.js profile-ui.test.mjs public-worker.js startup-ai-regression.test.mjs sw.js worker-bundle.mjs || { echo 'patched files changed since BASE'; exit 1; }
          curl -fsSL --retry 3 -L "$PKG_URL" -o /tmp/pkg.tgz
          echo "$PKG_SHA256  /tmp/pkg.tgz" | sha256sum -c -
          mkdir /tmp/pk && tar xzf /tmp/pkg.tgz -C /tmp/pk
          cp -a /tmp/pk/f/. .
          git add -A
          git diff --cached --stat
      - name: Checks and tests
        if: steps.done.outputs.already != '1'
        run: |
          set -eu
          npm ci --ignore-scripts
          npm run check:worker-bundle
          cp sw.js /tmp/sw.packaged.js; npm run sw:manifest; cmp sw.js /tmp/sw.packaged.js
          for f in sky-instructions sky-recall sky-memory-weak-recall p21-ai-agent-ui ai-audit-fixes ai-agent-f1 ai-chat-history ai-live-stages ai-provider-adapters p06-personal-tutor p25-chat-cache p27-history-trim phase9-m10-observability phase9-m4-context-engine phase9-m5-prompt-registry phase9-m8-response-validation phase9-m9-action-ui pr3-shared-answers p30-ai-latency-cache pr2-fast-start sky-agent-tools sky-contact sky-core-memory sky-daily-report sky-time-memory sky-web-search sky-onboarding otp-alert voice-agent-client-core voice-agent; do
            echo "::group::$f"; node --test "$f.test.mjs"; echo "::endgroup::"
          done
      - name: Commit and push
        if: steps.done.outputs.already != '1'
        run: |
          set -eu
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -qm 'feat(ai): Sky custom instructions - the student writes one short note, Sky follows it on every answer; harmful/cheating/rule-breaking/PII notes refused; /api/ai/instructions, chat command, profile box'
          git push origin HEAD:feat/sky-instructions-20261018
