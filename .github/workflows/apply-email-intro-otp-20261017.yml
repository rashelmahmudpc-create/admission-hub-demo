name: Apply email intro OTP 2026-10-17

# Fresh Start phase 1: the email-intro-continue button runs the OTP chain
# (beginEmailOwnership) when the server publishes emailOwnership; the Firebase
# link stays the Worker's last resort. Regenerates sw.js digests, runs the UI
# tests against the unpatched baseline (fails only on NEW failures) and commits
# back to the SAME branch. Never touches main, never deploys.

on:
  push:
    branches: [fix/email-intro-otp]
    paths:
      - '.github/workflows/apply-email-intro-otp-20261017.yml'
      - 'scripts/apply-email-intro-otp-20261017.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-email-intro-otp-20261017
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref_name == 'fix/email-intro-otp'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/email-intro-otp
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Baseline UI tests (before the patch)
        run: |
          set +e
          node --test --test-concurrency=1 --test-reporter=tap premium-onboarding-ui.test.mjs signup-autosave.test.mjs telegram-otp-ui.test.mjs > /tmp/base.tap 2>&1
          grep -E '^ *not ok' /tmp/base.tap | sed -E 's/^ *not ok [0-9]+ - //' | sort -u > /tmp/base.txt
          while read -r l; do echo "::warning::baseline fail: $l"; done < /tmp/base.txt
          exit 0
      - name: Apply the email intro OTP patch
        run: |
          set -eu
          python3 scripts/apply-email-intro-otp-20261017.py
          python3 scripts/apply-email-intro-otp-20261017.py >/dev/null
          grep -q "state.capabilities.emailOwnership?.available ? beginEmailOwnership() : beginEmailVerification()" account-access.js
          grep -q -- "- \[x\] Phase 1" docs/fresh-start-plan.md
          git diff --stat
      - name: Rebuild the Worker bundle, refresh sw.js
        run: |
          set -eu
          npm run build:worker
          npm run check:worker-bundle
          npm run sw:manifest
      - name: UI tests (fail only on new failures)
        run: |
          set +e
          node --test --test-concurrency=1 --test-reporter=tap premium-onboarding-ui.test.mjs signup-autosave.test.mjs telegram-otp-ui.test.mjs > /tmp/new.tap 2>&1
          grep -E '^ *not ok' /tmp/new.tap | sed -E 's/^ *not ok [0-9]+ - //' | sort -u > /tmp/new.txt
          comm -13 /tmp/base.txt /tmp/new.txt > /tmp/added.txt
          while read -r l; do echo "::error::NEW fail: $l"; done < /tmp/added.txt
          echo "baseline=$(wc -l < /tmp/base.txt) patched=$(wc -l < /tmp/new.txt) new=$(wc -l < /tmp/added.txt)"
          test ! -s /tmp/added.txt
      - name: Commit and push to the feature branch
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add account-access.js docs/fresh-start-plan.md sw.js
          if git diff --cached --quiet; then echo 'Nothing to commit (already applied).'; else
            git commit -m 'fix(auth): email button runs the OTP chain first (Brevo), Firebase link only as last resort; refresh sw.js' -m 'Applied by apply-email-intro-otp-20261017.yml. No deploy.'
            git push origin HEAD:fix/email-intro-otp
          fi
