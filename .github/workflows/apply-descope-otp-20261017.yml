name: Apply Descope otp-l disabled draft 2026-10-17

# Applies scripts/descope-otp-20261017.patch on feat/descope-otp, verifies the
# exact expected file blobs, runs the targeted verification tests (all Descope
# HTTP calls are mocked) and commits the result back to the SAME branch.
# It never touches main, never deploys, never activates otp-l and never sends
# an OTP. wrangler.toml is not modified. Worker bundle is NOT rebuilt here.

on:
  push:
    branches: [feat/descope-otp]
    paths:
      - '.github/workflows/apply-descope-otp-20261017.yml'
      - 'scripts/descope-otp-20261017.patch'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-descope-otp-20261017
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref_name == 'feat/descope-otp'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/descope-otp
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Apply the Descope patch
        run: |
          set -eu
          if [ ! -f scripts/descope-otp-20261017.patch ]; then echo 'Patch already applied and removed.'; echo 'SKIP=1' >> "$GITHUB_ENV"; exit 0; fi
          git apply --whitespace=nowarn scripts/descope-otp-20261017.patch
          git diff --stat
      - name: Verify exact expected file contents
        if: env.SKIP != '1'
        run: |
          set -eu
          check() { got=$(git hash-object "$2"); if [ "$got" != "$1" ]; then echo "MISMATCH $2 expected $1 got $got"; exit 1; fi; echo "OK $2"; }
          check f6fd28a9532a7f7f04476c6ea4063e6469c63ef2 auth-native/verification/config.mjs
          check 78ade867b5fa07d6e04ca2357b576bc7334a785f auth-native/verification/providers.mjs
          check f1d13b1e13f11e9760d3a291cf63a74eeeb67da0 auth-native/verification/orchestrator.mjs
          check 3b222a2445ebcc800be7d90501f6fd92218b9e31 verification-providers.test.mjs
          check bb729b9edac72ee5ba0866f5918dd832d1597775 package.json
          check 40798c4631adaac960135f7432d80420c7a88bce descope-otp.test.mjs
          check 985978ef9189c23c5866945239d16f2775cd8fcb docs/DESCOPE-OTP-INTEGRATION.md
          git diff --quiet HEAD -- wrangler.toml
          echo 'wrangler.toml unchanged'
      - name: Targeted verification tests (mocked HTTP only)
        if: env.SKIP != '1'
        run: node --test --test-concurrency=1 verification-orchestrator.test.mjs verification-providers.test.mjs descope-otp.test.mjs
      - name: Commit and push to the feature branch
        if: env.SKIP != '1'
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -q scripts/descope-otp-20261017.patch
          git add auth-native/verification/config.mjs auth-native/verification/providers.mjs auth-native/verification/orchestrator.mjs verification-providers.test.mjs package.json
          git commit -m 'feat(auth): Descope Email OTP provider draft (otp-l, provider-evidence, disabled by default)' -m 'Applied by apply-descope-otp-20261017.yml. Targeted tests pass with mocked HTTP. No deploy, no activation, wrangler.toml unchanged.'
          git push origin HEAD:feat/descope-otp
