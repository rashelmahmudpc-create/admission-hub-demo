name: Voice Agent — bind Cartesia key (manual)

# Manual, secret-only workflow: puts CARTESIA_API_KEY on the admission-gk
# Worker, which is the one that hosts the P23 voice agent (VoiceAgentSession).
# It does not touch the code, the Durable Object bindings, or the KV binding —
# `wrangler secret put` writes one secret and leaves the rest alone.
#
# The value comes from the repository secret CARTESIA_API_KEY and is never
# written into this file or the repo.
#
# Required repository secrets: CARTESIA_API_KEY, CLOUDFLARE_API_TOKEN
# (Workers Scripts:Edit), CLOUDFLARE_ACCOUNT_ID.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type SET to write CARTESIA_API_KEY onto the admission-gk worker
        required: true
        type: string

permissions:
  contents: read

jobs:
  put-secret:
    if: ${{ inputs.confirmation == 'SET' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require the Cartesia key to be present
        env:
          CARTESIA_API_KEY: ${{ secrets.CARTESIA_API_KEY }}
        run: |
          if [ -z "$CARTESIA_API_KEY" ]; then
            echo "::error::repository secret CARTESIA_API_KEY is missing or empty"
            exit 1
          fi
          echo "key present (length ${#CARTESIA_API_KEY})"
      - name: Put CARTESIA_API_KEY on the admission-gk worker
        env:
          CARTESIA_API_KEY: ${{ secrets.CARTESIA_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          npm i -g wrangler@4.35.0 >/dev/null 2>&1
          printf '%s' "$CARTESIA_API_KEY" | wrangler secret put CARTESIA_API_KEY --name admission-gk
      - name: Verify the voice agent now has a Cartesia voice
        run: |
          set -eu
          # The health endpoint reports provider COUNTS, never keys. Before this
          # workflow the tts pool held only the Gemini fallback (1); a bound
          # Cartesia key leads the pool and raises it to 2.
          sleep 8
          for i in 1 2 3 4 5; do
            body="$(curl -s --max-time 20 "https://admission-gk.admissionhub.workers.dev/api/voice/agent/health?cb=$RANDOM" || true)"
            echo "health: $body"
            echo "$body" | grep -qE '"tts":[2-9]' && break
            sleep 6
          done
          if echo "$body" | grep -qE '"tts":[2-9]'; then
            echo "CARTESIA BOUND — tts pool grew past the Gemini fallback"
          else
            echo "::error::tts pool did not grow; CARTESIA_API_KEY may not have landed"
            exit 1
          fi
