name: Voice Agent — put Cartesia key in KV (manual)

# Manual workflow: stores CARTESIA_API_KEY in the GK_KV namespace under
# `secret:CARTESIA_API_KEY`, which the voice agent reads at startup.
#
# Why KV and not `wrangler secret put`: the Workers Free plan caps a Worker at
# 64 variables (secrets + text) and admission-gk is already at that cap, so
# binding one more fails with code 10055. A KV entry is not a variable and does
# not count against the cap, so it is the way to add a key without a paid plan.
#
# The value comes from the repository secret CARTESIA_API_KEY and is never
# written into this file or the repo.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type SET to store CARTESIA_API_KEY in GK_KV
        required: true
        type: string

permissions:
  contents: read

jobs:
  put-secret:
    if: ${{ inputs.confirmation == 'SET' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require the Cartesia key to be present
        env:
          CARTESIA_API_KEY: ${{ secrets.CARTESIA_API_KEY }}
        run: |
          if [ -z "$CARTESIA_API_KEY" ]; then
            echo "::error::repository secret CARTESIA_API_KEY is missing or empty"
            exit 1
          fi
          echo "key present (length ${#CARTESIA_API_KEY})"
      - name: Store CARTESIA_API_KEY in GK_KV
        env:
          CARTESIA_API_KEY: ${{ secrets.CARTESIA_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          npm i -g wrangler@4.35.0 >/dev/null 2>&1
          # The namespace id is the one wrangler.toml binds as GK_KV. The value
          # goes through a temp file, not argv, so the key never reaches the
          # process list or the run log.
          tmp="$(mktemp)"
          printf '%s' "$CARTESIA_API_KEY" > "$tmp"
          wrangler kv key put \
            --namespace-id b9353515b098427687afcfb8654ed359 \
            --remote "secret:CARTESIA_API_KEY" --path "$tmp"
          rm -f "$tmp"
      - name: Verify the voice agent now leads with Cartesia
        run: |
          set -eu
          # Health reports provider COUNTS, never keys. Before this, the tts pool
          # held only the Gemini fallback (1); a KV-held Cartesia key leads the
          # pool and raises it to 2.
          sleep 8
          for i in 1 2 3 4 5; do
            body="$(curl -s --max-time 20 "https://admission-gk.admissionhub.workers.dev/api/voice/agent/health?cb=$RANDOM" || true)"
            echo "health: $body"
            echo "$body" | grep -qE '"tts":[2-9]' && break
            sleep 6
          done
          if echo "$body" | grep -qE '"tts":[2-9]'; then
            echo "CARTESIA IN KV — tts pool grew past the Gemini fallback"
          else
            echo "::error::tts pool did not grow; the KV key may not have landed or the code is not deployed"
            exit 1
          fi
