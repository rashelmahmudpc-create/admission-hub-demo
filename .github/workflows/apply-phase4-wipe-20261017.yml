name: Apply Fresh Start phase 4 wipe 2026-10-17

# Downloads the reviewed patch (sha256 pinned), applies it (workflow files are
# added separately by the owner token), rebuilds worker-bundle.mjs, runs the
# wipe/students tests and commits back to THIS branch. Never deploys, never wipes.

on:
  push:
    branches: [chore/phase4-wipe]
    paths:
      - '.github/workflows/apply-phase4-wipe-20261017.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.ref_name == 'chore/phase4-wipe'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: chore/phase4-wipe
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply the patch (idempotent)
        run: |
          set -eu
          if [ -f auth-native/storage/student-wipe.mjs ]; then echo 'Already applied.'; exit 0; fi
          curl -fsSL https://backend.composio.dev/api/v3/sl/29UiqkgLQ8 -o /tmp/wipe.patch
          echo 'bdfacb32d02749c39287bc0e3604e8eaf5ac5c1518f57f93de5c83652c1af640  /tmp/wipe.patch' | sha256sum -c -
          git apply --exclude='.github/workflows/*' /tmp/wipe.patch
          git diff --stat
      - name: Rebuild the Worker bundle and run the tests (must pass)
        run: |
          set -eu
          npm ci
          npm run build:worker
          npm run check:worker-bundle
          node --check scripts/fresh-start-wipe.mjs
          node --test --test-concurrency=1 student-wipe.test.mjs student-admin-view.test.mjs student-directory-schema.test.mjs
      - name: Commit and push to the branch
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add auth-native student-wipe.test.mjs scripts package.json docs/fresh-start-plan.md worker-bundle.mjs
          if git diff --cached --quiet; then echo 'Nothing to commit.'; else
            git commit -m 'feat(auth): Fresh Start phase 4 wipe route + list/wipe script; regenerate worker-bundle.mjs' -m 'Applied by apply-phase4-wipe-20261017.yml. No deploy, no wipe.'
            git push origin HEAD:chore/phase4-wipe
          fi
