name: Deploy Pages UI + Worker (manual)

# Manual, deploy-only workflow. Mirrors the deploy steps of native-auth-activate.yml
# without any Firebase/mailbox/secret mutation: it publishes the committed Worker
# bundle and the sanitized Pages shell, nothing else.
#
# Required repository secrets: CLOUDFLARE_API_TOKEN (Pages:Edit + Workers Scripts:Edit),
# CLOUDFLARE_ACCOUNT_ID.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY to publish the committed Worker bundle and Pages UI
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: admission-hub-pages-deploy
  cancel-in-progress: false

jobs:
  worker:
    if: ${{ inputs.confirmation == 'DEPLOY' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify the committed Worker bundle matches its sources
        run: npm run check:worker-bundle
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.35.0'
          command: deploy --config wrangler.toml

      # The Worker must answer for the project the app now belongs to. The key is
      # the public Firebase Web API key of admissionsky-997d2 (project 916950643726),
      # not a secret in the confidential sense; it is inlined so this deploy does not
      # depend on a repository secret that is not present.
      - name: Bind the Firebase Web API key for admissionsky-997d2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          KEY='AIzaSyCMYPy-qANPN1pPPI1B957wwKezmotK_NI'
          test "${#KEY}" -eq 39
          printf '%s' "$KEY" | npx --yes wrangler@4.35.0 secret put FIREBASE_WEB_API_KEY --name admission-gk

      # Owner 2026-10-16: the human check before an ownership OTP. The matching
      # site key is public and lives in index.html; only this secret is bound
      # here. Without it verifyTurnstile stays inert, so a missing secret cannot
      # lock students out of signup.
      - name: Bind the Turnstile secret key
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: |
          set -eu
          if [ -z "${TURNSTILE_SECRET_KEY:-}" ]; then
            echo "::notice title=Turnstile skipped::TURNSTILE_SECRET_KEY is not set; the human check stays inert."
            exit 0
          fi
          printf '%s' "$TURNSTILE_SECRET_KEY" | npx --yes wrangler@4.35.0 secret put TURNSTILE_SECRET_KEY --name admission-gk

      # The sender name is a provider-account value, not Worker code, so a secret
      # left over from the old brand keeps showing "Admission Hub" even after the
      # templates changed. Overwrite the existing from-name secrets only: this
      # Worker already sits on Cloudflare's 64-variable free-tier ceiling, so
      # creating a name that is absent would fail the deploy.
      - name: Pin the OTP sender display names
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          present=$(npx --yes wrangler@4.35.0 secret list --name admission-gk --format json | node -e '
            let raw = ""; process.stdin.on("data", c => { raw += c; });
            process.stdin.on("end", () => {
              try { console.log(JSON.parse(raw).map(row => row.name).join("\n")); } catch { process.exit(0); }
            });
          ')
          for name in BREVO_FROM_NAME RESEND_FROM_NAME MAILERSEND_FROM_NAME MAILJET_FROM_NAME DEADSIMPLEEMAIL_FROM_NAME; do
            if printf '%s\n' "$present" | grep -qx "$name"; then
              printf '%s' 'AdmissionSky' | npx --yes wrangler@4.35.0 secret put "$name" --name admission-gk
            else
              echo "::notice title=OTP sender name skipped::${name} is not bound; leaving the provider default in place."
            fi
          done
      - name: Apply the AgentMail sender display name
        env:
          AGENTMAIL_API_KEY: ${{ secrets.AGENTMAIL_API_KEY }}
          AGENTMAIL_INBOX_ID: ${{ secrets.AGENTMAIL_INBOX_ID }}
          AGENTMAIL_INBOX_DISPLAY_NAME: AdmissionSky
        run: |
          set -eu
          if [ -z "${AGENTMAIL_API_KEY:-}" ] || [ -z "${AGENTMAIL_INBOX_ID:-}" ]; then
            echo "::notice title=AgentMail display name skipped::AgentMail is not configured; the otp-e sender keeps its inbox default."
            exit 0
          fi
          node auth-native/operations/set-agentmail-display-name.mjs

  pages:
    if: ${{ inputs.confirmation == 'DEPLOY' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Confirm the service-worker manifest is in sync
        run: npm run check:sw-manifest
      - name: Build sanitized Pages bundle
        run: |
          set -eu
          rm -rf dist
          mkdir -p dist
          rsync -a --exclude='.git' --exclude='node_modules' --exclude='docs' --exclude='AGENT_RESUME' --exclude='ai-proxy' --exclude='auth' --exclude='auth-native' --exclude='email-gateway' --exclude='apps-script' --exclude='uploads' --exclude='.github' --exclude='gk-agent-worker.js' --exclude='public-worker.js' --exclude='ai-agent.js' --exclude='worker-bundle.mjs' --exclude='voice-worker.js' --exclude='voice-agent.mjs' --exclude='voice-agent-core.mjs' --exclude='voice-agent-providers.mjs' --exclude='voice-agent-gate.mjs' --exclude='notification-worker.js' --exclude='fcm-notification.mjs' --exclude='wrangler.toml' --exclude='package.json' --exclude='package-lock.json' --exclude='*.test.mjs' --exclude='*.md' ./ dist/
          test -s dist/index.html
          test -s dist/sw.js
          test -s dist/account-access.js
          # The voice page loads its module by relative path; without it the
          # page 404s the import and the gate protects a page that cannot run.
          test -s dist/voice-agent-client-core.mjs
          ! test -e dist/voice-agent-gate.mjs
          ! test -e dist/onboarding-welcome-hero.webp
          ! test -e dist/onboarding-personal-hero.webp
      - name: Deploy Pages UI
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.35.0'
          command: pages deploy dist --project-name admissionhub --branch main

      # Same sanitized bundle, second address: the owner's shorter
      # admissionsky.pages.dev. A Pages project named `admissionsky` owns that
      # hostname automatically, so both addresses serve identical bytes.
      - name: Ensure the admissionsky Pages project exists
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.35.0'
          command: pages project create admissionsky --production-branch main
      - name: Deploy Pages UI to the short address
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.35.0'
          command: pages deploy dist --project-name admissionsky --branch main
