name: Apply pending signup wiring 2026-10-18

# AUTH step 1 (করণীয় ৩–৪): runs scripts/apply-pending-signup-wire-20261018.py on
# auth/step1-pending-signup (a few anchored lines in the DO, the public handler
# and package.json), rebuilds worker-bundle.mjs, runs the auth tests, removes the
# script and commits back to the SAME branch. Never touches main, never deploys.

on:
  push:
    branches: [auth/step1-pending-signup]
    paths:
      - '.github/workflows/apply-pending-signup-wire-20261018.yml'
      - 'scripts/apply-pending-signup-wire-20261018.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-pending-signup-wire-20261018
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref_name == 'auth/step1-pending-signup'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: auth/step1-pending-signup
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply the wiring patch
        run: |
          set -eu
          if [ ! -f scripts/apply-pending-signup-wire-20261018.py ]; then echo 'Already applied.'; exit 0; fi
          python3 scripts/apply-pending-signup-wire-20261018.py
          python3 scripts/apply-pending-signup-wire-20261018.py >/dev/null
          for f in auth-native/worker/auth-authority-do.mjs auth-native/worker/public-auth-handler.mjs auth-native/worker/pending-signup-authority.mjs auth-native/worker/pending-signup-public.mjs auth-native/verification/email-ownership-record.mjs; do node --check "$f"; done
          if grep -n 'console\.' auth-native/worker/pending-signup*.mjs auth-native/verification/email-ownership-record.mjs; then exit 1; fi
          git diff --stat
      - name: Install and rebuild the Worker bundle
        run: |
          set -eu
          npm ci
          npm run build:worker
      - name: Pending signup tests (must pass)
        run: node --test --test-concurrency=1 pending-signup.test.mjs pending-signup-wire.test.mjs
      - name: Session auth tests (only the 2 known failures allowed)
        run: |
          set -u
          out=$(node --test --test-concurrency=1 native-auth.test.mjs native-auth-operations.test.mjs native-auth-protection.test.mjs verification-orchestrator.test.mjs pending-signup.test.mjs pending-signup-wire.test.mjs 2>&1 || true)
          echo "$out" | grep -E '^not ok|^# (tests|pass|fail)' || true
          bad=$(echo "$out" | grep '^not ok' | grep -v -e 'HttpOnly cookies' -e 'release guard literals' || true)
          if [ -n "$bad" ]; then echo "New failures:"; echo "$bad"; exit 1; fi
      - name: Wider auth tests (informational)
        continue-on-error: true
        run: node --test --test-concurrency=1 telegram-otp-auth.test.mjs descope-otp.test.mjs descope-magiclink.test.mjs backup-public-handler.test.mjs 2>&1 | grep -E "^not ok|^# (pass|fail)" || true
      - name: Commit and push to the feature branch
        run: |
          set -eu
          if [ ! -f scripts/apply-pending-signup-wire-20261018.py ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -q scripts/apply-pending-signup-wire-20261018.py
          git add -A
          git commit -m 'auth(step1): wire pending signup into DO routes and the public handler (opt-in, no deploy)' -m 'Applied by apply-pending-signup-wire-20261018.yml.'
          git push origin HEAD:auth/step1-pending-signup
          npm run check:worker-bundle
