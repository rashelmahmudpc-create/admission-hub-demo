name: Apply Sky weak-topic recall fix (2026-10-18)

# Bug: a student said in chat "আমি সমাসে দুর্বল"; asked "আমার দুর্বলতা কী?" with no
# exams yet, Sky first said there was no information, and only on "মনে করে দেখো"
# did it recall সমাস. Fix: stated weak topics reach the tool shortcut, the tool
# context and a clearly labelled memory block; questions no longer overwrite them.
# Package checked by SHA-256, final tree by fingerprint. Commits to this branch
# only. Never touches main, never deploys.

on:
  push:
    branches: [fix/sky-weak-recall-20261018]
    paths: ['.github/workflows/apply-sky-weak-recall-20261018.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  PKG_URL: https://backend.composio.dev/api/v3/sl/E6EGLNy-L6
  PKG_SHA256: b16c70951962643d8a7bf4fa2dcd4a589b39aeb0c9b340a924dcafbe05ac86ce
  BASE: ab6157aa402807b7b0d20633fcaa6d5fef818c57
  WF: .github/workflows/apply-sky-weak-recall-20261018.yml

jobs:
  apply:
    if: github.ref_name == 'fix/sky-weak-recall-20261018'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/sky-weak-recall-20261018
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Already applied?
        id: done
        run: |
          if [ -f sky-memory-weak-recall.test.mjs ]; then echo 'already=1' >> "$GITHUB_OUTPUT"; fi
      - name: Overlay and verify tree
        if: steps.done.outputs.already != '1'
        run: |
          set -eu
          [ "$(git rev-parse HEAD~1)" = "$BASE" ] || { echo 'branch moved'; exit 1; }
          curl -fsSL --retry 3 -L "$PKG_URL" -o /tmp/pkg.tgz
          echo "$PKG_SHA256  /tmp/pkg.tgz" | sha256sum -c -
          mkdir /tmp/pk && tar xzf /tmp/pkg.tgz -C /tmp/pk
          cp -a /tmp/pk/f/. .
          git add -A
          FP=$(git ls-files -s | grep -vF "$WF" | awk '{print $2, $4}' | sha256sum | cut -c1-64)
          [ "$FP" = "$(cat /tmp/pk/fp)" ] || { echo 'tree fingerprint mismatch'; git status --short; exit 1; }
      - name: Checks and tests
        if: steps.done.outputs.already != '1'
        run: |
          set -eu
          npm ci --ignore-scripts
          npm run check:worker-bundle
          cp sw.js /tmp/sw.packaged.js; npm run sw:manifest; cmp sw.js /tmp/sw.packaged.js
          for f in sky-memory-weak-recall ai-audit-fixes ai-agent-f1 ai-chat-history ai-live-stages ai-provider-adapters p06-personal-tutor p21-ai-agent-ui p25-chat-cache p27-history-trim phase9-m10-observability phase9-m4-context-engine phase9-m5-prompt-registry phase9-m8-response-validation phase9-m9-action-ui pr3-shared-answers sky-agent-tools sky-contact sky-core-memory sky-daily-report sky-time-memory sky-web-search voice-agent-client-core voice-agent; do
            echo "::group::$f"; node --test "$f.test.mjs"; echo "::endgroup::"
          done
      - name: Commit and push
        if: steps.done.outputs.already != '1'
        run: |
          set -eu
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -qm 'fix(ai): Sky uses the weak topic the student stated in chat on the first answer (no exams needed); questions never overwrite it'
          git push origin HEAD:fix/sky-weak-recall-20261018
