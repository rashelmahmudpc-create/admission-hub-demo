name: TMP Binding Audit

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Count Worker bindings (names only, never values)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node -e '
          const acc=process.env.CLOUDFLARE_ACCOUNT_ID, tok=process.env.CLOUDFLARE_API_TOKEN;
          const h={Authorization:"Bearer "+tok,Accept:"application/json"};
          (async()=>{
            const s=await fetch(`https://api.cloudflare.com/client/v4/accounts/${acc}/workers/scripts/admission-gk/secrets`,{headers:h});
            const sj=await s.json();
            const secrets=(sj.result||[]).map(r=>r.name).sort();
            console.log("secrets_http",s.status,"count",secrets.length);
            const t=await fetch(`https://api.cloudflare.com/client/v4/accounts/${acc}/workers/scripts/admission-gk/settings`,{headers:h});
            const tj=await t.json();
            const binds=(tj.result&&tj.result.bindings)||[];
            const types={};
            for(const b of binds){types[b.type]=(types[b.type]||0)+1;}
            console.log("settings_http",t.status,"binding_types",JSON.stringify(types));
            const text=binds.filter(b=>b.type==="plain_text").map(b=>b.name).sort();
            console.log("plain_text_vars",text.length,JSON.stringify(text));
            console.log("secret_names",JSON.stringify(secrets));
            console.log("TOTAL_TEXT_PLUS_SECRET",text.length+secrets.length);
            const total=text.length+secrets.length;
            console.log(total<64?"ROOM: "+(63-total)+" slots free (64th is the last valid)":(total===64?"AT_CEILING":"OVER_CEILING"));
          })().catch(e=>{console.log("ERR",e.message);process.exit(1);});
          '
