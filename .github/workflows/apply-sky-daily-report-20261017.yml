name: Apply Sky daily report 2026-10-17

# Anonymous daily AI report: applies scripts/apply-sky-daily-report-20261017.py on the feature
# branch, regenerates worker-bundle.mjs and sw.js, runs the AI tests and commits
# back to the SAME branch. Never touches main, never deploys.

on:
  push:
    branches: [feat/sky-daily-report]
    paths:
      - '.github/workflows/apply-sky-daily-report-20261017.yml'
      - 'scripts/apply-sky-daily-report-20261017.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-sky-daily-report-20261017
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref_name == 'feat/sky-daily-report'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/sky-daily-report
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply the daily-report patch
        run: |
          set -eu
          python3 scripts/apply-sky-daily-report-20261017.py
          python3 scripts/apply-sky-daily-report-20261017.py >/dev/null
          grep -q "from './sky-daily-report.mjs'" ai-agent.js
          grep -q 'await runDailyReport(env)' gk-agent-worker.js
          grep -q "'/api/admin/ai-daily-report'" public-worker.js
          grep -q 'id="ai-report"' students-control-center.html
          git diff --stat
      - name: Install, rebuild the Worker bundle and the SW manifest
        run: |
          set -eu
          npm ci --ignore-scripts
          npm run build:worker
          npm run check:worker-bundle
          npm run sw:manifest
      - name: AI tests
        run: |
          set -eu
          for f in sky-daily-report ai-state-do seo-routing p19-backup pr3-shared-answers pr2-fast-start sky-core-memory phase9-m5-prompt-registry ai-agent-f1 ai-live-stages p30-ai-latency-cache p25-chat-cache phase9-m10-observability phase9-m8-response-validation ai-chat-history phase9-m6-tool-registry p06-personal-tutor phase9-m4-context-engine phase9-m7-memory-engine ai-provider-adapters p26-tier-router p27-history-trim p28-provider-health p31-model-priority honesty-guard i18n-guard account-retirement account-data-isolation p15-pwa-offline p21-ai-agent-ui dead-handler-guard panel-fullscreen sky-onboarding; do
            echo "::group::$f"; node "$f.test.mjs"; echo "::endgroup::"
          done
      - name: Commit and push to the feature branch
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai-agent.js ai-state-do.mjs gk-agent-worker.js public-worker.js students-control-center.html _headers sw.js worker-bundle.mjs
          if git diff --cached --quiet; then echo 'Nothing to commit (already applied).'; else
            git commit -m 'feat(ai): anonymous daily AI report wired in (counts, cron, admin route, Control Center card)' -m 'Applied by apply-sky-daily-report-20261017.yml. No deploy.'
            git push origin HEAD:feat/sky-daily-report
          fi
