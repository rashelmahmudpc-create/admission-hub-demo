name: Apply Sky v2 chat UI (one-shot)
on:
  workflow_dispatch:
    inputs:
      url:
        description: Patch URL
        required: true
        type: string
      sha256:
        description: Expected sha256 of the patch
        required: true
        type: string
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Download and verify patch
        env:
          PURL: ${{ inputs.url }}
          PSHA: ${{ inputs.sha256 }}
        run: |
          set -eu
          curl -fsSL "$PURL" -o /tmp/sky.patch
          echo "$PSHA  /tmp/sky.patch" | sha256sum -c -
      - name: Apply patch
        run: git apply --whitespace=nowarn /tmp/sky.patch && git status --short
      - name: Verify
        run: |
          set -eu
          node --check ai-agent-chat.js
          node --test p21-ai-agent-ui.test.mjs ai-duplicate-turn.test.mjs phase9-m9-action-ui.test.mjs phase9-m8-response-validation.test.mjs p06-personal-tutor.test.mjs account-data-isolation.test.mjs account-retirement.test.mjs theme-tokens.test.mjs theme-coverage-scan.test.mjs p19-perf-budget.test.mjs seo-routing.test.mjs
          cp sw.js /tmp/sw.before
          node scripts/sw-manifest.mjs
          cmp sw.js /tmp/sw.before
      - name: Commit and push
        run: |
          set -eu
          git config user.name 'Sheik Mohammad Rashel'
          git config user.email 'rashelmahmudpc@gmail.com'
          git add -A -- . ':!.github'
          git commit -m 'feat(ai): Sky v2 chat UI from owner design (sky-chat 2.html)' -m 'New animated Sky avatar with props (laptop, book, note, cup, magnifier, calculator, headphones, cap) and 30 live activities; live status panel driven only by real request stages; all demo answers, fake steps and fake history removed; theme follows app + device dark/light. Backend untouched. Cache bump: ai-agent-chat skyv2, SW v337-skyv2-20261017.'
          git push origin HEAD:main
