name: Apply Sky recall v2 (2026-10-18)

# Owner plan step 2, v2 on top of #99: the reminder now shows IN Sky's bubble
# (textContent, replacing the time greeting) with one button that sends a
# prompt; 2.5 s timeout -> greeting fallback; skipped for English UI.
# "No exam yet" wording, hi/thanks never recalled as last-topic, route returns
# 401 when signed out, agentRecall(env, uid, body). skyv10 -> skyv11.
# Commits to this branch only. Never touches main, never deploys.

on:
  push:
    branches: [feat/sky-recall-v2-20261018]
    paths: ['.github/workflows/apply-sky-recall-v2-20261018.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  PKG_URL: https://litter.catbox.moe/hxaf27.tgz
  PKG_SHA256: b686f136ad5b348ecf31782223d629fcead4cf6a0bbbab67b562264dae74690e
  BASE: 1298dab5ed662ddb1639bb65f0a027e0246a55fc

jobs:
  apply:
    if: github.ref_name == 'feat/sky-recall-v2-20261018'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/sky-recall-v2-20261018
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Already applied?
        id: done
        run: |
          if grep -q isSmallTalkTopic sky-recall.mjs; then echo 'already=1' >> "$GITHUB_OUTPUT"; fi
      - name: Overlay
        if: steps.done.outputs.already != '1'
        run: |
          set -eu
          git diff --quiet "$BASE" HEAD -- account-retirement.test.mjs ai-agent-chat.js ai-agent.js index.html p11-dashboard-v2.test.mjs p21-ai-agent-ui.test.mjs public-worker.js sky-recall.mjs sky-recall.test.mjs startup-ai-regression.test.mjs sw.js worker-bundle.mjs memory-engine.js sky-tools.mjs || { echo 'patched files changed since BASE'; exit 1; }
          curl -fsSL --retry 3 -L "$PKG_URL" -o /tmp/pkg.tgz
          echo "$PKG_SHA256  /tmp/pkg.tgz" | sha256sum -c -
          mkdir /tmp/pk && tar xzf /tmp/pkg.tgz -C /tmp/pk
          cp -a /tmp/pk/f/. .
          git add -A
          git diff --cached --stat
      - name: Checks and tests
        if: steps.done.outputs.already != '1'
        run: |
          set -eu
          npm ci --ignore-scripts
          npm run check:worker-bundle
          cp sw.js /tmp/sw.packaged.js; npm run sw:manifest; cmp sw.js /tmp/sw.packaged.js
          for f in sky-recall sky-memory-weak-recall p21-ai-agent-ui ai-audit-fixes ai-agent-f1 ai-chat-history ai-live-stages ai-provider-adapters p06-personal-tutor p25-chat-cache p27-history-trim phase9-m10-observability phase9-m4-context-engine phase9-m5-prompt-registry phase9-m8-response-validation phase9-m9-action-ui pr3-shared-answers sky-agent-tools sky-contact sky-core-memory sky-daily-report sky-time-memory sky-web-search voice-agent-client-core voice-agent; do
            echo "::group::$f"; node --test "$f.test.mjs"; echo "::endgroup::"
          done
      - name: Commit and push
        if: steps.done.outputs.already != '1'
        run: |
          set -eu
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -qm 'feat(ai): Sky recall v2 - reminder in the bubble with one button, greeting fallback, no-exam wording, no hi/thanks recall, 401 when signed out'
          git push origin HEAD:feat/sky-recall-v2-20261018
