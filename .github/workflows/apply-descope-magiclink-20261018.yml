name: Apply Descope magic link (otp-m) 2026-10-18

# Applies scripts/descope-magiclink-20261018.patch on feat/descope-magiclink, adds the
# otp-m row to wrangler.toml, bumps the account-access.js cache key, regenerates
# sw.js digests and worker-bundle.mjs, runs mocked tests and commits back to the
# SAME branch. Never touches main, never deploys, never sends a live email.

on:
  push:
    branches: [feat/descope-magiclink]
    paths:
      - '.github/workflows/apply-descope-magiclink-20261018.yml'
      - 'scripts/descope-magiclink-20261018.patch'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-descope-magiclink-20261018
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref_name == 'feat/descope-magiclink'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/descope-magiclink
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply patch and config edits
        run: |
          set -eu
          if [ ! -f scripts/descope-magiclink-20261018.patch ]; then echo 'Already applied.'; echo 'SKIP=1' >> "$GITHUB_ENV"; exit 0; fi
          git apply --unidiff-zero --whitespace=nowarn scripts/descope-magiclink-20261018.patch
          cat > /tmp/ml.py <<'PY'
          import re
          def rep(p,a,b):
              s=open(p).read()
              if b in s: return
              assert s.count(a)>=1,(p,a); open(p,'w').write(s.replace(a,b))
          s=open('wrangler.toml').read()
          if '"id":"otp-m"' not in s:
              m=re.search(r'\{"id":"otp-l"[^{}]*\}',s)
              row='{"id":"otp-m","enabled":true,"priority":38,"dailyQuota":1000,"timeoutMs":12000,"label":"login link","projectId":"P3Km4McYmZUg8ZzIJfEnf9ZCDkFD"}'
              open('wrangler.toml','w').write(s[:m.end()]+','+row+s[m.end():])
          rep('verification-providers.test.mjs',"'otp-k', 'otp-l', 'whatsapp', 'telegram']","'otp-k', 'otp-l', 'otp-m', 'whatsapp', 'telegram']")
          rep('verification-providers.test.mjs',"['otp-f', 'otp-i', 'otp-j', 'otp-k', 'otp-l', 'otp-g', 'otp-c', 'telegram']","['otp-f', 'otp-i', 'otp-j', 'otp-k', 'otp-l', 'otp-m', 'otp-g', 'otp-c', 'telegram']")
          rep('verification-orchestrator.test.mjs',"'otp-k': 12000, 'otp-l': 12000, 'otp-b': 20000,","'otp-k': 12000, 'otp-l': 12000, 'otp-m': 12000, 'otp-b': 20000,")
          for p in ('sw.js','index.html','account-retirement.test.mjs'):
              rep(p,'account-access.js?v=20261016-disposable-email-v1','account-access.js?v=20261018-magiclink-v1')
          PY
          python3 /tmp/ml.py
          node scripts/sw-manifest.mjs
          check() { got=$(git hash-object "$2"); [ "$got" = "$1" ] || { echo "MISMATCH $2 $got"; exit 1; }; echo "OK $2"; }
          check 18d7436333f6e0da75f0e7c711fb9dc720f617ec account-access.js
          check 6be1a64a9e106e40d0bd1148e02cf9d944a990c2 auth-native/verification/config.mjs
          check 8a3207fd39f4e4d5ca04abc67b18a7b4bddca720 auth-native/verification/orchestrator.mjs
          check dac9f7c35f557beb526effdd9933c18194f3ecba auth-native/verification/providers.mjs
          check 81752e303770ff9559b202268498d38dafe3e3f7 auth-native/worker/auth-authority-do.mjs
          check 35eb0f5ab771e60601e47d9f19e701b47d12428c auth-native/worker/public-auth-handler.mjs
          check c4bd67f067080b38c3176f69f6544d44314e43ad wrangler.toml
          check ea2ae66f68b31d7b3a1aa136ee82837d502da223 descope-magiclink.test.mjs
          git diff --stat
      - name: Install and rebuild the Worker bundle
        if: env.SKIP != '1'
        run: |
          set -eu
          npm ci
          npm run build:worker
          npm run check:worker-bundle
          grep -q 'DescopeMagicLinkVerificationProvider' worker-bundle.mjs
      - name: Mocked tests
        if: env.SKIP != '1'
        run: node --test --test-concurrency=1 descope-magiclink.test.mjs descope-otp.test.mjs verification-providers.test.mjs verification-orchestrator.test.mjs compact-auth-config.test.mjs free-tier-failover.test.mjs backup-public-handler.test.mjs email-branding.test.mjs multimethod-auth-ui.test.mjs account-retirement.test.mjs
      - name: Commit and push to the feature branch
        if: env.SKIP != '1'
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -q scripts/descope-magiclink-20261018.patch
          git add -A account-access.js auth-native wrangler.toml sw.js index.html worker-bundle.mjs descope-magiclink.test.mjs verification-providers.test.mjs verification-orchestrator.test.mjs account-retirement.test.mjs
          git commit -m 'feat(auth): Descope Magic Link (otp-m) — "Email-এ login link পাঠাও"' -m 'Applied by apply-descope-magiclink-20261018.yml. magiclink/signup-in/email + magiclink/verify (verifiedEmail + exact email). Bearer = projectId only; sessionJwt never stored. Bundle + sw.js regenerated. No deploy.'
          git push origin HEAD:feat/descope-magiclink
