name: Install OpenRouter key into KV (manual, owner-authorised)

# Owner supplied a fresh OpenRouter key. The repo is PUBLIC, so the key is held
# as an ENCRYPTED repo secret (OPENROUTER_KEYS) and read via secrets.* here —
# never passed as a workflow input and never printed. This writes it to the KV
# name the app reads, `OPENROUTER_API_KEYS`, in secret:AI_KEYS.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type SET-OPENROUTER to install the key into KV
        required: true
        type: string

permissions:
  contents: read

jobs:
  set:
    if: ${{ inputs.confirmation == 'SET-OPENROUTER' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write OPENROUTER_API_KEYS into secret:AI_KEYS
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NS: b9353515b098427687afcfb8654ed359
          ORKEY: ${{ secrets.OPENROUTER_KEYS }}
        run: |
          set -eu
          if [ -z "${ORKEY:-}" ]; then echo "no OPENROUTER_KEYS secret set"; exit 1; fi
          URI="https://api.cloudflare.com/client/v4/accounts/${CF_ACCT}/storage/kv/namespaces/${NS}/values/secret:AI_KEYS"
          curl -fsS "$URI" -H "Authorization: Bearer ${CF_TOKEN}" -o /tmp/aikeys.json
          node -e '
            const fs=require("fs");
            const j=JSON.parse(fs.readFileSync("/tmp/aikeys.json","utf8"));
            const v=String(process.env.ORKEY||"").trim();
            j.OPENROUTER_API_KEYS=v;
            fs.writeFileSync("/tmp/new.json", JSON.stringify(j));
            console.log("wrote OPENROUTER_API_KEYS, length:", v.length, "| total names:", Object.keys(j).length);
          '
          curl -fsS -X PUT "$URI" -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" --data-binary @/tmp/new.json -o /tmp/put.json
          node -e 'const r=JSON.parse(require("fs").readFileSync("/tmp/put.json","utf8")); console.log("write success:", r.success);'
