name: Apply unified theme + deploy 2026-10-16

on:
  push:
    branches: [main]
    paths:
      - 'scripts/unified-theme-20261016.py'
      - '.github/workflows/apply-unified-theme-20261016.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: admission-hub-pages-deploy
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply source changes
        run: python3 scripts/unified-theme-20261016.py
      - name: Syntax check
        run: |
          node --check theme-unified.js
          node --check profile-ui.js
          node --check phase1-upgrade.js
          node --check dashboard-v2.js
          node --check ai-agent-chat.js
          node --check question-bank-clean.js
      - name: Service-worker digests
        run: npm run sw:manifest
      - name: Regression tests
        run: node --test --test-concurrency=1 seo-routing.test.mjs p19-perf-budget.test.mjs theme-tokens.test.mjs theme-coverage-scan.test.mjs
      - name: Commit and push
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then echo 'Nothing to commit (already applied).'; else
            git commit -m 'feat(theme): one Scholar Dashboard theme app-wide - dark default + premium light; old palettes retired' -m 'Owner-approved 2026-10-16. Applied by scripts/unified-theme-20261016.py; sw.js digests regenerated.'
            ok=0
            for i in 1 2 3; do
              if git push origin HEAD:main; then ok=1; break; fi
              git pull --rebase origin main
            done
            test "$ok" = 1
          fi
      - name: Build sanitized frontend bundle
        env:
          GITHUB_SHA_OVERRIDE: ''
        run: |
          set -eu
          rm -rf dist && mkdir -p dist
          rsync -a --exclude='.git' --exclude='node_modules' --exclude='dist' --exclude='docs' --exclude='AGENT_RESUME' --exclude='ai-proxy' --exclude='auth' --exclude='auth-native' --exclude='email-gateway' --exclude='apps-script' --exclude='uploads' --exclude='.github' --exclude='gk-agent-worker.js' --exclude='public-worker.js' --exclude='ai-agent.js' --exclude='worker-bundle.mjs' --exclude='voice-worker.js' --exclude='notification-worker.js' --exclude='fcm-notification.mjs' --exclude='wrangler.toml' --exclude='package.json' --exclude='package-lock.json' --exclude='*.test.mjs' --exclude='*.md' ./ dist/
          GITHUB_SHA="$(git rev-parse HEAD)" node scripts/build-welcome-pages.mjs dist
          test -s dist/index.html && test -s dist/theme-unified.css && test -s dist/theme-unified.js
      - name: Deploy admissionsky
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.35.0 pages deploy dist --project-name admissionsky --branch main --commit-hash "$(git rev-parse HEAD)" --commit-dirty=true
      - name: Deploy admissionhub (same bytes)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.35.0 pages deploy dist --project-name admissionhub --branch main --commit-hash "$(git rev-parse HEAD)" --commit-dirty=true
      - name: Verify live
        run: |
          sleep 20
          curl -fsS 'https://admissionsky.pages.dev/theme-unified.css?v=unified-theme-v1' | grep -F 'UNIFIED THEME'
          curl -fsS -H 'Cache-Control: no-cache' 'https://admissionsky.pages.dev/' | grep -F 'theme-unified.js'
