name: Apply Tavily key to chat env 2026-10-18

# Owner 2026-10-18: live chat never searched. gk-agent-worker passes the public/chat handler
# a whitelist env (envPub) that lacked TAVILY_API_KEY / TAVILY_DAILY_CAP. Added + test W11.
# Package checked by SHA-256, final tree by fingerprint. Never deploys.

on:
  push:
    branches: [fix/sky-web-env]
    paths: ['.github/workflows/apply-sky-web-env-20261018.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  PKG_URL: https://backend.composio.dev/api/v3/sl/o1jLUs_2bs
  PKG_SHA256: 8ea495319179ee238d29b50e8a5086ae5a43d6e09b3ef9ee1ab7f7afab1e38ec
  BASE: e86e3609288f5a9b4c4bdc92e3943878ff7a802f
  WF: .github/workflows/apply-sky-web-env-20261018.yml

jobs:
  apply:
    if: github.ref_name == 'fix/sky-web-env'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/sky-web-env
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Already applied?
        id: done
        run: |
          if grep -q 'TAVILY_API_KEY: env.TAVILY_API_KEY' gk-agent-worker.js; then echo 'already=1' >> "$GITHUB_OUTPUT"; fi
      - name: Overlay and verify tree
        if: steps.done.outputs.already != '1'
        run: |
          set -eu
          [ "$(git rev-parse HEAD~1)" = "$BASE" ] || { echo 'branch moved'; exit 1; }
          curl -fsSL --retry 3 -L "$PKG_URL" -o /tmp/pkg.tgz
          echo "$PKG_SHA256  /tmp/pkg.tgz" | sha256sum -c -
          mkdir /tmp/pk && tar xzf /tmp/pkg.tgz -C /tmp/pk
          cp -a /tmp/pk/f/. .
          node --check gk-agent-worker.js
          git add -A
          FP=$(git ls-files -s | grep -vF "$WF" | awk '{print $2, $4}' | sha256sum | cut -c1-64)
          [ "$FP" = "$(cat /tmp/pk/fp)" ] || { echo 'tree fingerprint mismatch'; git status --short; exit 1; }
      - name: Checks and tests
        if: steps.done.outputs.already != '1'
        run: |
          set -eu
          npm ci --ignore-scripts
          npm run check:worker-bundle
          cp sw.js /tmp/sw.packaged.js; npm run sw:manifest; cmp sw.js /tmp/sw.packaged.js
          for f in pr2-fast-start pr3-shared-answers sky-contact sky-core-memory phase9-m5-prompt-registry ai-agent-f1 ai-live-stages p30-ai-latency-cache p25-chat-cache ai-chat-history p06-personal-tutor honesty-guard i18n-guard p15-pwa-offline p21-ai-agent-ui dead-handler-guard panel-fullscreen sky-onboarding seo-routing sky-agent-tools account-retirement sky-daily-report sky-web-search phase9-m6-tool-registry; do
            echo "::group::$f"; node "$f.test.mjs"; echo "::endgroup::"
          done
      - name: Commit and push
        if: steps.done.outputs.already != '1'
        run: |
          set -eu
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -qm 'fix(sky): pass TAVILY_API_KEY/TAVILY_DAILY_CAP to the chat handler env (search never ran live)'
          git push origin HEAD:fix/sky-web-env
