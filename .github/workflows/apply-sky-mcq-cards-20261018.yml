name: Apply Sky MCQ cards 2026-10-18

# MCQ Card Engine: applies scripts/apply-sky-mcq-cards-20261018.py on the
# feature branch, regenerates worker-bundle.mjs and sw.js, runs the AI tests and
# commits back to the SAME branch. Never touches main, never deploys.

on:
  push:
    branches: [feat/sky-mcq-cards]
    paths:
      - '.github/workflows/apply-sky-mcq-cards-20261018.yml'
      - 'scripts/apply-sky-mcq-cards-20261018.py'
      - 'sky-mcq.js'
      - 'sky-mcq.test.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-sky-mcq-cards-20261018
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref_name == 'feat/sky-mcq-cards'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/sky-mcq-cards
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply the MCQ-cards patch
        run: |
          set -eu
          test -f sky-mcq.js && test -f sky-mcq.test.mjs
          python3 scripts/apply-sky-mcq-cards-20261018.py
          python3 scripts/apply-sky-mcq-cards-20261018.py >/dev/null
          grep -q 'MCQ.renderJson(src, !!live)' ai-agent-chat.js
          grep -q 'sky-mcq.js?v=mcq1' index.html
          grep -q "'./sky-mcq.js?v=mcq1'" sw.js
          node --check ai-agent-chat.js && node --check sky-tools-client.js && node --check sky-mcq.js
          git diff --stat
      - name: Install, rebuild the Worker bundle and the SW manifest
        run: |
          set -eu
          npm ci --ignore-scripts
          npm run build:worker
          npm run check:worker-bundle
          npm run sw:manifest
      - name: AI tests
        run: |
          set -eu
          for f in sky-mcq sky-agent-tools pr3-shared-answers pr2-fast-start sky-core-memory phase9-m5-prompt-registry ai-agent-f1 ai-live-stages p30-ai-latency-cache p25-chat-cache phase9-m10-observability phase9-m8-response-validation ai-chat-history p06-personal-tutor phase9-m4-context-engine ai-provider-adapters p26-tier-router p27-history-trim p28-provider-health p31-model-priority honesty-guard i18n-guard account-data-isolation p21-ai-agent-ui dead-handler-guard panel-fullscreen sky-onboarding sky-instructions sky-recall sky-web-search ai-audit-fixes p29-ai-status-privacy; do
            echo "::group::$f"; node "$f.test.mjs"; echo "::endgroup::"
          done
      - name: Commit and push to the feature branch
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai-agent.js ai-agent-chat.js sky-tools-client.js index.html sw.js worker-bundle.mjs
          if git diff --cached --quiet; then echo 'Nothing to commit (already applied).'; else
            git commit -m 'feat(sky): MCQ Card Engine wired into the chat; regenerate worker bundle and sw.js' -m 'Applied by apply-sky-mcq-cards-20261018.yml. No deploy.'
            git push origin HEAD:feat/sky-mcq-cards
          fi
