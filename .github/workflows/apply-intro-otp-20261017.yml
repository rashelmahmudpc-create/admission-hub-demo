name: Apply intro OTP chain 2026-10-17

# Fresh Start phase 1. Applies scripts/apply-intro-otp-20261017.py on the
# feature branch: the email-intro-continue button now calls the OTP chain
# (/email-ownership/start) instead of sending the Firebase link directly; the
# Worker still falls back to the Firebase link itself. Regenerates the sw.js
# digests, runs the tests and commits back to the SAME branch. Never touches
# main and never deploys.

on:
  push:
    branches: [fix/intro-otp-chain]
    paths:
      - '.github/workflows/apply-intro-otp-20261017.yml'
      - 'scripts/apply-intro-otp-20261017.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-intro-otp-20261017
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref_name == 'fix/intro-otp-chain'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/intro-otp-chain
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply the patch (twice, must be idempotent)
        run: |
          set -eu
          python3 scripts/apply-intro-otp-20261017.py
          python3 scripts/apply-intro-otp-20261017.py
          grep -q "addEventListener('click', beginEmailIntro);" account-access.js
          node --check account-access.js
          git diff --stat
      - name: Install, worker bundle check, refresh the service-worker digests
        run: |
          set -eu
          npm ci
          npm run check:worker-bundle
          npm run sw:manifest
      - name: Email verification UI tests (must pass)
        run: node --test --test-concurrency=1 signup-autosave.test.mjs telegram-otp-ui.test.mjs firebase-auth-ui.test.mjs dead-handler-guard.test.mjs
      - name: Wider auth UI tests (informational; these fail on main too, async-after-close leaks)
        continue-on-error: true
        run: node --test --test-concurrency=1 premium-onboarding-ui.test.mjs multimethod-auth-ui.test.mjs
      - name: Commit and push to the feature branch
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add account-access.js signup-autosave.test.mjs docs/fresh-start-plan.md sw.js
          if git diff --cached --quiet; then echo 'Nothing to commit (already applied).'; else
            git commit -m 'fix(auth): email-intro-continue goes through the OTP chain, Firebase link only as the Worker fallback (Fresh Start phase 1)' -m 'Applied by apply-intro-otp-20261017.yml. No deploy.'
            git push origin HEAD:fix/intro-otp-chain
          fi
          npm run check:sw-manifest
